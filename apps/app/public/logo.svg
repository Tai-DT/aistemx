<svg width="400" height="100" viewBox="0 0 400 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-ax-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="logo-ax-emerald" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="35%" stop-color="#059669" />
      <stop offset="75%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="logo-ax-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="logo-ax-orbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="logo-ax-text-x" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Left Mark (scaled) -->
  <g transform="translate(10, 5) scale(0.75)">
    <!-- Science Orbital Ellipse -->
    <ellipse cx="60" cy="60" rx="48" ry="17" transform="rotate(-28 60 60)" stroke="url(#logo-ax-orbit)" stroke-width="2.6" stroke-dasharray="4 2" stroke-linecap="round"/>
    <circle cx="21" cy="40" r="3.4" fill="#38bdf8" />
    <circle cx="99" cy="80" r="3.4" fill="#34d399" />

    <!-- Futuristic X Beams -->
    <path d="M26 24 L38 20 L94 96 L82 100 Z" fill="url(#logo-ax-blue)" />
    <path d="M94 24 L82 20 L26 96 L38 100 Z" fill="url(#logo-ax-emerald)" />
    <path d="M52 52 L68 52 L60 68 Z" fill="url(#logo-ax-blue)" opacity="0.85"/>

    <!-- Spark -->
    <path d="M60 49 L62.8 57.2 L71 60 L62.8 62.8 L60 71 L57.2 62.8 L49 60 L57.2 57.2 Z" fill="url(#logo-ax-spark)"/>
    <circle cx="60" cy="60" r="2.2" fill="#ffffff" />
  </g>

  <!-- Right Typography -->
  <g transform="translate(110, 0)">
    <text x="0" y="52" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" fill="#0f172a" letter-spacing="-1">AISTEM<tspan fill="url(#logo-ax-text-x)">X</tspan></text>
    
    <!-- .COM Badge -->
    <rect x="200" y="24" width="54" height="22" rx="6" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <text x="227" y="39" font-family="'Outfit', system-ui, sans-serif" font-size="11" font-weight="800" fill="#0369a1" text-anchor="middle" letter-spacing="0.5">.COM</text>

    <!-- Tagline -->
    <text x="2" y="74" font-family="'Inter', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="1.2">HỆ TRI THỨC KHOA HỌC &amp; AI STEM QUỐC TẾ</text>
  </g>
</svg>
