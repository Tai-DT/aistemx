[project]
name = "aistem-engine"
version = "0.1.0"
description = "Hệ thống xử lí bài toán trên kho dữ liệu AISTEM — đọc đề, phân loại, truy xuất, giải từng bước, kiểm chứng bằng CAS, chấm bài, gợi ý luyện tập"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "rich>=13.9",
    "sympy>=1.13",
    "lark>=1.2",
    "antlr4-python3-runtime==4.11.*",
    "pint>=0.24",
    "anthropic>=0.40",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]
embed = ["voyageai>=0.3"]

[project.scripts]
aistem = "aistem.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aistem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "RUF"]
ignore = [
    # Lớp CAS cố ý bắt `Exception` rộng: parser LaTeX và SymPy ném ra đủ loại
    # ngoại lệ không có tổ tiên chung, và triết lí ở đây là "không đọc được thì
    # trả chưa-kết-luận", chứ một biểu thức lạ không được phép làm hỏng request.
    "BLE001",
    "S110",
    "S112",
    # `×`, `≈`, `±` trong chuỗi và chú thích là ký hiệu toán thật, không phải
    # chữ Latinh gõ nhầm — cả kho dữ liệu dùng chúng.
    "RUF001",
    "RUF002",
    "RUF003",
    # RecordKind kế thừa cả `str` lẫn `Enum` để tuần tự hoá thẳng ra JSON.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Typer đọc chú thích kiểu để dựng tham số dòng lệnh; `Optional[X]` là cách
# viết nó hỗ trợ chắc chắn nhất.
"aistem/cli.py" = ["UP045", "UP007"]
