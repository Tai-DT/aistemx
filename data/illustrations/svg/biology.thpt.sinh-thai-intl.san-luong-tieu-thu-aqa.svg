<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" role="img" aria-label="Dòng năng lượng qua một bậc dinh dưỡng"><title>Dòng năng lượng qua một bậc dinh dưỡng</title><desc>Năng lượng trong thức ăn lấy vào (I) chia thành phần không đồng hoá được thải ra (F) và phần đồng hoá (A); phần đồng hoá lại chia thành bài tiết (U), hô hấp (R) và sản lượng tích luỹ (P).</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="520" height="280"/><rect x="30" y="96" width="120" height="66" class="fill-a"/><rect x="30" y="96" width="120" height="66" class="ink"/><text x="90" y="126" text-anchor="middle" class="lbl">I</text><text x="90" y="148" text-anchor="middle" class="lbl-sm">thức ăn lấy vào</text><rect x="200" y="96" width="120" height="66" class="fill-a"/><rect x="200" y="96" width="120" height="66" class="ink"/><text x="260" y="126" text-anchor="middle" class="lbl">A</text><text x="260" y="148" text-anchor="middle" class="lbl-sm">đồng hoá</text><rect x="370" y="96" width="120" height="66" class="fill-a"/><rect x="370" y="96" width="120" height="66" class="ink"/><text x="430" y="126" text-anchor="middle" class="lbl">P</text><text x="430" y="148" text-anchor="middle" class="lbl-sm">sản lượng</text><line x1="152" y1="129" x2="196" y2="129" class="accent-a" stroke-width="2.5"/><polygon points="196,129 189.072,133 189.072,125" class="accent-a" stroke="none" fill-opacity="1"/><line x1="322" y1="129" x2="366" y2="129" class="accent-a" stroke-width="2.5"/><polygon points="366,129 359.072,133 359.072,125" class="accent-a" stroke="none" fill-opacity="1"/><line x1="90" y1="164" x2="90" y2="214" class="accent-b" stroke-width="2.5"/><polygon points="90,214 86,207.072 94,207.072" class="accent-b" stroke="none" fill-opacity="1"/><text x="98" y="212" text-anchor="start" class="lbl-sm">F — phân (không đồng hoá)</text><line x1="286" y1="164" x2="286" y2="214" class="accent-b" stroke-width="2.5"/><polygon points="286,214 282,207.072 290,207.072" class="accent-b" stroke="none" fill-opacity="1"/><text x="294" y="212" text-anchor="start" class="lbl-sm">R — hô hấp</text><text x="30" y="254" text-anchor="start" class="lbl">N = I − (F + R)</text></svg>