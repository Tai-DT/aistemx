<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 370" role="img" aria-label="Tam giác ABC"><title>Tam giác ABC</title><desc>Tam giác ABC với cạnh a = BC, b = CA, c = AB đối diện các đỉnh A, B, C.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="412" height="370"/><polygon points="206,56 56,314 356,314" class="fill-a"/><polyline points="206,56 56,314 356,314 206,56" class="ink" fill="none"/><text x="206" y="334.5" text-anchor="middle" class="lbl">a</text><text x="294.88" y="181.542" text-anchor="middle" class="lbl">b</text><text x="117.12" y="181.542" text-anchor="middle" class="lbl">c</text><line x1="275.813" y1="188.016" x2="286.187" y2="181.984" class="ink-thin"/><line x1="136.187" y1="188.016" x2="125.813" y2="181.984" class="ink-thin"/><path d="M 80 314 A 24 24 0 0 0 68.063 293.252" class="accent-d" style="fill:none" stroke-width="1.8"/><text x="89.804" y="299.051" text-anchor="middle" class="lbl-sm">B</text><path d="M 343.937 293.252 A 24 24 0 0 0 332 314" class="accent-d" style="fill:none" stroke-width="1.8"/><text x="322.196" y="299.051" text-anchor="middle" class="lbl-sm">C</text><text x="206" y="43.5" text-anchor="middle" class="lbl">A</text><text x="41.252" y="326.956" text-anchor="middle" class="lbl">B</text><text x="370.748" y="326.956" text-anchor="middle" class="lbl">C</text></svg>