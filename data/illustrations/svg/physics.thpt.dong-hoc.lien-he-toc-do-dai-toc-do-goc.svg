<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" role="img" aria-label="Chuyển động tròn đều"><title>Chuyển động tròn đều</title><desc>Vật chuyển động tròn đều: vectơ vận tốc tiếp tuyến với quỹ đạo, gia tốc hướng tâm hướng vào tâm.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="380" height="300"/><circle cx="168" cy="152" r="96" class="ink-thin" stroke-dasharray="6 5"/><circle cx="168" cy="152" r="3.4" class="accent-b"/><text x="156" y="157" text-anchor="end" class="lbl">O</text><line x1="168" y1="152" x2="232.237" y2="80.658" class="ink"/><text x="211.265" y="130.366" text-anchor="middle" class="lbl">r</text><circle cx="232.237" cy="80.658" r="5" class="accent-a"/><line x1="232.237" y1="80.658" x2="183.189" y2="36.495" class="accent-a" stroke-width="2.5"/><polygon points="183.189,36.495 191.992,38.367 185.97,45.055" class="accent-a" stroke="none" fill-opacity="1"/><text x="189.189" y="32.495" text-anchor="start" class="lbl">v</text><line x1="168" y1="152" x2="146.405" y2="58.46" class="ink-thin" stroke-dasharray="5 4"/><circle cx="146.405" cy="58.46" r="4" class="accent-c"/><path d="M 196.103 120.788 A 42 42 0 0 0 158.552 111.076" class="accent-d" style="fill:none;stroke-width:1.8"/><text x="180.519" y="107.593" text-anchor="start" class="lbl-sm">Δφ</text><path d="M 152.413 41.09 A 112 112 0 0 0 75.148 89.37" class="accent-c" style="fill:none;stroke-width:2"/><polygon points="75.148,89.37 75.984,81.414 82.211,85.615" class="accent-c" stroke="none" fill-opacity="1"/><text x="92" y="36" text-anchor="start" class="lbl">ω</text><text x="368" y="254" text-anchor="end" class="lbl-sm">tốc độ không đổi,</text><text x="368" y="270" text-anchor="end" class="lbl-sm">hướng vận tốc đổi liên tục</text></svg>