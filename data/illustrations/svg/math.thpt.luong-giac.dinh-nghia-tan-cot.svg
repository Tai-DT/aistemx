<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 272" role="img" aria-label="Đường tròn lượng giác"><title>Đường tròn lượng giác</title><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="272" height="272"/><line x1="28" y1="136" x2="246" y2="136" class="axis" stroke-width="2.5"/><polygon points="246,136 239.938,139.5 239.938,132.5" class="axis" stroke="none" fill-opacity="1"/><line x1="136" y1="244" x2="136" y2="26" class="axis" stroke-width="2.5"/><polygon points="136,26 139.5,32.062 132.5,32.062" class="axis" stroke="none" fill-opacity="1"/><circle cx="136" cy="136" r="96" class="ink"/><path d="M 164 136 A 28 28 0 0 0 153.239 113.936" class="accent-d" stroke-width="2"/><line x1="195.104" y1="60.351" x2="195.104" y2="136" class="accent-b" stroke-dasharray="4 3" stroke-width="1.6"/><line x1="136" y1="136" x2="195.104" y2="136" class="accent-c" stroke-width="2"/><line x1="136" y1="136" x2="195.104" y2="60.351" class="accent-a" stroke-width="2.5"/><polygon points="195.104,60.351 193.99,68.273 187.686,63.348" class="accent-a" stroke="none" fill-opacity="1"/><circle cx="195.104" cy="60.351" r="3.4" class="accent-a"/><text x="203.104" y="54.351" text-anchor="start" class="lbl-sm">(0.62; 0.79)</text><text x="170" y="128" text-anchor="start" class="lbl-sm">θ = 52°</text><text x="165.552" y="152" text-anchor="middle" class="lbl-sm">cos θ</text><text x="201.104" y="98.175" text-anchor="start" class="lbl-sm">sin θ</text></svg>