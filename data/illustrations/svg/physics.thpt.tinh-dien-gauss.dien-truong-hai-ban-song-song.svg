<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 280" role="img" aria-label="Điện trường đều giữa hai bản song song"><title>Điện trường đều giữa hai bản song song</title><desc>Hai bản kim loại song song tích điện trái dấu, đường sức điện đều hướng từ bản dương sang bản âm.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="430" height="280"/><line x1="76" y1="70" x2="344" y2="70" class="ink" style="stroke-width:4"/><line x1="76" y1="200" x2="344" y2="200" class="ink" style="stroke-width:4"/><text x="102.8" y="61" text-anchor="middle" class="lbl-sm">+</text><text x="102.8" y="217" text-anchor="middle" class="lbl-sm">−</text><text x="156.4" y="61" text-anchor="middle" class="lbl-sm">+</text><text x="156.4" y="217" text-anchor="middle" class="lbl-sm">−</text><text x="210" y="61" text-anchor="middle" class="lbl-sm">+</text><text x="210" y="217" text-anchor="middle" class="lbl-sm">−</text><text x="263.6" y="61" text-anchor="middle" class="lbl-sm">+</text><text x="263.6" y="217" text-anchor="middle" class="lbl-sm">−</text><text x="317.2" y="61" text-anchor="middle" class="lbl-sm">+</text><text x="317.2" y="217" text-anchor="middle" class="lbl-sm">−</text><line x1="95.143" y1="74" x2="95.143" y2="196" class="accent-a" style="stroke-width:1.5"/><polygon points="95.143,135 91.643,128.938 98.643,128.938" class="accent-a" stroke="none" fill-opacity="1"/><line x1="133.429" y1="74" x2="133.429" y2="196" class="accent-a" style="stroke-width:1.5"/><polygon points="133.429,135 129.929,128.938 136.929,128.938" class="accent-a" stroke="none" fill-opacity="1"/><line x1="171.714" y1="74" x2="171.714" y2="196" class="accent-a" style="stroke-width:1.5"/><polygon points="171.714,135 168.214,128.938 175.214,128.938" class="accent-a" stroke="none" fill-opacity="1"/><line x1="210" y1="74" x2="210" y2="196" class="accent-a" style="stroke-width:1.5"/><polygon points="210,135 206.5,128.938 213.5,128.938" class="accent-a" stroke="none" fill-opacity="1"/><line x1="248.286" y1="74" x2="248.286" y2="196" class="accent-a" style="stroke-width:1.5"/><polygon points="248.286,135 244.786,128.938 251.786,128.938" class="accent-a" stroke="none" fill-opacity="1"/><line x1="286.571" y1="74" x2="286.571" y2="196" class="accent-a" style="stroke-width:1.5"/><polygon points="286.571,135 283.071,128.938 290.071,128.938" class="accent-a" stroke="none" fill-opacity="1"/><line x1="324.857" y1="74" x2="324.857" y2="196" class="accent-a" style="stroke-width:1.5"/><polygon points="324.857,135 321.357,128.938 328.357,128.938" class="accent-a" stroke="none" fill-opacity="1"/><text x="354" y="140" text-anchor="start" class="lbl">E</text><text x="64" y="140" text-anchor="end" class="lbl">U</text><line x1="380" y1="70" x2="380" y2="200" class="ink-thin"/><polygon points="380,200 377,194.804 383,194.804" class="ink-thin" stroke="none" fill-opacity="1"/><polygon points="380,70 383,75.196 377,75.196" class="ink-thin" stroke="none" fill-opacity="1"/><text x="380" y="129" text-anchor="middle" class="lbl-sm">d</text><text x="215" y="266" text-anchor="middle" class="lbl-sm">E = σ/ε₀ = U/d giữa hai bản tích điện trái dấu</text></svg>