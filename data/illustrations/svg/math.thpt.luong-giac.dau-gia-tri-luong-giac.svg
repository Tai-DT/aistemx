<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 504 432" role="img" aria-label="Dấu của các giá trị lượng giác theo góc phần tư"><title>Dấu của các giá trị lượng giác theo góc phần tư</title><desc>Bốn góc phần tư của đường tròn lượng giác và dấu của sin, cos, tan, cot ở mỗi phần tư.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
