<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 336" role="img" aria-label="Sơ đồ Venn ba tập"><title>Sơ đồ Venn ba tập</title><desc>Sơ đồ Venn của ba biến cố trong không gian mẫu.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="430" height="336"/><rect x="26" y="44" width="378" height="250" class="ink-thin"/><text x="36" y="64" text-anchor="start" class="lbl">Ω</text><circle cx="163" cy="139" r="76" class="fill-a"/><circle cx="267" cy="139" r="76" class="fill-a"/><circle cx="215" cy="199" r="76" class="fill-a"/><circle cx="163" cy="139" r="76" class="ink"/><circle cx="267" cy="139" r="76" class="ink"/><circle cx="215" cy="199" r="76" class="ink"/><text x="123" y="109" text-anchor="middle" class="lbl">A</text><text x="307" y="109" text-anchor="middle" class="lbl">B</text><text x="215" y="251" text-anchor="middle" class="lbl">C</text><text x="215" y="320" text-anchor="middle" class="lbl-sm">càng đậm càng bị đếm nhiều lần: 1 lớp, 2 lớp, 3 lớp</text></svg>