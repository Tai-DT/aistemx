<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Định luật Kepler về quỹ đạo hành tinh"><title>Định luật Kepler về quỹ đạo hành tinh</title><desc>Chuyển động của hành tinh trên quỹ đạo elip quanh Mặt Trời.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="480" height="320"/><path d="M 60.0 160.0 A 160.0 100.0 0 1 0 380.0 160.0 A 160.0 100.0 0 1 0 60.0 160.0" class="curve" stroke-dasharray="6 4" stroke-width="2"/><circle cx="126.325" cy="160" r="14" class="accent-d" fill-opacity="1"/><text x="126.325" y="186" text-anchor="middle" class="lbl-sm">Mặt Trời (Tiêu điểm)</text><text x="240" y="35" text-anchor="middle" class="lbl" font-size="16px">Định luật I Kepler: Quỹ đạo Elip</text><text x="240" y="60" text-anchor="middle" class="lbl-sm">Mặt Trời nằm tại một trong hai tiêu điểm của hình elip</text><line x1="60" y1="160" x2="380" y2="160" class="ink-thin" stroke-dasharray="3 3"/><circle cx="60" cy="160" r="4" class="accent-b"/><text x="50" y="150" text-anchor="start" class="lbl-sm">Cận điểm P</text><text x="50" y="178" text-anchor="start" class="lbl-sm">(Gần nhất, v_max)</text><circle cx="380" cy="160" r="4" class="accent-a"/><text x="386" y="150" text-anchor="start" class="lbl-sm">Viễn điểm A</text><text x="386" y="178" text-anchor="start" class="lbl-sm">(Xa nhất, v_min)</text><line x1="220" y1="135" x2="380" y2="135" class="accent-c" stroke-width="1.8"/><line x1="240" y1="135" x2="220" y2="135" class="accent-c" stroke-width="2.5"/><polygon points="220,135 224.33,132.5 224.33,137.5" class="accent-c" stroke="none" fill-opacity="1"/><line x1="360" y1="135" x2="380" y2="135" class="accent-c" stroke-width="2.5"/><polygon points="380,135 375.67,137.5 375.67,132.5" class="accent-c" stroke="none" fill-opacity="1"/><text x="300" y="128" text-anchor="middle" class="lbl-sm">Bán trục lớn a</text></svg>