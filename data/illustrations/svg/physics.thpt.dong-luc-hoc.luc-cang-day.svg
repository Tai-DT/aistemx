<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 306" role="img" aria-label="Sơ đồ lực - vật treo trên dây"><title>Sơ đồ lực - vật treo trên dây</title><desc>Vật treo bằng dây: lực căng dây hướng lên, trọng lực hướng xuống.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="320" height="306"/><line x1="60" y1="44" x2="224" y2="44" class="ink"/><line x1="67.5" y1="44" x2="60.75" y2="35" class="ink-thin"/><line x1="82.5" y1="44" x2="75.75" y2="35" class="ink-thin"/><line x1="97.5" y1="44" x2="90.75" y2="35" class="ink-thin"/><line x1="112.5" y1="44" x2="105.75" y2="35" class="ink-thin"/><line x1="127.5" y1="44" x2="120.75" y2="35" class="ink-thin"/><line x1="142.5" y1="44" x2="135.75" y2="35" class="ink-thin"/><line x1="157.5" y1="44" x2="150.75" y2="35" class="ink-thin"/><line x1="172.5" y1="44" x2="165.75" y2="35" class="ink-thin"/><line x1="187.5" y1="44" x2="180.75" y2="35" class="ink-thin"/><line x1="202.5" y1="44" x2="195.75" y2="35" class="ink-thin"/><line x1="217.5" y1="44" x2="210.75" y2="35" class="ink-thin"/><line x1="140" y1="44" x2="140" y2="166" class="ink"/><polygon points="109,167 171,167 171,213 109,213" class="fill-a"/><polyline points="109,167 171,167 171,213 109,213 109,167" class="ink" fill="none"/><line x1="140" y1="166" x2="140" y2="96" class="accent-c" stroke-width="2.5"/><polygon points="140,96 144.5,103.794 135.5,103.794" class="accent-c" stroke="none" fill-opacity="1"/><text x="148" y="98" text-anchor="start" class="lbl">T</text><line x1="140" y1="190" x2="140" y2="260" class="accent-b" stroke-width="2.5"/><polygon points="140,260 135.5,252.206 144.5,252.206" class="accent-b" stroke="none" fill-opacity="1"/><text x="148" y="260" text-anchor="start" class="lbl">P</text><line x1="232" y1="210" x2="232" y2="142" class="ink" stroke-width="2"/><polygon points="232,142 235.052,147.739 228.948,147.739" class="lbl" stroke="none" fill-opacity="1"/><text x="238" y="180" text-anchor="start" class="lbl">a</text></svg>