thin" stroke-dasharray="4 4"/><circle cx="176" cy="44" r="8.5" class="fill-a"/><circle cx="176" cy="44" r="8.5" class="ink"/><text x="126" y="48" text-anchor="end" class="lbl-sm">t = 3Δt (v = 0)</text><line x1="232" y1="280" x2="232" y2="148.889" class="accent-d" stroke-width="1.3"/><polygon points="232,148.889 235.052,154.628 228.948,154.628" class="accent-d" stroke="none" fill-opacity="1"/><polygon points="232,280 228.948,274.261 235.052,274.261" class="accent-d" stroke="none" fill-opacity="1"/><text x="240" y="218.444" text-anchor="start" class="lbl-sm">5</text><line x1="232" y1="148.889" x2="232" y2="70.222" class="accent-d" stroke-width="1.3"/><polygon points="232,70.222 235.052,75.961 228.948,75.961" class="accent-d" stroke="none" fill-opacity="1"/><polygon points="232,148.889 228.948,143.15 235.052,143.15" class="accent-d" stroke="none" fill-opacity="1"/><text x="240" y="113.556" text-anchor="start" class="lbl-sm">3</text><line x1="232" y1="70.222" x2="232" y2="44" class="accent-d" stroke-width="1.3"/><polygon points="232,44 235.052,49.739 228.948,49.739" class="accent-d" stroke="none" fill-opacity="1"/><polygon points="232,70.222 228.948,64.483 235.052,64.483" class="accent-d" stroke="none" fill-opacity="1"/><text x="240" y="61.111" text-anchor="start" class="lbl-sm">1</text><line x1="284" y1="280" x2="284" y2="44" class="accent-b" stroke-width="1.3"/><polygon points="284,44 287.052,49.739 280.948,49.739" class="accent-b" stroke="none" fill-opacity="1"/><polygon points="284,280 280.948,274.261 287.052,274.261" class="accent-b" stroke="none" fill-opacity="1"/><text x="292" y="166" text-anchor="start" class="lbl-sm">h = 45 m</text><line x1="198" y1="274" x2="198" y2="220" class="accent-a" stroke-width="2.5"/><polygon points="198,220 202,226.928 194,226.928" class="accent-a" stroke="none" fill-opacity="1"/><text x="204" y="226" text-anchor="start" class="lbl">v<tspan dy="4" font-size="10">0</tspan></text><line x1="44" y1="96" x2="44" y2="146" class="accent-b" stroke-width="2.5"/><polygon points="44,146 40,139.072 48,139.072" class="accent-b" stroke="none" fill-opacity="1"/><text x="50" y="126" text-anchor="start" class="lbl">g</text><text x="386" y="332" text-anchor="end" class="lbl-sm">lên chậm dần: quãng đường các khoảng bằng nhau tỉ lệ 5 : 3 : 1</text></svg>