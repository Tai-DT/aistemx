<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 312" role="img" aria-label="Đường đặc biệt trong tam giác"><title>Đường đặc biệt trong tam giác</title><desc>Phân giác trong AD của góc A chia cạnh BC theo tỉ số DB : DC = AB : AC.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="412" height="312"/><polygon points="151,56 56,256 356,256" class="fill-a"/><polyline points="151,56 56,256 356,256 151,56" class="ink" fill="none"/><line x1="151" y1="56" x2="186.805" y2="256" class="accent-b" stroke-width="2.2"/><path d="M 141.561 75.872 A 22 22 0 0 0 154.877 77.656" class="accent-d" style="fill:none" stroke-width="1.8"/><path d="M 155.934 83.562 A 28 28 0 0 0 171.042 75.553" class="accent-d" style="fill:none" stroke-width="1.8"/><text x="154.137" y="163.143" text-anchor="middle" class="lbl">l<tspan font-size="70%" dy="3.5">a</tspan></text><text x="186.805" y="279.5" text-anchor="middle" class="lbl-sm">D</text><text x="121.402" y="281.5" text-anchor="middle" class="lbl-sm">DB</text><text x="271.402" y="281.5" text-anchor="middle" class="lbl-sm">DC</text><text x="146.492" y="44.109" text-anchor="middle" class="lbl">A</text><text x="40.833" y="268.179" text-anchor="middle" class="lbl">B</text><text x="371.806" y="266.76" text-anchor="middle" class="lbl">C</text></svg>