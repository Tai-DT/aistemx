<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 422 267" role="img" aria-label="Hệ thức lượng trong tam giác vuông"><title>Hệ thức lượng trong tam giác vuông</title><desc>Trong tam giác vuông tại A, trung tuyến AM ứng với cạnh huyền bằng nửa cạnh huyền: AM = MB = MC.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="422" height="267"/><polygon points="167.6,62.2 56,211 366,211" class="fill-a"/><polyline points="167.6,62.2 56,211 366,211 167.6,62.2" class="ink" fill="none"/><polyline points="159.8,72.6 170.2,80.4 178,70" class="ink-thin" fill="none"/><path d="M 366 211 A 155 155 0 0 0 56 211" class="ink-thin" style="fill:none" stroke-dasharray="4 3" stroke-width="1.2"/><line x1="167.6" y1="62.2" x2="211" y2="211" class="accent-b" stroke-width="2.2"/><line x1="195.06" y1="134.92" x2="183.54" y2="138.28" class="ink-thin"/><line x1="133.5" y1="205" x2="133.5" y2="217" class="ink-thin"/><line x1="288.5" y1="205" x2="288.5" y2="217" class="ink-thin"/><text x="211" y="234.5" text-anchor="middle" class="lbl-sm">M</text><text x="174.9" y="145.3" text-anchor="middle" class="lbl">m<tspan font-size="70%" dy="3.5">a</tspan></text><text x="97.404" y="136.887" text-anchor="middle" class="lbl">c = 3</text><text x="280.945" y="136.108" text-anchor="middle" class="lbl">b = 4</text><text x="162.84" y="50.38" text-anchor="middle" class="lbl">A</text><text x="39.969" y="221.158" text-anchor="middle" class="lbl">B</text><text x="382.316" y="220.275" text-anchor="middle" class="lbl">C</text></svg>