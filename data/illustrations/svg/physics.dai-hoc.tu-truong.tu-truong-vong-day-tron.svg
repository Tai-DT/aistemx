<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Từ trường tại tâm dòng điện tròn"><title>Từ trường tại tâm dòng điện tròn</title><desc>Vòng dây tròn nhìn chính diện; cảm ứng từ tại tâm vuông góc với mặt phẳng vòng dây.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="320" height="320"/><circle cx="154" cy="154" r="104" class="ink" style="stroke-width:2.5"/><polygon points="206,63.933 215,63.933 210.5,71.728" class="accent-b" stroke="none" fill-opacity="1"/><polygon points="50,154 45.5,146.206 54.5,146.206" class="accent-b" stroke="none" fill-opacity="1"/><polygon points="206,244.067 201.5,251.861 197,244.067" class="accent-b" stroke="none" fill-opacity="1"/><text x="266" y="146" text-anchor="start" class="lbl">I</text><line x1="154" y1="154" x2="239.192" y2="94.348" class="ink-thin" style="stroke-dasharray:5 4"/><text x="206" y="124.88" text-anchor="start" class="lbl">R</text><circle cx="154" cy="154" r="13" class="ink-thin"/><circle cx="154" cy="154" r="4.2" class="accent-c"/><text x="174" y="159" text-anchor="start" class="lbl">B</text><text x="160" y="310" text-anchor="middle" class="lbl-sm">B hướng ra khỏi mặt phẳng hình vẽ</text></svg>