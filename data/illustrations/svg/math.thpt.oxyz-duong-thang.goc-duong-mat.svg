<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" role="img" aria-label="Đường thẳng trong không gian Oxyz"><title>Đường thẳng trong không gian Oxyz</title><desc>Phương trình tham số, chính tắc và góc, khoảng cách của đường thẳng.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="460" height="320"/><polygon points="50,250 320,250 400,160 130,160" class="fill-a"/><polyline points="50,250 320,250 400,160 130,160 50,250" class="ink" fill="none"/><text x="70" y="240" text-anchor="start" class="lbl">(P)</text><circle cx="180" cy="205" r="3.5" class="accent-a"/><text x="166" y="211" text-anchor="start" class="lbl">A</text><line x1="180" y1="205" x2="320" y2="205" class="ink-thin" stroke-dasharray="3 3"/><text x="328" y="205" text-anchor="start" class="lbl-sm">d₁</text><line x1="140" y1="231" x2="180" y2="205" class="accent-c" stroke-dasharray="3 3"/><line x1="180" y1="205" x2="340" y2="100" class="accent-c" stroke-width="2.2"/><text x="345" y="100" text-anchor="start" class="lbl" font-weight="bold">d</text><line x1="270" y1="145" x2="270" y2="205" class="accent-b" stroke-dasharray="3 3"/><circle cx="270" cy="145" r="3" class="accent-a"/><circle cx="270" cy="205" r="3" class="accent-a"/><polyline points="270,197 262,197 262,205" class="ink-thin" fill="none"/><path d="M 210.0 205.0 A 30 30 0 0 0 206.0 190.0" class="accent-b" fill="none" stroke-width="1.8"/><text x="216" y="197" text-anchor="start" class="lbl">φ</text><line x1="180" y1="205" x2="180" y2="115" class="accent-a" stroke-width="2.5"/><polygon points="180,115 183.5,121.062 176.5,121.062" class="accent-a" stroke="none" fill-opacity="1"/><text x="188" y="125" text-anchor="start" class="lbl">n⃗</text><text x="445" y="40" text-anchor="end" class="lbl" font-size="16px">sin φ = |u⃗ · n⃗| / (|u⃗| · |n⃗|)</text><text x="445" y="65" text-anchor="end" class="lbl-sm">Góc giữa đường thẳng và mặt phẳng (0 ≤ φ ≤ 90°)</text></svg>