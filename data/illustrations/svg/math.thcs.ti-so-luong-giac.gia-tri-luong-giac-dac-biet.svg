<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 468 468" role="img" aria-label="Cung đặc biệt: độ và radian"><title>Cung đặc biệt: độ và radian</title><desc>Đường tròn lượng giác với 16 cung đặc biệt, mỗi cung ghi số đo bằng độ và bằng radian.</desc><style>@media (prefers-color-scheme: dark){
