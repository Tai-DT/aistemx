<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 289.581 256.214" role="img" aria-label="Hình chóp"><title>Hình chóp</title><desc>Hình chóp với diện tích đáy và chiều cao được đánh dấu</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="289.581" height="256.214"/><polygon points="231.581,172.882 122.429,146.742 46,184.074 155.152,210.214" class="fill-c"/><line x1="231.581" y1="172.882" x2="122.429" y2="146.742" class="ink-thin" stroke-dasharray="6 5"/><line x1="122.429" y1="146.742" x2="46" y2="184.074" class="ink-thin" stroke-dasharray="6 5"/><line x1="122.429" y1="146.742" x2="138.791" y2="34" class="ink-thin" stroke-dasharray="6 5"/><line x1="46" y1="184.074" x2="155.152" y2="210.214" class="ink"/><line x1="231.581" y1="172.882" x2="155.152" y2="210.214" class="ink"/><line x1="231.581" y1="172.882" x2="138.791" y2="34" class="ink"/><line x1="46" y1="184.074" x2="138.791" y2="34" class="ink"/><line x1="155.152" y1="210.214" x2="138.791" y2="34" class="ink"/><line x1="138.791" y1="178.478" x2="138.791" y2="34" class="accent-b" stroke-dasharray="6 5" stroke-width="1.6"/><polyline points="128.093,175.916 128.093,164.916 138.791,167.478" class="ink-thin" fill="none"/><text x="121.307" y="106.239" text-anchor="end" class="lbl">h</text><text x="100.576" y="218.144" text-anchor="middle" class="lbl">a</text><text x="146.791" y="183.478" text-anchor="start" class="lbl-sm">S đáy</text></svg>