<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 310" role="img" aria-label="Con lắc đơn"><title>Con lắc đơn</title><desc>Con lắc đơn lệch góc alpha: trọng lực phân tích thành thành phần tiếp tuyến (lực kéo về) và thành phần dọc dây.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="420" height="310"/><line x1="96" y1="46" x2="220" y2="46" class="ink"/><line x1="103.5" y1="46" x2="96.75" y2="37" class="ink-thin"/><line x1="118.5" y1="46" x2="111.75" y2="37" class="ink-thin"/><line x1="133.5" y1="46" x2="126.75" y2="37" class="ink-thin"/><line x1="148.5" y1="46" x2="141.75" y2="37" class="ink-thin"/><line x1="163.5" y1="46" x2="156.75" y2="37" class="ink-thin"/><line x1="178.5" y1="46" x2="171.75" y2="37" class="ink-thin"/><line x1="193.5" y1="46" x2="186.75" y2="37" class="ink-thin"/><line x1="208.5" y1="46" x2="201.75" y2="37" class="ink-thin"/><line x1="158" y1="46" x2="158" y2="234" class="ink-thin" stroke-dasharray="5 5"/><line x1="158" y1="46" x2="261.45" y2="188.387" class="ink"/><text x="197.725" y="117.193" text-anchor="end" class="lbl">ℓ</text><path d="M 158 90 A 44 44 0 0 0 183.863 81.597" class="accent-d" style="fill:none;stroke-width:1.8"/><text x="178.687" y="101.357" text-anchor="start" class="lbl">α</text><path d="M 158 222 A 176 176 0 0 0 261.45 188.387" class="accent-c" style="fill:none;stroke-width:2"/><text x="220.421" y="242.113" text-anchor="middle" class="lbl-sm">s = αℓ</text><circle cx="158" cy="222" r="3.2" class="accent-c"/><circle cx="261.45" cy="188.387" r="13" class="fill-a"/><circle cx="261.45" cy="188.387" r="13" class="ink"/><line x1="261.45" y1="188.387" x2="261.45" y2="250.387" class="accent-b" stroke-width="2.5"/><polygon points="261.45,250.387 256.95,242.593 265.95,242.593" class="accent-b" stroke="none" fill-opacity="1"/><text x="268.45" y="252.387" text-anchor="start" class="lbl">P</text><line x1="261.45" y1="188.387" x2="231.967" y2="209.807" class="accent-d" stroke-width="2.5"/><polygon points="231.967,209.807 235.221,202.499 239.924,208.971" class="accent-d" stroke="none" fill-opacity="1"/><line x1="261.45" y1="188.387" x2="290.933" y2="228.967" class="accent-d" stroke-width="2.5"/><polygon points="290.933,228.967 283.625,225.713 290.097,221.01" class="accent-d" stroke="none" fill-opacity="1"/><line x1="231.967" y1="209.807" x2="261.45" y2="250.387" class="ink-thin" stroke-dasharray="4 4"/><line x1="290.933" y1="228.967" x2="261.45" y2="250.387" class="ink-thin" stroke-dasharray="4 4"/><text x="223.967" y="201.807" text-anchor="end" class="lbl-sm">P sin α</text><text x="298.933" y="240.967" text-anchor="start" class="lbl-sm">P cos α</text><line x1="261.45" y1="188.387" x2="225.008" y2="138.228" class="accent-c" stroke-width="2.5"/><polygon points="225.008,138.228 232.316,141.482 225.844,146.184" class="accent-c" stroke="none" fill-opacity="1"/><text x="233.008" y="142.228" text-anchor="start" class="lbl">τ</text></svg>