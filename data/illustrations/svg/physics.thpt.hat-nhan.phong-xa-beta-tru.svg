<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Sơ đồ phóng xạ β⁻"><title>Sơ đồ phóng xạ β⁻</title><desc>Vị trí hạt nhân mẹ và hạt nhân con trên lưới số proton Z - số nơtron N.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="400" height="320"/><line x1="66" y1="236" x2="66" y2="36" class="grid"/><line x1="106" y1="236" x2="106" y2="36" class="grid"/><line x1="146" y1="236" x2="146" y2="36" class="grid"/><line x1="186" y1="236" x2="186" y2="36" class="grid"/><line x1="226" y1="236" x2="226" y2="36" class="grid"/><line x1="266" y1="236" x2="266" y2="36" class="grid"/><line x1="306" y1="236" x2="306" y2="36" class="grid"/><line x1="66" y1="236" x2="306" y2="236" class="grid"/><line x1="66" y1="196" x2="306" y2="196" class="grid"/><line x1="66" y1="156" x2="306" y2="156" class="grid"/><line x1="66" y1="116" x2="306" y2="116" class="grid"/><line x1="66" y1="76" x2="306" y2="76" class="grid"/><line x1="66" y1="36" x2="306" y2="36" class="grid"/><line x1="66" y1="236" x2="320" y2="236" class="axis" stroke-width="2.5"/><polygon points="320,236 313.938,239.5 313.938,232.5" class="axis" stroke="none" fill-opacity="1"/><line x1="66" y1="236" x2="66" y2="22" class="axis" stroke-width="2.5"/><polygon points="66,22 69.5,28.062 62.5,28.062" class="axis" stroke="none" fill-opacity="1"/><text x="318" y="254" text-anchor="end" class="lbl">Z</text><text x="74" y="28" text-anchor="start" class="lbl">N</text><circle cx="186" cy="116" r="15" class="fill-b"/><circle cx="186" cy="116" r="15" class="ink"/><circle cx="226" cy="156" r="15" class="fill-c"/><circle cx="226" cy="156" r="15" class="ink"/><text x="186" y="121" text-anchor="middle" class="lbl">X</text><text x="226" y="161" text-anchor="middle" class="lbl">Y</text><text x="167.615" y="101.615" text-anchor="middle" class="lbl-sm">mẹ</text><text x="244.385" y="178.385" text-anchor="middle" class="lbl-sm">con</text><line x1="197.314" y1="127.314" x2="214.686" y2="144.686" class="accent-c" style="stroke-width:2.4"/><polygon points="214.686,144.686 205.993,142.357 212.357,135.993" class="accent-c" stroke="none" fill-opacity="1"/><text x="194.686" y="151.314" text-anchor="end" class="lbl-sm">β⁻  (electron)</text><text x="85.2" y="267" text-anchor="end" class="lbl-sm">A</text><text x="85.2" y="284" text-anchor="end" class="lbl-sm">Z</text><text x="88.2" y="279" text-anchor="start" class="lbl">X</text><text x="110.4" y="279" text-anchor="start" class="lbl-sm">→</text><text x="136.8" y="267" text-anchor="end" class="lbl-sm">0</text><text x="136.8" y="284" text-anchor="end" class="lbl-sm">−1</text><text x="139.8" y="279" text-anchor="start" class="lbl">e</text><text x="162" y="279" text-anchor="start" class="lbl-sm">+</text><text x="195.2" y="267" text-anchor="end" class="lbl-sm">A</text><text x="195.2" y="284" text-anchor="end" class="lbl-sm">Z+1</text><text x="198.2" y="279" text-anchor="start" class="lbl">Y</text><text x="220.4" y="279" text-anchor="start" class="lbl-sm">+ phản nơtrinô</text><text x="200" y="306" text-anchor="middle" class="lbl-sm">ΔZ = +1,  ΔN = -1</text></svg>