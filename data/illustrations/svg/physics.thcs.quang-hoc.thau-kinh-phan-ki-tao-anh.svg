<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 310" role="img" aria-label="Dựng ảnh qua thấu kính phân kì"><title>Dựng ảnh qua thấu kính phân kì</title><desc>Ba tia đặc trưng qua thấu kính mỏng: tia song song trục chính, tia qua quang tâm và tia qua tiêu điểm vật.</desc><style>@media (prefers-color-scheme: dark){
