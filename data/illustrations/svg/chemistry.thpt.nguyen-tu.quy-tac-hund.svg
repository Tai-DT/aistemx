<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 130" role="img" aria-label="Quy tắc Hund cho phân lớp p"><title>Quy tắc Hund cho phân lớp p</title><desc>Dãy 3 ô lượng tử của phân lớp p, điền 4 electron: mỗi ô nhận một electron spin song song trước, sau đó mới ghép đôi.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="396" height="130"/><rect x="46" y="44" width="26" height="26" class="ink"/><rect x="75" y="44" width="26" height="26" class="ink"/><rect x="104" y="44" width="26" height="26" class="ink"/><line x1="54" y1="65" x2="54" y2="49" class="accent-a" stroke-width="2.5"/><polygon points="54,49 56.5,53.33 51.5,53.33" class="accent-a" stroke="none" fill-opacity="1"/><line x1="83" y1="65" x2="83" y2="49" class="accent-a" stroke-width="2.5"/><polygon points="83,49 85.5,53.33 80.5,53.33" class="accent-a" stroke="none" fill-opacity="1"/><line x1="112" y1="65" x2="112" y2="49" class="accent-a" stroke-width="2.5"/><polygon points="112,49 114.5,53.33 109.5,53.33" class="accent-a" stroke="none" fill-opacity="1"/><line x1="64" y1="49" x2="64" y2="65" class="accent-b" stroke-width="2.5"/><polygon points="64,65 61.5,60.67 66.5,60.67" class="accent-b" stroke="none" fill-opacity="1"/><text x="46" y="34" text-anchor="start" class="lbl">p⁴</text><text x="46" y="96" text-anchor="start" class="lbl-sm">điền đơn, spin song song trước — rồi mới ghép đôi</text></svg>