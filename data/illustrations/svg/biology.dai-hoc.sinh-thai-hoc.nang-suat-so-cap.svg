<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" role="img" aria-label="Dòng năng lượng ở sinh vật sản xuất"><title>Dòng năng lượng ở sinh vật sản xuất</title><desc>Năng lượng đồng hoá được (sản lượng sơ cấp thô) chia thành phần mất đi do hô hấp và phần còn lại tích luỹ thành sản lượng sơ cấp tinh.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="520" height="280"/><rect x="40" y="96" width="170" height="66" class="fill-a"/><rect x="40" y="96" width="170" height="66" class="ink"/><text x="125" y="126" text-anchor="middle" class="lbl">GPP</text><text x="125" y="148" text-anchor="middle" class="lbl-sm">sản lượng sơ cấp thô</text><rect x="310" y="96" width="170" height="66" class="fill-a"/><rect x="310" y="96" width="170" height="66" class="ink"/><text x="395" y="126" text-anchor="middle" class="lbl">NPP</text><text x="395" y="148" text-anchor="middle" class="lbl-sm">sản lượng sơ cấp tinh</text><line x1="212" y1="129" x2="304" y2="129" class="accent-a" stroke-width="2.5"/><polygon points="304,129 297.072,133 297.072,125" class="accent-a" stroke="none" fill-opacity="1"/><line x1="258" y1="122" x2="258" y2="62" class="accent-b" stroke-width="2.5"/><polygon points="258,62 262,68.928 254,68.928" class="accent-b" stroke="none" fill-opacity="1"/><text x="266" y="56" text-anchor="start" class="lbl-sm">R — hô hấp</text><text x="40" y="208" text-anchor="start" class="lbl">NPP = GPP − R</text></svg>