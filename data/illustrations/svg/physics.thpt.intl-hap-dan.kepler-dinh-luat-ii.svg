<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Định luật Kepler về quỹ đạo hành tinh"><title>Định luật Kepler về quỹ đạo hành tinh</title><desc>Chuyển động của hành tinh trên quỹ đạo elip quanh Mặt Trời.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="480" height="320"/><path d="M 60.0 160.0 A 160.0 100.0 0 1 0 380.0 160.0 A 160.0 100.0 0 1 0 60.0 160.0" class="curve" stroke-dasharray="6 4" stroke-width="2"/><circle cx="126.325" cy="160" r="14" class="accent-d" fill-opacity="1"/><text x="126.325" y="186" text-anchor="middle" class="lbl-sm">Mặt Trời (Tiêu điểm)</text><text x="240" y="35" text-anchor="middle" class="lbl" font-size="16px">Định luật II Kepler: dA/dt = L/(2m) = const</text><text x="240" y="60" text-anchor="middle" class="lbl-sm">Bán kính vectơ quét những diện tích bằng nhau trong các khoảng thời gian bằng nhau</text><path d="M 126.32503002402403 160.0 L 81.4359353944898 210.0 A 160.0 100.0 0 0 1 81.43593539448983 109.99999999999999 Z" class="fill-b" fill-opacity="0.35"/><line x1="126.325" y1="160" x2="81.436" y2="210" class="ink-thin"/><line x1="126.325" y1="160" x2="81.436" y2="110" class="ink-thin"/><text x="86.399" y="160" text-anchor="start" class="lbl" font-weight="bold">ΔS₁</text><text x="71.436" y="115" text-anchor="end" class="lbl-sm">v₁ lớn (nhanh)</text><path d="M 126.32503002402403 160.0 L 372.1690426072246 129.09830056250527 A 160.0 100.0 0 0 1 372.1690426072246 190.90169943749473 Z" class="fill-a" fill-opacity="0.35"/><line x1="126.325" y1="160" x2="372.169" y2="129.098" class="ink-thin"/><line x1="126.325" y1="160" x2="372.169" y2="190.902" class="ink-thin"/><text x="310.221" y="160" text-anchor="start" class="lbl" font-weight="bold">ΔS₂</text><text x="380.169" y="190" text-anchor="start" class="lbl-sm">v₂ bé (chậm)</text><text x="240" y="300" text-anchor="middle" class="lbl">Trong cùng thời gian Δt: ΔS₁ = ΔS₂</text></svg>