<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 238.32" role="img" aria-label="Sơ đồ lực trên mặt phẳng nghiêng"><title>Sơ đồ lực trên mặt phẳng nghiêng</title><desc>Vật trên mặt phẳng nghiêng góc alpha: trọng lực được phân tích thành thành phần dọc mặt nghiêng và thành phần vuông góc với mặt.</desc><style>@media (prefers-color-scheme: dark){
