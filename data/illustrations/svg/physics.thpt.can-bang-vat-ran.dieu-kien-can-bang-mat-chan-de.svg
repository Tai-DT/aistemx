<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" role="img" aria-label="Cân bằng ba lực không song song"><title>Cân bằng ba lực không song song</title><desc>Ba lực đồng phẳng và đồng quy: F₁ + F₂ + F₃ = 0.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="460" height="320"/><text x="230" y="35" text-anchor="middle" class="lbl" font-size="18px">F⃗₁ + F⃗₂ + F⃗₃ = 0⃗</text><text x="230" y="60" text-anchor="middle" class="lbl-sm">Ba lực không song song phải đồng phẳng và đồng quy</text><polygon points="100,150 140,100 240,110 280,180 250,250 130,230" class="fill-a"/><polyline points="100,150 140,100 240,110 280,180 250,250 130,230 100,150" class="ink" fill="none"/><circle cx="190" cy="175" r="3.5" class="accent-a"/><text x="198" y="179" text-anchor="start" class="lbl-sm">O (Điểm đồng quy)</text><line x1="190" y1="175" x2="157.111" y2="186.971" class="ink-thin" stroke-dasharray="3 3"/><line x1="190" y1="175" x2="222.766" y2="197.943" class="ink-thin" stroke-dasharray="3 3"/><line x1="190" y1="175" x2="191.941" y2="145.063" class="ink-thin" stroke-dasharray="3 3"/><line x1="157.111" y1="186.971" x2="91.332" y2="210.912" class="accent-b" stroke-width="2.5"/><polygon points="91.332,210.912 95.832,205.55 98.226,212.128" class="accent-b" stroke="none" fill-opacity="1"/><line x1="222.766" y1="197.943" x2="284.202" y2="240.961" class="accent-b" stroke-width="2.5"/><polygon points="284.202,240.961 277.229,240.351 281.244,234.617" class="accent-b" stroke="none" fill-opacity="1"/><line x1="191.941" y1="145.063" x2="196.283" y2="78.103" class="accent-b" stroke-width="2.5"/><polygon points="196.283,78.103 199.384,84.379 192.398,83.926" class="accent-b" stroke="none" fill-opacity="1"/><text x="79.332" y="210.912" text-anchor="start" class="lbl">F⃗₁</text><text x="290.202" y="236.961" text-anchor="start" class="lbl">F⃗₂</text><text x="202.283" y="94.103" text-anchor="start" class="lbl">F⃗₃</text><line x1="360" y1="220" x2="313.955" y2="236.759" class="accent-c" stroke-width="2.5"/><polygon points="313.955,236.759 317.169,232.929 318.879,237.627" class="accent-c" stroke="none" fill-opacity="1"/><line x1="313.955" y1="236.759" x2="356.961" y2="266.872" class="accent-c" stroke-width="2.5"/><polygon points="356.961,266.872 351.98,266.436 354.847,262.34" class="accent-c" stroke="none" fill-opacity="1"/><line x1="356.961" y1="266.872" x2="360" y2="220" class="accent-c" stroke-width="2.5"/><polygon points="360,220 362.215,224.483 357.225,224.159" class="accent-c" stroke="none" fill-opacity="1"/><text x="340" y="170" text-anchor="start" class="lbl-sm">Tam giác lực khép kín</text></svg>