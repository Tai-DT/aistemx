<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 342" role="img" aria-label="Tứ giác và hai đường chéo"><title>Tứ giác và hai đường chéo</title><desc>Tứ giác ABCD với hai đường chéo AC = d₁ và BD = d₂ cắt nhau dưới góc φ = 90°.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="412" height="342"/><polygon points="56,159.5 191,286 356,159.5 191,56" class="fill-a"/><polyline points="56,159.5 191,286 356,159.5 191,56 56,159.5" class="ink" fill="none"/><line x1="56" y1="159.5" x2="356" y2="159.5" class="accent-b" stroke-width="2"/><line x1="191" y1="286" x2="191" y2="56" class="accent-c" stroke-width="2"/><circle cx="191" cy="159.5" r="3" class="accent-b"/><polyline points="202,159.5 202,148.5 191,148.5" class="ink-thin" fill="none"/><text x="109.541" y="162.93" text-anchor="middle" class="lbl">d₁</text><text x="189.189" y="98.368" text-anchor="middle" class="lbl">d₂</text><text x="39.676" y="159.253" text-anchor="middle" class="lbl">A</text><text x="188.998" y="307.382" text-anchor="middle" class="lbl">B</text><text x="372.404" y="159.537" text-anchor="middle" class="lbl">C</text><text x="189.836" y="43.54" text-anchor="middle" class="lbl">D</text></svg>