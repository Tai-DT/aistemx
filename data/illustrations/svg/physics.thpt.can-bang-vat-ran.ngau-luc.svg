<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" role="img" aria-label="Mômen lực và cánh tay đòn"><title>Mômen lực và cánh tay đòn</title><desc>Mômen lực đối với trục quay M = F·d.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="460" height="320"/><text x="230" y="40" text-anchor="middle" class="lbl" font-size="18px">M = F · d</text><text x="230" y="65" text-anchor="middle" class="lbl-sm">Mômen ngẫu lực (d: khoảng cách giữa hai giá của lực)</text><circle cx="230" cy="190" r="5" class="accent-a"/><text x="230" y="210" text-anchor="middle" class="lbl-sm">O (Trục quay)</text><line x1="134.737" y1="245" x2="325.263" y2="135" class="ink" stroke-width="6" stroke-linecap="round"/><line x1="134.737" y1="245" x2="134.737" y2="165" class="accent-b" stroke-width="2.5"/><polygon points="134.737,165 138.737,171.928 130.737,171.928" class="accent-b" stroke="none" fill-opacity="1"/><text x="124.737" y="160" text-anchor="start" class="lbl">F⃗₁</text><line x1="325.263" y1="135" x2="325.263" y2="215" class="accent-b" stroke-width="2.5"/><polygon points="325.263,215 321.263,208.072 329.263,208.072" class="accent-b" stroke="none" fill-opacity="1"/><text x="335.263" y="220" text-anchor="start" class="lbl">F⃗₂</text><line x1="134.737" y1="100" x2="134.737" y2="260" class="ink-thin" stroke-dasharray="3 3"/><line x1="325.263" y1="100" x2="325.263" y2="260" class="ink-thin" stroke-dasharray="3 3"/><line x1="134.737" y1="220" x2="325.263" y2="220" class="accent-c" stroke-width="1.8"/><line x1="164.737" y1="220" x2="134.737" y2="220" class="accent-c" stroke-width="2.5"/><polygon points="134.737,220 139.933,217 139.933,223" class="accent-c" stroke="none" fill-opacity="1"/><line x1="295.263" y1="220" x2="325.263" y2="220" class="accent-c" stroke-width="2.5"/><polygon points="325.263,220 320.067,223 320.067,217" class="accent-c" stroke="none" fill-opacity="1"/><text x="230" y="214" text-anchor="middle" class="lbl">d</text><path d="M 265.0 175.0 A 40 40 0 0 0 195.0 205.0" class="accent-a" fill="none" stroke-width="2"/></svg>