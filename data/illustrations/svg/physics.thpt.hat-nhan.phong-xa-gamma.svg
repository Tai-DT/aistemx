<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Phóng xạ gamma"><title>Phóng xạ gamma</title><desc>Hạt nhân ở trạng thái kích thích chuyển về mức thấp hơn và phát ra photon gamma.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="400" height="320"/><line x1="90" y1="96" x2="310" y2="96" class="ink" style="stroke-width:2.6"/><line x1="90" y1="216" x2="310" y2="216" class="ink" style="stroke-width:2.6"/><text x="316" y="101" text-anchor="start" class="lbl">E_cao</text><text x="316" y="221" text-anchor="start" class="lbl">E_thấp</text><text x="50.8" y="73" text-anchor="end" class="lbl-sm">A</text><text x="50.8" y="90" text-anchor="end" class="lbl-sm">Z</text><text x="53.8" y="85" text-anchor="start" class="lbl">X*</text><text x="50.8" y="235" text-anchor="end" class="lbl-sm">A</text><text x="50.8" y="252" text-anchor="end" class="lbl-sm">Z</text><text x="53.8" y="247" text-anchor="start" class="lbl">X</text><line x1="200" y1="100" x2="200" y2="212" class="accent-b" style="stroke-width:2.4"/><polygon points="200,212 195.5,204.206 204.5,204.206" class="accent-b" stroke="none" fill-opacity="1"/><text x="210" y="156" text-anchor="start" class="lbl">γ</text><text x="200" y="280" text-anchor="middle" class="lbl">ε_γ = E_cao − E_thấp</text><text x="200" y="302" text-anchor="middle" class="lbl-sm">số khối A và số proton Z không đổi</text></svg>