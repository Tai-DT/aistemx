<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 446 252" role="img" aria-label="Mạch điện nối tiếp"><title>Mạch điện nối tiếp</title><desc>Sơ đồ mạch điện: nguồn một chiều nối tiếp với R₁, R₂, R₃.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="446" height="252"/><line x1="62" y1="64" x2="95" y2="64" class="ink"/><line x1="141" y1="64" x2="207" y2="64" class="ink"/><line x1="253" y1="64" x2="319" y2="64" class="ink"/><line x1="365" y1="64" x2="398" y2="64" class="ink"/><line x1="62" y1="64" x2="62" y2="115" class="ink"/><line x1="62" y1="147" x2="62" y2="198" class="ink"/><line x1="398" y1="64" x2="398" y2="198" class="ink"/><line x1="62" y1="198" x2="398" y2="198" class="ink"/><line x1="49" y1="125" x2="75" y2="125" class="ink"/><line x1="55" y1="137" x2="69" y2="137" class="ink" style="stroke-width:4"/><text x="43" y="129" text-anchor="end" class="lbl-sm">+</text><text x="43" y="142" text-anchor="end" class="lbl-sm">−</text><text x="83" y="136" text-anchor="start" class="lbl">U</text><rect x="95" y="55" width="46" height="18" class="ink"/><text x="118" y="47" text-anchor="middle" class="lbl">R₁</text><rect x="207" y="55" width="46" height="18" class="ink"/><text x="230" y="47" text-anchor="middle" class="lbl">R₂</text><rect x="319" y="55" width="46" height="18" class="ink"/><text x="342" y="47" text-anchor="middle" class="lbl">R₃</text><line x1="76" y1="64" x2="110" y2="64" class="accent-b" style="stroke-width:2.2"/><polygon points="110,64 103.072,68 103.072,60" class="accent-b" stroke="none" fill-opacity="1"/><text x="93" y="55" text-anchor="middle" class="lbl">I</text><text x="223" y="238" text-anchor="middle" class="lbl">R = R₁ + R₂ + R₃</text></svg>