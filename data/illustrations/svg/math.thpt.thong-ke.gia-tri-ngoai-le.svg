<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 288" role="img" aria-label="Biểu đồ hộp"><title>Biểu đồ hộp</title><desc>Biểu đồ hộp với tứ phân vị, râu và giá trị ngoại lệ.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="480" height="288"/><line x1="46" y1="204" x2="458" y2="204" class="axis"/><line x1="119.492" y1="204" x2="119.492" y2="209" class="axis"/><text x="119.492" y="223" text-anchor="middle" class="lbl-sm">10</text><line x1="207.228" y1="204" x2="207.228" y2="209" class="axis"/><text x="207.228" y="223" text-anchor="middle" class="lbl-sm">20</text><line x1="294.965" y1="204" x2="294.965" y2="209" class="axis"/><text x="294.965" y="223" text-anchor="middle" class="lbl-sm">30</text><line x1="382.702" y1="204" x2="382.702" y2="209" class="axis"/><text x="382.702" y="223" text-anchor="middle" class="lbl-sm">40</text><text x="458" y="240" text-anchor="end" class="lbl">giá trị</text><line x1="137.039" y1="110" x2="180.907" y2="110" class="ink"/><line x1="246.71" y1="110" x2="268.644" y2="110" class="ink"/><line x1="137.039" y1="100" x2="137.039" y2="120" class="ink"/><line x1="268.644" y1="100" x2="268.644" y2="120" class="ink"/><rect x="180.907" y="82" width="65.803" height="56" class="fill-a"/><rect x="180.907" y="82" width="65.803" height="56" class="ink"/><line x1="211.615" y1="82" x2="211.615" y2="138" class="accent-b" stroke-width="2.6"/><text x="180.907" y="62" text-anchor="middle" class="lbl">Q₁</text><text x="180.907" y="75" text-anchor="middle" class="lbl-sm">17</text><text x="211.615" y="62" text-anchor="middle" class="lbl">Q₂</text><text x="211.615" y="75" text-anchor="middle" class="lbl-sm">20,5</text><text x="246.71" y="62" text-anchor="middle" class="lbl">Q₃</text><text x="246.71" y="75" text-anchor="middle" class="lbl-sm">24,5</text><text x="137.039" y="155" text-anchor="middle" class="lbl-sm">12</text><text x="268.644" y="155" text-anchor="middle" class="lbl-sm">27</text><line x1="180.907" y1="170" x2="246.71" y2="170" class="accent-c" stroke-width="2"/><text x="213.809" y="185" text-anchor="middle" class="lbl-sm">ΔQ = 7,5</text><line x1="82.203" y1="78" x2="82.203" y2="142" class="accent-d" stroke-dasharray="5 4" stroke-width="1.5"/><line x1="345.414" y1="78" x2="345.414" y2="142" class="accent-d" stroke-dasharray="5 4" stroke-width="1.5"/><text x="345.414" y="26" text-anchor="middle" class="lbl-sm">Q₃ + 1,5·ΔQ</text><text x="82.203" y="26" text-anchor="middle" class="lbl-sm">Q₁ − 1,5·ΔQ</text><circle cx="417.797" cy="110" r="4.2" class="accent-b"/><text x="417.797" y="75" text-anchor="middle" class="lbl-sm">ngoại lệ</text></svg>