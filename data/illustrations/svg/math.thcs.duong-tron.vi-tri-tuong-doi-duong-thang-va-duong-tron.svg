<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 371.034" role="img" aria-label="Vị trí tương đối của đường thẳng và đường tròn"><title>Vị trí tương đối của đường thẳng và đường tròn</title><desc>Ba trường hợp: d &lt; R đường thẳng cắt đường tròn, d = R tiếp xúc, d &gt; R không có điểm chung.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="400" height="371.034"/><circle cx="200" cy="200" r="96.552" class="ink"/><circle cx="200" cy="200" r="3" class="accent-b"/><line x1="69.655" y1="248.276" x2="330.345" y2="248.276" class="accent-a" stroke-width="2.4"/><line x1="200" y1="200" x2="200" y2="248.276" class="ink-thin" stroke-dasharray="3 3" stroke-width="1.2"/><text x="338.345" y="252.776" text-anchor="start" class="lbl-sm">d &lt; R</text><line x1="69.655" y1="103.448" x2="330.345" y2="103.448" class="accent-c" stroke-width="2.4"/><line x1="200" y1="200" x2="200" y2="103.448" class="ink-thin" stroke-dasharray="3 3" stroke-width="1.2"/><text x="338.345" y="107.948" text-anchor="start" class="lbl-sm">d = R</text><line x1="69.655" y1="72.552" x2="330.345" y2="72.552" class="accent-d" stroke-width="2.4"/><line x1="200" y1="200" x2="200" y2="72.552" class="ink-thin" stroke-dasharray="3 3" stroke-width="1.2"/><text x="338.345" y="77.052" text-anchor="start" class="lbl-sm">d &gt; R</text><text x="188" y="208.5" text-anchor="end" class="lbl-sm">O</text></svg>