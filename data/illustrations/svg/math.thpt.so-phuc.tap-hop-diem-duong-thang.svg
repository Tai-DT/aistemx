<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 339.2 342.67" role="img" aria-label="Tập hợp điểm |z − z₁| = |z − z₂|"><title>Tập hợp điểm |z − z₁| = |z − z₂|</title><desc>Tập hợp các điểm cách đều hai điểm cho trước là đường trung trực của đoạn nối chúng.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="339.2" height="342.67"/><line x1="43" y1="173.835" x2="286.8" y2="173.835" class="axis" stroke-width="2.5"/><polygon points="286.8,173.835 280.738,177.335 280.738,170.335" class="axis" stroke="none" fill-opacity="1"/><line x1="158" y1="287.67" x2="158" y2="32.4" class="axis" stroke-width="2.5"/><polygon points="158,32.4 161.5,38.462 154.5,38.462" class="axis" stroke="none" fill-opacity="1"/><text x="284.8" y="164.835" text-anchor="end" class="lbl">Re</text><text x="167" y="43.4" text-anchor="start" class="lbl">Im</text><text x="150" y="188.835" text-anchor="end" class="lbl">O</text><line x1="66" y1="201.435" x2="259.2" y2="123.235" class="ink-thin" stroke-dasharray="5 4"/><line x1="121.179" y1="60" x2="204.021" y2="264.67" class="accent-a" style="fill:none" stroke-width="2.4"/><polyline points="172.796,158.208 168.669,148.011 158.473,152.139" class="ink-thin" fill="none"/><circle cx="66" cy="201.435" r="3.4" class="accent-b"/><text x="66" y="220.435" text-anchor="middle" class="lbl">M₁</text><circle cx="259.2" cy="123.235" r="3.4" class="accent-b"/><text x="259.2" y="142.235" text-anchor="middle" class="lbl">M₂</text><circle cx="136.712" cy="98.376" r="3.4" class="accent-c"/><text x="144.712" y="91.376" text-anchor="start" class="lbl">M</text><line x1="136.712" y1="98.376" x2="66" y2="201.435" class="accent-c" style="fill:none" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="136.712" y1="98.376" x2="259.2" y2="123.235" class="accent-c" style="fill:none" stroke-width="1.6" stroke-dasharray="5 4"/><text x="169.6" y="324.67" text-anchor="middle" class="lbl-sm">MM₁ = MM₂ ⇔ M thuộc đường trung trực của M₁M₂</text></svg>