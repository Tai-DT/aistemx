<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 366" role="img" aria-label="Lò xo treo thẳng đứng"><title>Lò xo treo thẳng đứng</title><desc>So sánh lò xo tự nhiên, lò xo ở vị trí cân bằng khi treo vật và lò xo ở biên dưới của dao động.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="330" height="366"/><line x1="56" y1="42" x2="274" y2="42" class="ink"/><line x1="65" y1="42" x2="58.25" y2="33" class="ink-thin"/><line x1="83" y1="42" x2="76.25" y2="33" class="ink-thin"/><line x1="101" y1="42" x2="94.25" y2="33" class="ink-thin"/><line x1="119" y1="42" x2="112.25" y2="33" class="ink-thin"/><line x1="137" y1="42" x2="130.25" y2="33" class="ink-thin"/><line x1="155" y1="42" x2="148.25" y2="33" class="ink-thin"/><line x1="173" y1="42" x2="166.25" y2="33" class="ink-thin"/><line x1="191" y1="42" x2="184.25" y2="33" class="ink-thin"/><line x1="209" y1="42" x2="202.25" y2="33" class="ink-thin"/><line x1="227" y1="42" x2="220.25" y2="33" class="ink-thin"/><line x1="245" y1="42" x2="238.25" y2="33" class="ink-thin"/><line x1="263" y1="42" x2="256.25" y2="33" class="ink-thin"/><polyline points="104,42 104,53 92,58.25 116,63.5 92,68.75 116,74 92,79.25 116,84.5 92,89.75 116,95 92,100.25 116,105.5 92,110.75 116,116 92,121.25 116,126.5 92,131.75 104,137 104,148" class="ink" fill="none"/><text x="104" y="332" text-anchor="middle" class="lbl-sm">lò xo tự nhiên</text><polyline points="232,42 232,53 220,61.5 244,70 220,78.5 244,87 220,95.5 244,104 220,112.5 244,121 220,129.5 244,138 220,146.5 244,155 220,163.5 244,172 220,180.5 232,189 232,200" class="ink" fill="none"/><polygon points="205,200 259,200 259,244 205,244" class="fill-a"/><polyline points="205,200 259,200 259,244 205,244 205,200" class="ink" fill="none"/><text x="232" y="332" text-anchor="middle" class="lbl-sm">vị trí cân bằng</text><line x1="104" y1="148" x2="264" y2="148" class="ink-thin" stroke-dasharray="4 4"/><line x1="192" y1="200" x2="264" y2="200" class="ink-thin" stroke-dasharray="4 4"/><line x1="68" y1="42" x2="68" y2="148" class="accent-d" stroke-width="1.3"/><polygon points="68,148 64.948,142.261 71.052,142.261" class="accent-d" stroke="none" fill-opacity="1"/><polygon points="68,42 71.052,47.739 64.948,47.739" class="accent-d" stroke="none" fill-opacity="1"/><text x="60" y="99" text-anchor="end" class="lbl">ℓ₀</text><line x1="276" y1="148" x2="276" y2="200" class="accent-d" stroke-width="1.3"/><polygon points="276,200 272.948,194.261 279.052,194.261" class="accent-d" stroke="none" fill-opacity="1"/><polygon points="276,148 279.052,153.739 272.948,153.739" class="accent-d" stroke="none" fill-opacity="1"/><text x="284" y="178" text-anchor="start" class="lbl">Δℓ₀</text><line x1="232" y1="222" x2="232" y2="278" class="accent-b" stroke-width="2.5"/><polygon points="232,278 228,271.072 236,271.072" class="accent-b" stroke="none" fill-opacity="1"/><text x="239" y="278" text-anchor="start" class="lbl">P</text><line x1="214" y1="222" x2="214" y2="164" class="accent-c" stroke-width="2.5"/><polygon points="214,164 218,170.928 210,170.928" class="accent-c" stroke="none" fill-opacity="1"/><text x="207" y="166" text-anchor="end" class="lbl">F<tspan dy="4" font-size="10">đh</tspan></text></svg>