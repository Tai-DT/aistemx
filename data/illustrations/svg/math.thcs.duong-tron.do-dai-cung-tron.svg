<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 362 362" role="img" aria-label="Cung tròn và góc ở tâm"><title>Cung tròn và góc ở tâm</title><desc>Đường tròn (O; R = 3) với góc ở tâm AOB = 110°; cung AB nằm trong góc đó được tô đậm.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="362" height="362"/><circle cx="181" cy="181" r="125" class="ink-thin"/><path d="M 291.368 122.316 A 125 125 0 0 0 88.107 97.359" class="accent-a" style="fill:none" stroke-width="3.4"/><line x1="181" y1="181" x2="291.368" y2="122.316" class="ink"/><line x1="181" y1="181" x2="88.107" y2="97.359" class="ink"/><path d="M 214.111 163.395 A 37.5 37.5 0 0 0 153.132 155.908" class="accent-d" style="fill:none" stroke-width="1.8"/><text x="187.154" y="135.376" text-anchor="middle" class="lbl-sm">110°</text><circle cx="181" cy="181" r="3" class="accent-b"/><text x="304.613" y="119.774" text-anchor="middle" class="lbl">A</text><text x="76.96" y="91.822" text-anchor="middle" class="lbl">B</text><text x="181" y="202.5" text-anchor="middle" class="lbl-sm">O</text><text x="198.671" y="41.581" text-anchor="middle" class="lbl-sm">ℓ</text><text x="247.451" y="160.289" text-anchor="middle" class="lbl">R</text></svg>