<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 300" role="img" aria-label="Đồ thị Lineweaver - Burk"><title>Đồ thị Lineweaver - Burk</title><desc>Đồ thị 1/v theo 1/[S] là đường thẳng: cắt trục tung tại 1/Vmax, cắt trục hoành tại −1/KM, hệ số góc bằng KM/Vmax.</desc><style>@media (prefers-color-scheme: dark){
