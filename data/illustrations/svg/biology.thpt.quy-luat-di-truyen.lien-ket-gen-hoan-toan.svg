<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 386.8 356" role="img" aria-label="Khung Punnett"><title>Khung Punnett</title><desc>Khung Punnett 2×2: hàng là giao tử AB, ab, cột là giao tử AB, ab; mỗi ô là kiểu gen của hợp tử tương ứng.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="386.8" height="356"/><text x="122.8" y="30" text-anchor="start" class="lbl-sm"></text><text x="262.8" y="48" text-anchor="middle" class="lbl-sm">giao tử ♂ (AB/ab)</text><text x="112.8" y="196" text-anchor="end" class="lbl-sm">giao tử ♀ (AB/ab)</text><text x="214.8" y="86" text-anchor="middle" class="lbl">AB</text><text x="310.8" y="86" text-anchor="middle" class="lbl">ab</text><text x="144.8" y="153" text-anchor="middle" class="lbl">AB</text><text x="144.8" y="249" text-anchor="middle" class="lbl">ab</text><rect x="262.8" y="196" width="96" height="96" class="fill-b"/><line x1="166.8" y1="100" x2="358.8" y2="100" class="ink"/><line x1="166.8" y1="196" x2="358.8" y2="196" class="ink"/><line x1="166.8" y1="292" x2="358.8" y2="292" class="ink"/><line x1="166.8" y1="100" x2="166.8" y2="292" class="ink"/><line x1="262.8" y1="100" x2="262.8" y2="292" class="ink"/><line x1="358.8" y1="100" x2="358.8" y2="292" class="ink"/><text x="214.8" y="153" text-anchor="middle" class="lbl">AB/AB</text><text x="310.8" y="153" text-anchor="middle" class="lbl">AB/ab</text><text x="214.8" y="249" text-anchor="middle" class="lbl">AB/ab</text><text x="310.8" y="249" text-anchor="middle" class="lbl">ab/ab</text><text x="122.8" y="316" text-anchor="start" class="lbl">1 AB/AB : 2 AB/ab : 1 ab/ab  →  3 A-B- : 1 aabb</text><rect x="122.8" y="326" width="14" height="12" class="fill-b"/><rect x="122.8" y="326" width="14" height="12" class="ink-thin"/><text x="144.8" y="336" text-anchor="start" class="lbl-sm">1 ab/ab — kiểu hình lặn cả hai tính trạng</text></svg>