<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 271.947 246.757" role="img" aria-label="Hình lập phương"><title>Hình lập phương</title><desc>Hình lập phương cạnh a</desc><style>@media (prefers-color-scheme: dark){
