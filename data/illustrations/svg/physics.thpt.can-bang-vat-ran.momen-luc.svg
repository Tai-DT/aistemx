<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" role="img" aria-label="Mômen lực và cánh tay đòn"><title>Mômen lực và cánh tay đòn</title><desc>Mômen lực đối với trục quay M = F·d.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="460" height="320"/><text x="440" y="40" text-anchor="end" class="lbl" font-size="18px">M = F · d</text><text x="440" y="65" text-anchor="end" class="lbl-sm">d = OA · sin α (Cánh tay đòn)</text><circle cx="110" cy="220" r="6" class="accent-a"/><text x="96" y="238" text-anchor="start" class="lbl">O</text><text x="80" y="252" text-anchor="start" class="lbl-sm">Trục quay</text><line x1="110" y1="220" x2="300" y2="160" class="ink" stroke-width="6" stroke-linecap="round"/><circle cx="300" cy="160" r="4" class="accent-a"/><text x="308" y="154" text-anchor="start" class="lbl-sm">A (Điểm đặt lực)</text><line x1="300" y1="160" x2="350" y2="70" class="accent-b" stroke-width="2.5"/><polygon points="350,70 350.132,77.999 343.139,74.114" class="accent-b" stroke="none" fill-opacity="1"/><text x="356" y="64" text-anchor="start" class="lbl">F⃗</text><line x1="230" y1="286" x2="375" y2="25" class="ink-thin" stroke-dasharray="4 3"/><text x="225" y="300" text-anchor="start" class="lbl-sm">Giá của lực</text><line x1="110" y1="220" x2="229.717" y2="286.509" class="accent-c" stroke-width="2.2"/><circle cx="229.717" cy="286.509" r="3.5" class="accent-c"/><polyline points="220.975,281.653 225.832,272.911 234.573,277.768" class="ink-thin" fill="none"/><text x="217.717" y="300.509" text-anchor="start" class="lbl">H</text><text x="155.858" y="245.255" text-anchor="start" class="lbl" font-weight="bold">d</text><path d="M 160.0 200.0 A 55 55 0 0 0 130.0 165.0" class="accent-d" fill="none" stroke-width="2"/><line x1="132" y1="170" x2="128" y2="164" class="accent-d" stroke-width="2.5"/><polygon points="128,164 132.482,166.216 128.322,168.99" class="accent-d" stroke="none" fill-opacity="1"/></svg>