<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 310" role="img" aria-label="Định luật phóng xạ"><title>Định luật phóng xạ</title><desc>Đồ thị đại lượng đặc trưng cho lượng chất phóng xạ theo thời gian, giảm một nửa sau mỗi chu kì bán rã.</desc><style>@media (prefers-color-scheme: dark){
