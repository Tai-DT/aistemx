<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Đường Hypebol chính tắc"><title>Đường Hypebol chính tắc</title><desc>Hypebol x²/a² − y²/b² = 1 với hai nhánh đối xứng qua Oy và hai đường tiệm cận y = ±(b/a)x.</desc><style>@media (prefers-color-scheme: dark){
