<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 293.818" role="img" aria-label="Hai tiếp tuyến cắt nhau"><title>Hai tiếp tuyến cắt nhau</title><desc>Từ điểm M ngoài đường tròn (O; R) kẻ hai tiếp tuyến MA và MB; MA = MB và MO là phân giác của góc AMB.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="412" height="293.818"/><circle cx="146.909" cy="146.909" r="90.909" class="ink"/><line x1="356" y1="146.909" x2="186.435" y2="65.042" class="accent-a" stroke-width="2.4"/><line x1="356" y1="146.909" x2="186.435" y2="228.776" class="accent-a" stroke-width="2.4"/><line x1="146.909" y1="146.909" x2="186.435" y2="65.042" class="ink-thin"/><line x1="146.909" y1="146.909" x2="186.435" y2="228.776" class="ink-thin"/><line x1="146.909" y1="146.909" x2="356" y2="146.909" class="accent-b" stroke-dasharray="5 4" stroke-width="1.6"/><polyline points="182.087,74.048 191.092,78.395 195.44,69.39" class="ink-thin" fill="none"/><polyline points="182.087,219.771 191.092,215.423 195.44,224.428" class="ink-thin" fill="none"/><line x1="268.609" y1="111.379" x2="273.826" y2="100.572" class="ink-thin"/><line x1="273.826" y1="193.246" x2="268.609" y2="182.439" class="ink-thin"/><path d="M 328.984 133.866 A 30 30 0 0 0 326 146.909" class="accent-d" style="fill:none" stroke-width="1.8"/><path d="M 326 146.909 A 30 30 0 0 0 328.984 159.953" class="accent-d" style="fill:none" stroke-width="1.8"/><circle cx="146.909" cy="146.909" r="3" class="accent-b"/><circle cx="356" cy="146.909" r="3" class="accent-b"/><text x="192.957" y="56.034" text-anchor="middle" class="lbl">A</text><text x="192.957" y="246.784" text-anchor="middle" class="lbl">B</text><text x="370" y="155.409" text-anchor="middle" class="lbl">M</text><text x="140.909" y="167.409" text-anchor="end" class="lbl-sm">O</text></svg>