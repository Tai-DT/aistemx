<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" role="img" aria-label="Lực tương tác giữa hai điện tích điểm"><title>Lực tương tác giữa hai điện tích điểm</title><desc>Hai điện tích cùng dấu đẩy nhau.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="420" height="190"/><line x1="120" y1="84" x2="300" y2="84" class="ink-thin" style="stroke-dasharray:5 4"/><circle cx="120" cy="84" r="17" class="fill-b"/><circle cx="120" cy="84" r="17" class="ink"/><circle cx="300" cy="84" r="17" class="fill-b"/><circle cx="300" cy="84" r="17" class="ink"/><text x="120" y="90" text-anchor="middle" class="lbl">q₁</text><text x="300" y="90" text-anchor="middle" class="lbl">q₂</text><text x="120" y="59" text-anchor="middle" class="lbl-sm">+</text><text x="300" y="59" text-anchor="middle" class="lbl-sm">+</text><line x1="103" y1="84" x2="41" y2="84" class="accent-b" style="stroke-width:2.4"/><polygon points="41,84 48.794,79.5 48.794,88.5" class="accent-b" stroke="none" fill-opacity="1"/><line x1="317" y1="84" x2="379" y2="84" class="accent-b" style="stroke-width:2.4"/><polygon points="379,84 371.206,88.5 371.206,79.5" class="accent-b" stroke="none" fill-opacity="1"/><text x="72" y="74" text-anchor="middle" class="lbl">F₁₂</text><text x="348" y="74" text-anchor="middle" class="lbl">F₂₁</text><line x1="120" y1="130" x2="300" y2="130" class="ink-thin"/><polygon points="300,130 294.804,133 294.804,127" class="ink-thin" stroke="none" fill-opacity="1"/><polygon points="120,130 125.196,127 125.196,133" class="ink-thin" stroke="none" fill-opacity="1"/><text x="210" y="124" text-anchor="middle" class="lbl-sm">r</text><text x="210" y="174" text-anchor="middle" class="lbl-sm">F = k·|q₁q₂| / r²   —   cùng dấu: đẩy nhau</text></svg>