<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 422 260.8" role="img" aria-label="Hệ thức lượng trong tam giác vuông"><title>Hệ thức lượng trong tam giác vuông</title><desc>Tam giác ABC vuông tại A, đường cao AH ứng với cạnh huyền BC; c′ = BH và b′ = CH là hình chiếu của hai cạnh góc vuông.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="422" height="260.8"/><polygon points="167.6,56 56,204.8 366,204.8" class="fill-a"/><polyline points="167.6,56 56,204.8 366,204.8 167.6,56" class="ink" fill="none"/><polyline points="159.8,66.4 170.2,74.2 178,63.8" class="ink-thin" fill="none"/><line x1="167.6" y1="56" x2="167.6" y2="204.8" class="accent-b" stroke-width="2.2"/><polyline points="167.6,194.8 177.6,194.8 177.6,204.8" class="ink-thin" fill="none"/><text x="180.6" y="134.9" text-anchor="middle" class="lbl">h</text><text x="167.6" y="227.3" text-anchor="middle" class="lbl-sm">H</text><text x="111.8" y="231.3" text-anchor="middle" class="lbl">c′</text><text x="266.8" y="231.3" text-anchor="middle" class="lbl">b′</text><text x="211" y="249.3" text-anchor="middle" class="lbl-sm">a = 5</text><text x="97.404" y="130.687" text-anchor="middle" class="lbl">c = 3</text><text x="280.945" y="129.908" text-anchor="middle" class="lbl">b = 4</text><text x="162.84" y="44.18" text-anchor="middle" class="lbl">A</text><text x="39.969" y="214.958" text-anchor="middle" class="lbl">B</text><text x="382.316" y="214.075" text-anchor="middle" class="lbl">C</text></svg>