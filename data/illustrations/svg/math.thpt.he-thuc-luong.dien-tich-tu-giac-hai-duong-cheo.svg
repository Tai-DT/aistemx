<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 315.078" role="img" aria-label="Tứ giác và hai đường chéo"><title>Tứ giác và hai đường chéo</title><desc>Tứ giác ABCD với hai đường chéo AC = d₁ và BD = d₂ cắt nhau dưới góc φ = 62°.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="412" height="315.078"/><polygon points="56,147.385 131.612,259.078 356,147.385 239.59,56" class="fill-a"/><polyline points="56,147.385 131.612,259.078 356,147.385 239.59,56 56,147.385" class="ink" fill="none"/><line x1="56" y1="147.385" x2="356" y2="147.385" class="accent-b" stroke-width="2"/><line x1="131.612" y1="259.078" x2="239.59" y2="56" class="accent-c" stroke-width="2"/><circle cx="191" cy="147.385" r="3" class="accent-b"/><path d="M 213 147.385 A 22 22 0 0 0 201.328 127.96" class="accent-d" style="fill:none" stroke-width="1.8"/><text x="222.715" y="132.829" text-anchor="middle" class="lbl-sm">φ</text><text x="109.534" y="150.904" text-anchor="middle" class="lbl">d₁</text><text x="220.314" y="93.123" text-anchor="middle" class="lbl">d₂</text><text x="39.705" y="147.04" text-anchor="middle" class="lbl">A</text><text x="122.188" y="277.727" text-anchor="middle" class="lbl">B</text><text x="372.627" y="148.344" text-anchor="middle" class="lbl">C</text><text x="246.617" y="45.02" text-anchor="middle" class="lbl">D</text></svg>