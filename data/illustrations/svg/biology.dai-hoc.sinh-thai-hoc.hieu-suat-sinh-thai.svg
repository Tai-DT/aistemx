<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 250" role="img" aria-label="Tháp sinh thái"><title>Tháp sinh thái</title><desc>Tháp gồm 4 bậc chồng lên nhau, bậc dưới rộng hơn bậc trên vì mỗi lần chuyển bậc chỉ một phần nhỏ năng lượng được tích luỹ lại.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="494" height="250"/><text x="100" y="34" text-anchor="end" class="lbl-sm">hiệu suất</text><text x="386" y="34" text-anchor="start" class="lbl-sm">kcal·m⁻²·năm⁻¹</text><rect x="108" y="184" width="268" height="40" class="fill-c"/><rect x="108" y="184" width="268" height="40" class="ink"/><text x="242" y="209" text-anchor="middle" class="lbl-sm">SV sản xuất</text><text x="386" y="209" text-anchor="start" class="lbl">10000</text><rect x="157.018" y="138" width="169.964" height="40" class="fill-c"/><rect x="157.018" y="138" width="169.964" height="40" class="ink"/><text x="242" y="163" text-anchor="middle" class="lbl-sm">SVTT bậc 1</text><text x="386" y="163" text-anchor="start" class="lbl">1000</text><text x="100" y="184" text-anchor="end" class="lbl-sm">≈10%</text><rect x="184.582" y="92" width="114.835" height="40" class="fill-c"/><rect x="184.582" y="92" width="114.835" height="40" class="ink"/><text x="242" y="117" text-anchor="middle" class="lbl-sm">SVTT bậc 2</text><text x="386" y="117" text-anchor="start" class="lbl">100</text><text x="100" y="138" text-anchor="end" class="lbl-sm">≈10%</text><rect x="200.083" y="46" width="83.833" height="40" class="fill-c"/><rect x="200.083" y="46" width="83.833" height="40" class="ink"/><text x="242" y="71" text-anchor="middle" class="lbl-sm">SVTT bậc 3</text><text x="386" y="71" text-anchor="start" class="lbl">10</text><text x="100" y="92" text-anchor="end" class="lbl-sm">≈10%</text></svg>