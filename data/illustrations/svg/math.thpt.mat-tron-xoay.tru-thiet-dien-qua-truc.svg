<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 254.735 280.642" role="img" aria-label="Hình trụ"><title>Hình trụ</title><desc>Hình trụ với bán kính đáy và chiều cao được đánh dấu</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="254.735" height="280.642"/><path d="M 46 212.865 A 75.368 25.777 0 0 0 196.735 212.865 L 196.735 61.777 A 75.368 25.777 0 0 0 46 61.777 Z" class="fill-a"/><path d="M 46 212.865 A 75.368 25.777 0 0 1 196.735 212.865" class="ink-thin" stroke-dasharray="6 5"/><path d="M 46 212.865 A 75.368 25.777 0 0 0 196.735 212.865" class="ink"/><path d="M 46 61.777 A 75.368 25.777 0 0 1 196.735 61.777 A 75.368 25.777 0 0 1 46 61.777 Z" class="ink"/><line x1="46" y1="212.865" x2="46" y2="61.777" class="ink"/><line x1="196.735" y1="212.865" x2="196.735" y2="61.777" class="ink"/><line x1="121.368" y1="212.865" x2="121.368" y2="61.777" class="accent-b" stroke-dasharray="6 5" stroke-width="1.6"/><polyline points="111.368,212.865 111.368,202.865 121.368,202.865" class="ink-thin" fill="none"/><text x="129.368" y="137.321" text-anchor="start" class="lbl">h</text><line x1="121.368" y1="61.777" x2="196.735" y2="61.777" class="accent-c" stroke-width="1.6"/><circle cx="121.368" cy="61.777" r="2.6" class="accent-c"/><text x="159.051" y="54.777" text-anchor="middle" class="lbl">r</text></svg>