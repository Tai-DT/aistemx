<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 484.4 482" role="img" aria-label="Khung Punnett"><title>Khung Punnett</title><desc>Khung Punnett 4×4: hàng là giao tử AB, Ab, aB, ab, cột là giao tử AB, Ab, aB, ab; mỗi ô là kiểu gen của hợp tử tương ứng.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="484.4" height="482"/><text x="116.4" y="30" text-anchor="start" class="lbl-sm"></text><text x="308.4" y="48" text-anchor="middle" class="lbl-sm">giao tử ♂ (AaBb)</text><text x="106.4" y="248" text-anchor="end" class="lbl-sm">giao tử ♀ (AaBb)</text><text x="197.4" y="86" text-anchor="middle" class="lbl">AB</text><text x="271.4" y="86" text-anchor="middle" class="lbl">Ab</text><text x="345.4" y="86" text-anchor="middle" class="lbl">aB</text><text x="419.4" y="86" text-anchor="middle" class="lbl">ab</text><text x="138.4" y="142" text-anchor="middle" class="lbl">AB</text><text x="138.4" y="216" text-anchor="middle" class="lbl">Ab</text><text x="138.4" y="290" text-anchor="middle" class="lbl">aB</text><text x="138.4" y="364" text-anchor="middle" class="lbl">ab</text><rect x="160.4" y="100" width="74" height="74" class="fill-a"/><rect x="234.4" y="100" width="74" height="74" class="fill-a"/><rect x="308.4" y="100" width="74" height="74" class="fill-a"/><rect x="382.4" y="100" width="74" height="74" class="fill-a"/><rect x="160.4" y="174" width="74" height="74" class="fill-a"/><rect x="234.4" y="174" width="74" height="74" class="fill-a"/><rect x="308.4" y="174" width="74" height="74" class="fill-a"/><rect x="382.4" y="174" width="74" height="74" class="fill-a"/><rect x="160.4" y="248" width="74" height="74" class="fill-a"/><rect x="234.4" y="248" width="74" height="74" class="fill-a"/><rect x="308.4" y="248" width="74" height="74" class="fill-c"/><rect x="382.4" y="248" width="74" height="74" class="fill-c"/><rect x="160.4" y="322" width="74" height="74" class="fill-a"/><rect x="234.4" y="322" width="74" height="74" class="fill-a"/><rect x="308.4" y="322" width="74" height="74" class="fill-c"/><rect x="382.4" y="322" width="74" height="74" class="fill-a"/><line x1="160.4" y1="100" x2="456.4" y2="100" class=