<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 419.6 472" role="img" aria-label="Số phức liên hợp"><title>Số phức liên hợp</title><desc>Điểm biểu diễn của z và của số phức liên hợp đối xứng nhau qua trục thực.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="419.6" height="472"/><line x1="66" y1="228" x2="323.6" y2="228" class="axis" stroke-width="2.5"/><polygon points="323.6,228 317.538,231.5 317.538,224.5" class="axis" stroke="none" fill-opacity="1"/><line x1="110.8" y1="396" x2="110.8" y2="60" class="axis" stroke-width="2.5"/><polygon points="110.8,60 114.3,66.062 107.3,66.062" class="axis" stroke="none" fill-opacity="1"/><text x="321.6" y="219" text-anchor="end" class="lbl">Re</text><text x="119.8" y="71" text-anchor="start" class="lbl">Im</text><text x="102.8" y="243" text-anchor="end" class="lbl">O</text><line x1="278.8" y1="104.8" x2="278.8" y2="351.2" class="accent-d" style="fill:none" stroke-width="1.8" stroke-dasharray="5 4"/><line x1="110.8" y1="228" x2="278.8" y2="104.8" class="accent-a" stroke-width="2.5"/><polygon points="278.8,104.8 275.176,113.038 269.854,105.78" class="accent-a" stroke="none" fill-opacity="1"/><line x1="110.8" y1="228" x2="278.8" y2="351.2" class="accent-b" stroke-width="2.5"/><polygon points="278.8,351.2 269.854,350.22 275.176,342.962" class="accent-b" stroke="none" fill-opacity="1"/><circle cx="278.8" cy="104.8" r="3.6" class="accent-a"/><circle cx="278.8" cy="351.2" r="3.6" class="accent-b"/><text x="287.8" y="97.8" text-anchor="start" class="lbl">M(a; b) ↔ z</text><text x="287.8" y="365.2" text-anchor="start" class="lbl">M′(a; −b) ↔ z̄</text><polyline points="278.8,218 268.8,218 268.8,228" class="ink-thin" fill="none"/><text x="209.8" y="454" text-anchor="middle" class="lbl-sm">z̄ = a − bi · |z̄| = |z| · z·z̄ = a² + b² = |z|²</text></svg>