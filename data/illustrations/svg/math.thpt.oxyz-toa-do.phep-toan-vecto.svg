<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 340" role="img" aria-label="Hệ toạ độ không gian Oxyz"><title>Hệ toạ độ không gian Oxyz</title><desc>Hệ toạ độ Oxyz với 3 trục Ox, Oy, Oz đôi một vuông góc.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="460" height="340"/><line x1="170" y1="220" x2="170" y2="315" class="axis" stroke-dasharray="3 3" opacity="0.4"/><line x1="170" y1="220" x2="30" y2="220" class="axis" stroke-dasharray="3 3" opacity="0.4"/><line x1="170" y1="220" x2="170" y2="30" class="axis" stroke-width="2.5"/><polygon points="170,30 173.5,36.062 166.5,36.062" class="axis" stroke="none" fill-opacity="1"/><text x="182" y="35" text-anchor="start" class="lbl-sm">z</text><line x1="170" y1="220" x2="430" y2="220" class="axis" stroke-width="2.5"/><polygon points="430,220 423.938,223.5 423.938,216.5" class="axis" stroke="none" fill-opacity="1"/><text x="435" y="210" text-anchor="start" class="lbl-sm">y</text><line x1="170" y1="220" x2="59.414" y2="297.433" class="axis" stroke-width="2.5"/><polygon points="59.414,297.433 62.373,291.089 66.388,296.823" class="axis" stroke="none" fill-opacity="1"/><text x="47.414" y="313.433" text-anchor="start" class="lbl-sm">x</text><text x="155" y="236" text-anchor="start" class="lbl">O</text><line x1="170" y1="220" x2="139.282" y2="241.509" class="accent-b" stroke-width="2.5"/><polygon points="139.282,241.509 141.818,236.071 145.259,240.986" class="accent-b" stroke="none" fill-opacity="1"/><line x1="170" y1="220" x2="220" y2="220" class="accent-c" stroke-width="2.5"/><polygon points="220,220 214.804,223 214.804,217" class="accent-c" stroke="none" fill-opacity="1"/><line x1="170" y1="220" x2="170" y2="170" class="accent-a" stroke-width="2.5"/><polygon points="170,170 173,175.196 167,175.196" class="accent-a" stroke="none" fill-opacity="1"/><text x="125.282" y="247.509" text-anchor="start" class="lbl">i⃗</text><text x="222" y="212" text-anchor="start" class="lbl">j⃗</text><text x="178" y="176" text-anchor="start" class="lbl">k⃗</text><text x="230" y="320" text-anchor="middle" class="lbl-sm">OM⃗ = x·i⃗ + y·j⃗ + z·k⃗</text></svg>