<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" role="img" aria-label="Mặt phẳng trong không gian Oxyz"><title>Mặt phẳng trong không gian Oxyz</title><desc>Phương trình tổng quát mặt phẳng và khoảng cách trong Oxyz.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="460" height="320"/><polygon points="60,240 320,240 400,150 140,150" class="fill-a"/><polyline points="60,240 320,240 400,150 140,150 60,240" class="ink" fill="none"/><line x1="210" y1="195" x2="210" y2="85" class="accent-b" stroke-width="2.5"/><polygon points="210,85 214,91.928 206,91.928" class="accent-b" stroke="none" fill-opacity="1"/><circle cx="210" cy="195" r="3.5" class="accent-a"/><polyline points="210,183 222,183 222,195" class="ink-thin" fill="none"/><text x="218" y="211" text-anchor="start" class="lbl">M₀(x₀, y₀, z₀)</text><text x="220" y="100" text-anchor="start" class="lbl" font-weight="bold">n⃗ = (A, B, C)</text><text x="80" y="225" text-anchor="start" class="lbl" font-size="16px">(P)</text><text x="280" y="45" text-anchor="middle" class="lbl-sm">A(x - x₀) + B(y - y₀) + C(z - z₀) = 0</text><text x="280" y="70" text-anchor="middle" class="lbl-sm">Phương trình tổng quát: Ax + By + Cz + D = 0</text></svg>