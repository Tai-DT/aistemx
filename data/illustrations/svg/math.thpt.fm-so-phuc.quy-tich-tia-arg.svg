<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 277.276 283.576" role="img" aria-label="Tập hợp điểm arg(z − a) = θ"><title>Tập hợp điểm arg(z − a) = θ</title><desc>Tập hợp các điểm nhìn từ A theo một hướng cố định là một tia gốc A, bỏ chính điểm A.</desc><style>@media (prefers-color-scheme: dark){
