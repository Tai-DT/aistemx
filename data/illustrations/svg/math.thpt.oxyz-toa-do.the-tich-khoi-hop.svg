<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" role="img" aria-label="Vectơ trong không gian Oxyz"><title>Vectơ trong không gian Oxyz</title><desc>Tích có hướng và ứng dụng hình học trong không gian Oxyz.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="460" height="320"/><polygon points="90,240 230,220 310,150 170,170" class="fill-a"/><polygon points="105,120 245,100 325,30 185,50" class="fill-b"/><line x1="90" y1="240" x2="105" y2="120" class="ink"/><line x1="230" y1="220" x2="245" y2="100" class="ink"/><line x1="310" y1="150" x2="325" y2="30" class="ink"/><line x1="170" y1="170" x2="185" y2="50" class="ink-thin" stroke-dasharray="3 3"/><line x1="90" y1="240" x2="170" y2="170" class="ink-thin" stroke-dasharray="3 3"/><line x1="170" y1="170" x2="310" y2="150" class="ink-thin" stroke-dasharray="3 3"/><line x1="90" y1="240" x2="230" y2="220" class="ink"/><line x1="230" y1="220" x2="310" y2="150" class="ink"/><polygon points="105,120 245,100 325,30 185,50" class="fill-c"/><polyline points="105,120 245,100 325,30 185,50 105,120" class="ink" fill="none"/><line x1="90" y1="240" x2="230" y2="220" class="accent-a" stroke-width="2.5"/><polygon points="230,220 224.494,224.322 223.504,217.392" class="accent-a" stroke="none" fill-opacity="1"/><line x1="90" y1="240" x2="170" y2="170" class="accent-a" stroke-width="2.5"/><polygon points="170,170 167.743,176.626 163.133,171.358" class="accent-a" stroke="none" fill-opacity="1"/><line x1="90" y1="240" x2="105" y2="120" class="accent-b" stroke-width="2.5"/><polygon points="105,120 107.721,126.449 100.775,125.581" class="accent-b" stroke="none" fill-opacity="1"/><text x="160" y="248" text-anchor="start" class="lbl">u⃗</text><text x="116" y="205" text-anchor="start" class="lbl">v⃗</text><text x="89" y="180" text-anchor="start" class="lbl">w⃗</text><text x="280" y="45" text-anchor="start" class="lbl" font-size="16px">V = |[u⃗, v⃗] · w⃗|</text><text x="280" y="70" text-anchor="start" class="lbl-sm">Thể tích khối hộp dựng trên 3 vectơ</text></svg>