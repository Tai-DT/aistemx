<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" role="img" aria-label="Đường thẳng trong không gian Oxyz"><title>Đường thẳng trong không gian Oxyz</title><desc>Phương trình tham số, chính tắc và góc, khoảng cách của đường thẳng.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="460" height="320"/><line x1="60" y1="200" x2="380" y2="200" class="accent-a" stroke-width="2.2"/><text x="390" y="204" text-anchor="start" class="lbl">Δ (M₀, u⃗)</text><circle cx="120" cy="200" r="3" class="accent-a"/><line x1="120" y1="200" x2="180" y2="200" class="accent-c" stroke-width="2.5"/><polygon points="180,200 173.938,203.5 173.938,196.5" class="accent-c" stroke="none" fill-opacity="1"/><text x="120" y="218" text-anchor="start" class="lbl">M₀</text><text x="150" y="192" text-anchor="start" class="lbl">u⃗</text><line x1="260" y1="70" x2="260" y2="200" class="accent-b" stroke-width="2"/><line x1="120" y1="200" x2="260" y2="70" class="ink-thin" stroke-dasharray="3 3"/><circle cx="260" cy="70" r="4" class="accent-b"/><circle cx="260" cy="200" r="3" class="accent-a"/><polyline points="260,190 250,190 250,200" class="ink-thin" fill="none"/><text x="268" y="70" text-anchor="start" class="lbl">M</text><text x="266" y="218" text-anchor="start" class="lbl">H</text><text x="270" y="135" text-anchor="start" class="lbl-sm">d(M, Δ)</text><text x="230" y="35" text-anchor="middle" class="lbl" font-size="16px">d(M, Δ) = |[M₀M⃗, u⃗]| / |u⃗|</text></svg>