<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 412" role="img" aria-label="Đa giác đều 6 cạnh"><title>Đa giác đều 6 cạnh</title><desc>Đa giác đều 6 cạnh nội tiếp đường tròn bán kính R = 3.</desc><style>@media (prefers-color-scheme: dark){
