<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 402" role="img" aria-label="Đường tròn ngoại tiếp tam giác"><title>Đường tròn ngoại tiếp tam giác</title><desc>Tam giác ABC nội tiếp đường tròn (O; R): a/sin A = b/sin B = c/sin C = 2R.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="402" height="402"/><circle cx="201" cy="201" r="145" class="ink"/><polygon points="150.695,65.006 63.805,247.932 338.195,247.932" class="fill-a"/><polyline points="150.695,65.006 63.805,247.932 338.195,247.932 150.695,65.006" class="ink" fill="none"/><line x1="201" y1="201" x2="150.695" y2="65.006" class="accent-b" stroke-dasharray="5 4" stroke-width="1.6"/><text x="165.237" y="129.992" text-anchor="middle" class="lbl">R</text><path d="M 140.827 85.781 A 23 23 0 0 0 167.158 81.067" class="accent-d" style="fill:none" stroke-width="1.8"/><path d="M 86.805 247.932 A 23 23 0 0 0 73.674 227.157" class="accent-d" style="fill:none" stroke-width="1.8"/><path d="M 321.732 231.871 A 23 23 0 0 0 315.195 247.932" class="accent-d" style="fill:none" stroke-width="1.8"/><text x="146.188" y="53.114" text-anchor="middle" class="lbl">A</text><text x="48.639" y="260.111" text-anchor="middle" class="lbl">B</text><text x="354" y="258.692" text-anchor="middle" class="lbl">C</text><text x="204.977" y="266.895" text-anchor="middle" class="lbl">a</text><text x="257.827" y="154.193" text-anchor="middle" class="lbl">b</text><text x="93.304" y="155.446" text-anchor="middle" class="lbl">c</text><circle cx="201" cy="201" r="3.4" class="accent-d"/><text x="213" y="219.5" text-anchor="middle" class="lbl-sm">O</text></svg>