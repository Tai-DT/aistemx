<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-label="Ảnh của vật qua gương phẳng"><title>Ảnh của vật qua gương phẳng</title><desc>Vật đặt trước gương phẳng cho ảnh ảo, đối xứng với vật qua mặt gương, cùng chiều và cùng độ lớn.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="440" height="300"/><line x1="220" y1="32" x2="220" y2="228" class="ink" style="stroke-width:3"/><line x1="220" y1="32" x2="231" y2="21" class="ink-thin"/><line x1="220" y1="51.6" x2="231" y2="40.6" class="ink-thin"/><line x1="220" y1="71.2" x2="231" y2="60.2" class="ink-thin"/><line x1="220" y1="90.8" x2="231" y2="79.8" class="ink-thin"/><line x1="220" y1="110.4" x2="231" y2="99.4" class="ink-thin"/><line x1="220" y1="130" x2="231" y2="119" class="ink-thin"/><line x1="220" y1="149.6" x2="231" y2="138.6" class="ink-thin"/><line x1="220" y1="169.2" x2="231" y2="158.2" class="ink-thin"/><line x1="220" y1="188.8" x2="231" y2="177.8" class="ink-thin"/><line x1="220" y1="208.4" x2="231" y2="197.4" class="ink-thin"/><line x1="220" y1="228" x2="231" y2="217" class="ink-thin"/><line x1="141.6" y1="130" x2="141.6" y2="86.88" class="accent-c" stroke-width="2.5"/><polygon points="141.6,86.88 146.1,94.674 137.1,94.674" class="accent-c" stroke="none" fill-opacity="1"/><text x="134.6" y="81.88" text-anchor="end" class="lbl">B</text><text x="134.6" y="145" text-anchor="end" class="lbl">A</text><line x1="298.4" y1="130" x2="298.4" y2="86.88" class="accent-c" stroke-width="2.5" style="stroke-dasharray:6 4"/><polygon points="298.4,86.88 302.9,94.674 293.9,94.674" class="accent-c" stroke="none" fill-opacity="1"/><text x="320.4" y="81.88" text-anchor="start" class="lbl">B′</text><text x="320.4" y="145" text-anchor="start" class="lbl">A′</text><line x1="141.6" y1="86.88" x2="220" y2="86.88" class="accent-a" style="stroke-width:1.8"/><line x1="220" y1="86.88" x2="24" y2="86.88" class="accent-a" style="stroke-width:1.8"/><polygon points="122,86.88 127.629,83.63 127.629,90.13" class="accent-a" stroke="none" fill-opacity="1"/><line x1="220" y1="86.88" x2="298.4" y2="86.88" class="accent-a" style="stroke-width:1.5;stroke-dasharray:6 4"/><line x1="141.6" y1="86.88" x2="220" y2="117.064" class="accent-a" style="stroke-width:1.8"/><line x1="220" y1="117.064" x2="24" y2="192.524" class="accent-a" style="stroke-width:1.8"/><polygon points="122,154.794 126.086,149.739 128.421,155.804" class="accent-a" stroke="none" fill-opacity="1"/><line x1="220" y1="117.064" x2="298.4" y2="86.88" class="accent-a" style="stroke-width:1.5;stroke-dasharray:6 4"/><line x1="141.6" y1="172" x2="220" y2="172" class="ink-thin"/><polygon points="220,172 214.804,175 214.804,169" class="ink-thin" stroke="none" fill-opacity="1"/><polygon points="141.6,172 146.796,169 146.796,175" class="ink-thin" stroke="none" fill-opacity="1"/><text x="180.8" y="166" text-anchor="middle" class="lbl-sm">d</text><line x1="220" y1="172" x2="298.4" y2="172" class="ink-thin"/><polygon points="298.4,172 293.204,175 293.204,169" class="ink-thin" stroke="none" fill-opacity="1"/><polygon points="220,172 225.196,169 225.196,175" class="ink-thin" stroke="none" fill-opacity="1"/><text x="259.2" y="166" text-anchor="middle" class="lbl-sm">d′ = d</text><text x="26" y="284" text-anchor="start" class="lbl-sm">ảnh ảo, cùng chiều, h′ = h, đối xứng với vật qua mặt gương</text></svg>