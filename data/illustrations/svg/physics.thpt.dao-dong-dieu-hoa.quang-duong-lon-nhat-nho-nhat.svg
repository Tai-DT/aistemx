<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 316" role="img" aria-label="Vòng tròn pha - quãng đường lớn nhất, nhỏ nhất"><title>Vòng tròn pha - quãng đường lớn nhất, nhỏ nhất</title><desc>Liên hệ dao động điều hoà với chuyển động tròn đều: cùng một góc quét cho quãng đường lớn nhất khi đối xứng qua vị trí cân bằng và nhỏ nhất khi đối xứng qua biên.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="520" height="316"/><circle cx="144" cy="132" r="84" class="ink-thin" stroke-dasharray="5 5"/><line x1="36" y1="132" x2="254" y2="132" class="axis" stroke-width="2.5"/><polygon points="254,132 247.938,135.5 247.938,128.5" class="axis" stroke="none" fill-opacity="1"/><text x="252" y="124" text-anchor="end" class="lbl">x</text><circle cx="144" cy="132" r="2.8" class="accent-b"/><text x="136" y="148" text-anchor="end" class="lbl-sm">O</text><path d="M 208.348 78.006 A 84 84 0 0 0 79.652 78.006" class="accent-b" style="fill:none;stroke-width:2.8"/><circle cx="208.348" cy="78.006" r="4" class="accent-a"/><line x1="208.348" y1="78.006" x2="208.348" y2="132" class="ink-thin" stroke-dasharray="4 4"/><circle cx="79.652" cy="78.006" r="4" class="accent-a"/><line x1="79.652" y1="78.006" x2="79.652" y2="132" class="ink-thin" stroke-dasharray="4 4"/><line x1="79.652" y1="132" x2="208.348" y2="132" class="accent-c" stroke-width="4"/><line x1="79.652" y1="164" x2="208.348" y2="164" class="accent-c" stroke-width="1.3"/><polygon points="208.348,164 202.609,167.052 202.609,160.948" class="accent-c" stroke="none" fill-opacity="1"/><polygon points="79.652,164 85.391,160.948 85.391,167.052" class="accent-c" stroke="none" fill-opacity="1"/><path d="M 168.513 111.431 A 32 32 0 0 0 119.487 111.431" class="accent-d" style="fill:none;stroke-width:1.8"/><text x="144" y="80" text-anchor="middle" class="lbl-sm">Δφ = ωΔt</text><text x="144" y="258" text-anchor="middle" class="lbl">S</text><text x="150" y="258" text-anchor="start" class="lbl"><tspan dy="4" font-size="10">max</tspan></text><text x="144" y="278" text-anchor="middle" class="lbl-sm">= 2A·sin(ωΔt/2)</text><text x="144" y="304" text-anchor="middle" class="lbl-sm">cung đối xứng qua vị trí cân bằng</text><circle cx="376" cy="132" r="84" class="ink-thin" stroke-dasharray="5 5"/><line x1="268" y1="132" x2="486" y2="132" class="axis" stroke-width="2.5"/><polygon points="486,132 479.938,135.5 479.938,128.5" class="axis" stroke="none" fill-opacity="1"/><text x="484" y="124" text-anchor="end" class="lbl">x</text><circle cx="376" cy="132" r="2.8" class="accent-b"/><text x="368" y="148" text-anchor="end" class="lbl-sm">O</text><path d="M 429.994 196.348 A 84 84 0 0 0 429.994 67.652" class="accent-b" style="fill:none;stroke-width:2.8"/><circle cx="429.994" cy="196.348" r="4" class="accent-a"/><line x1="429.994" y1="196.348" x2="429.994" y2="132" class="ink-thin" stroke-dasharray="4 4"/><circle cx="429.994" cy="67.652" r="4" class="accent-a"/><line x1="429.994" y1="67.652" x2="429.994" y2="132" class="ink-thin" stroke-dasharray="4 4"/><line x1="429.994" y1="132" x2="460" y2="132" class="accent-c" stroke-width="4"/><line x1="429.994" y1="164" x2="460" y2="164" class="accent-c" stroke-width="1.3"/><polygon points="460,164 454.261,167.052 454.261,160.948" class="accent-c" stroke="none" fill-opacity="1"/><polygon points="429.994,164 435.733,160.948 435.733,167.052" class="accent-c" stroke="none" fill-opacity="1"/><path d="M 396.569 156.513 A 32 32 0 0 0 396.569 107.487" class="accent-d" style="fill:none;stroke-width:1.8"/><text x="364" y="88" text-anchor="end" class="lbl-sm">Δφ = ωΔt</text><text x="376" y="258" text-anchor="middle" class="lbl">S</text><text x="382" y="258" text-anchor="start" class="lbl"><tspan dy="4" font-size="10">min</tspan></text><text x="376" y="278" text-anchor="middle" class="lbl-sm">= 2A(1 − cos(ωΔt/2))</text><text x="376" y="304" text-anchor="middle" class="lbl-sm">cung đối xứng qua biên: đi ra rồi về</text></svg>