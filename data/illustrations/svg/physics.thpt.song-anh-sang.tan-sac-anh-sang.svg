<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Hiện tượng tán sắc ánh sáng qua lăng kính"><title>Hiện tượng tán sắc ánh sáng qua lăng kính</title><desc>Chùm ánh sáng trắng bị tách thành dải quang phổ liên tục từ đỏ đến tím do chiết suất n_tím &gt; n_đỏ.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="480" height="320"/><polygon points="210,60 110,260 310,260" class="fill-a"/><polyline points="210,60 110,260 310,260 210,60" class="ink" fill="none" stroke-width="2"/><text x="210" y="52" text-anchor="middle" class="lbl">A</text><line x1="40" y1="215" x2="150" y2="180" class="ink" stroke-width="2.5"/><polygon points="150,180 144.611,185.912 142.185,178.289" class="ink" stroke="none" fill-opacity="1"/><text x="50" y="205" text-anchor="start" class="lbl-sm">Ánh sáng trắng</text><line x1="150" y1="180" x2="265" y2="160" class="accent-b"/><line x1="265" y1="160" x2="420" y2="205" class="accent-b" stroke-width="2.5"/><polygon points="420,205 413.202,206.671 415.154,199.949" class="accent-b" stroke="none" fill-opacity="1"/><text x="426" y="208" text-anchor="start" class="lbl-sm">Tia đỏ (lệch ít)</text><line x1="150" y1="180" x2="275" y2="185" class="accent-a"/><line x1="275" y1="185" x2="410" y2="255" class="accent-a" stroke-width="2.5"/><polygon points="410,255 403.007,255.317 406.229,249.102" class="accent-a" stroke="none" fill-opacity="1"/><text x="416" y="258" text-anchor="start" class="lbl-sm">Tia tím (lệch nhiều)</text><polygon points="265,160 420,205 410,255 275,185" class="fill-c"/><text x="240" y="308" text-anchor="middle" class="lbl-sm">n_đỏ &lt; n_cam &lt; n_vàng &lt; n_lục &lt; n_lam &lt; n_chàm &lt; n_tím</text></svg>