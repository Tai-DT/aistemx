<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375.84 291.16" role="img" aria-label="Phân tích vectơ theo hai phương"><title>Phân tích vectơ theo hai phương</title><desc>Vectơ x viết thành tổng của m lần vectơ a và n lần vectơ b.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="375.84" height="291.16"/><polygon points="70,215.16 241.6,182.16 283.84,66 112.24,99" class="fill-a"/><line x1="241.6" y1="182.16" x2="283.84" y2="66" class="ink-thin" stroke-dasharray="5 4"/><line x1="112.24" y1="99" x2="283.84" y2="66" class="ink-thin" stroke-dasharray="5 4"/><line x1="70" y1="215.16" x2="184.4" y2="193.16" class="accent-a" stroke-width="2.5"/><polygon points="184.4,193.16 178.352,198.396 176.841,190.54" class="accent-a" stroke="none" fill-opacity="1"/><line x1="70" y1="215.16" x2="105.2" y2="118.36" class="accent-c" stroke-width="2.5"/><polygon points="105.2,118.36 106.592,126.238 99.073,123.504" class="accent-c" stroke="none" fill-opacity="1"/><line x1="70" y1="215.16" x2="241.6" y2="182.16" class="accent-a" stroke-width="2.5"/><polygon points="241.6,182.16 234.796,188.051 233.096,179.213" class="accent-a" stroke="none" fill-opacity="1"/><line x1="70" y1="215.16" x2="112.24" y2="99" class="accent-c" stroke-width="2.5"/><polygon points="112.24,99 113.805,107.863 105.347,104.787" class="accent-c" stroke="none" fill-opacity="1"/><line x1="70" y1="215.16" x2="283.84" y2="66" class="accent-b" stroke-width="2.5"/><polygon points="283.84,66 279.598,75.055 273.877,66.854" class="accent-b" stroke="none" fill-opacity="1"/><text x="191.4" y="209.16" text-anchor="start" class="lbl">a</text><text x="98.2" y="132.36" text-anchor="end" class="lbl">b</text><text x="248.6" y="176.16" text-anchor="start" class="lbl-sm">m·a</text><text x="105.24" y="93" text-anchor="end" class="lbl-sm">n·b</text><text x="291.84" y="60" text-anchor="start" class="lbl">x</text><circle cx="70" cy="215.16" r="3" class="ink"/><text x="187.92" y="273.16" text-anchor="middle" class="lbl-sm">x = m·a + n·b (m = 1.5, n = 1.2)</text></svg>