<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 382 382" role="img" aria-label="Hai dây cắt nhau trong đường tròn"><title>Hai dây cắt nhau trong đường tròn</title><desc>Hai dây AB và CD cắt nhau tại M nằm trong đường tròn: MA·MB = MC·MD.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="382" height="382"/><circle cx="191" cy="191" r="135" class="ink"/><line x1="98.548" y1="289.375" x2="325.841" y2="197.542" class="accent-a" stroke-width="2.4"/><line x1="276.195" y1="295.722" x2="217.059" y2="58.539" class="accent-c" stroke-width="2.4"/><circle cx="258.5" cy="224.75" r="3.4" class="accent-b"/><circle cx="191" cy="191" r="2.6" class="accent-b"/><text x="88.275" y="304.805" text-anchor="middle" class="lbl">A</text><text x="340.824" y="202.769" text-anchor="middle" class="lbl">B</text><text x="285.662" y="311.858" text-anchor="middle" class="lbl">C</text><text x="219.954" y="48.321" text-anchor="middle" class="lbl">D</text><text x="252.5" y="246.25" text-anchor="middle" class="lbl">M</text></svg>