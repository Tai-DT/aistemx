<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375.751 222.8" role="img" aria-label="Ba điểm thẳng hàng"><title>Ba điểm thẳng hàng</title><desc>Ba điểm A, B, C cùng nằm trên một đường thẳng; vectơ AB bằng k lần vectơ AC.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="375.751" height="222.8"/><line x1="57.387" y1="158.736" x2="308.363" y2="56.064" class="ink-thin" stroke-dasharray="6 5"/><line x1="70.877" y1="122.403" x2="196.365" y2="71.067" class="accent-a" stroke-width="2.5"/><polygon points="196.365,71.067 190.855,78.184 187.447,69.854" class="accent-a" stroke="none" fill-opacity="1"/><line x1="92.474" y1="175.197" x2="294.874" y2="92.397" class="accent-b" stroke-width="2.5"/><polygon points="294.874,92.397 289.364,99.513 285.956,91.183" class="accent-b" stroke="none" fill-opacity="1"/><circle cx="81.675" cy="148.8" r="3.4" class="ink"/><text x="81.675" y="167.8" text-anchor="middle" class="lbl">A</text><circle cx="207.163" cy="97.464" r="3.4" class="ink"/><text x="207.163" y="116.464" text-anchor="middle" class="lbl">B</text><circle cx="284.075" cy="66" r="3.4" class="ink"/><text x="284.075" y="85" text-anchor="middle" class="lbl">C</text><text x="133.621" y="87.735" text-anchor="middle" class="lbl">AB</text><text x="193.674" y="151.797" text-anchor="middle" class="lbl">AC</text><text x="187.875" y="204.8" text-anchor="middle" class="lbl-sm">AB = k·AC (k = 0.62)</text></svg>