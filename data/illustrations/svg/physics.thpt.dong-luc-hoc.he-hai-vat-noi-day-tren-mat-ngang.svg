<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 262" role="img" aria-label="Hai vật nối dây, kéo trên mặt ngang"><title>Hai vật nối dây, kéo trên mặt ngang</title><desc>Hai vật nối bằng dây trên mặt phẳng ngang, chịu lực kéo F.</desc><style>@media (prefers-color-scheme: dark){
