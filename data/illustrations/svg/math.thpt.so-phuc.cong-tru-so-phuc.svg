<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441.6 370.8" role="img" aria-label="Cộng và trừ số phức trên mặt phẳng Argand"><title>Cộng và trừ số phức trên mặt phẳng Argand</title><desc>Tổng hai số phức ứng với đường chéo hình bình hành dựng trên hai vectơ biểu diễn.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="441.6" height="370.8"/><line x1="70" y1="261.6" x2="345.6" y2="261.6" class="axis" stroke-width="2.5"/><polygon points="345.6,261.6 339.538,265.1 339.538,258.1" class="axis" stroke="none" fill-opacity="1"/><line x1="101.2" y1="292.8" x2="101.2" y2="64" class="axis" stroke-width="2.5"/><polygon points="101.2,64 104.7,70.062 97.7,70.062" class="axis" stroke="none" fill-opacity="1"/><text x="343.6" y="252.6" text-anchor="end" class="lbl">Re</text><text x="110.2" y="75" text-anchor="start" class="lbl">Im</text><text x="93.2" y="276.6" text-anchor="end" class="lbl">O</text><polygon points="101.2,261.6 257.2,214.8 314.4,95.2 158.4,142" class="fill-a"/><line x1="257.2" y1="214.8" x2="314.4" y2="95.2" class="ink-thin" stroke-dasharray="5 4"/><line x1="158.4" y1="142" x2="314.4" y2="95.2" class="ink-thin" stroke-dasharray="5 4"/><line x1="101.2" y1="261.6" x2="257.2" y2="214.8" class="accent-a" stroke-width="2.5"/><polygon points="257.2,214.8 251.028,221.35 248.441,212.729" class="accent-a" stroke="none" fill-opacity="1"/><line x1="101.2" y1="261.6" x2="158.4" y2="142" class="accent-c" stroke-width="2.5"/><polygon points="158.4,142 159.097,150.973 150.978,147.09" class="accent-c" stroke="none" fill-opacity="1"/><line x1="101.2" y1="261.6" x2="314.4" y2="95.2" class="accent-b" stroke-width="2.5"/><polygon points="314.4,95.2 310.649,104.47 304.497,96.587" class="accent-b" stroke="none" fill-opacity="1"/><text x="265.2" y="208.8" text-anchor="start" class="lbl">z₁</text><text x="166.4" y="136" text-anchor="start" class="lbl">z₂</text><text x="322.4" y="89.2" text-anchor="start" class="lbl">z₁ + z₂</text><text x="220.8" y="352.8" text-anchor="middle" class="lbl-sm">|z₁ + z₂| ≤ |z₁| + |z₂| (bất đẳng thức tam giác)</text></svg>