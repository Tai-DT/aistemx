<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 308 334" role="img" aria-label="Mô hình nguyên tử Bohr"><title>Mô hình nguyên tử Bohr</title><desc>Hạt nhân ở tâm và 4 quỹ đạo dừng tròn đồng tâm; bán kính quỹ đạo thứ n tỉ lệ với n² nên các quỹ đạo càng ra ngoài càng thưa dần.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="308" height="334"/><circle cx="154" cy="154" r="6.75" class="ink-thin"/><circle cx="154" cy="154" r="27" class="ink-thin"/><text x="154" y="122" text-anchor="middle" class="lbl-sm">n = 2</text><circle cx="154" cy="154" r="60.75" class="ink-thin"/><text x="154" y="88.25" text-anchor="middle" class="lbl-sm">n = 3</text><circle cx="154" cy="154" r="108" class="ink"/><text x="154" y="41" text-anchor="middle" class="lbl-sm">n = 4</text><circle cx="154" cy="154" r="5" class="accent-b" fill-opacity="1"/><circle cx="242.468" cy="92.054" r="5" class="accent-a"/><line x1="154" y1="154" x2="242.468" y2="92.054" class="accent-a" stroke-width="1.6" stroke-dasharray="4 3"/><text x="206.658" y="113.93" text-anchor="start" class="lbl">r₄</text><text x="24" y="324" text-anchor="start" class="lbl-sm">chấm đỏ ở tâm: hạt nhân</text><text x="284" y="324" text-anchor="end" class="lbl">r(n) = n²·a₀ / Z</text></svg>