<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 274" role="img" aria-label="Dải số liệu và mốc thống kê"><title>Dải số liệu và mốc thống kê</title><desc>Các giá trị của mẫu trên trục số cùng một số đặc trưng của mẫu.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="480" height="274"/><line x1="42" y1="206" x2="460" y2="206" class="axis"/><line x1="86.903" y1="206" x2="86.903" y2="211" class="axis"/><text x="86.903" y="225" text-anchor="middle" class="lbl-sm">4</text><line x1="179.53" y1="206" x2="179.53" y2="211" class="axis"/><text x="179.53" y="225" text-anchor="middle" class="lbl-sm">6</text><line x1="272.157" y1="206" x2="272.157" y2="211" class="axis"/><text x="272.157" y="225" text-anchor="middle" class="lbl-sm">8</text><line x1="364.783" y1="206" x2="364.783" y2="211" class="axis"/><text x="364.783" y="225" text-anchor="middle" class="lbl-sm">10</text><text x="460" y="242" text-anchor="end" class="lbl">giá trị</text><line x1="221.212" y1="206" x2="221.212" y2="60" class="accent-b" stroke-dasharray="5 4" stroke-width="2.2"/><text x="221.212" y="52" text-anchor="middle" class="lbl">x̄ = 6,9</text><line x1="86.903" y1="192" x2="221.212" y2="192" class="accent-c" stroke-dasharray="5 4" stroke-width="1.4"/><circle cx="86.903" cy="192" r="4" class="accent-a"/><line x1="133.217" y1="178.444" x2="221.212" y2="178.444" class="accent-c" stroke-dasharray="5 4" stroke-width="1.4"/><circle cx="133.217" cy="178.444" r="4" class="accent-a"/><line x1="133.217" y1="164.889" x2="221.212" y2="164.889" class="accent-c" stroke-dasharray="5 4" stroke-width="1.4"/><circle cx="133.217" cy="164.889" r="4" class="accent-a"/><line x1="179.53" y1="151.333" x2="221.212" y2="151.333" class="accent-c" stroke-dasharray="5 4" stroke-width="1.4"/><circle cx="179.53" cy="151.333" r="4" class="accent-a"/><line x1="225.843" y1="137.778" x2="221.212" y2="137.778" class="accent-c" stroke-dasharray="5 4" stroke-width="1.4"/><circle cx="225.843" cy="137.778" r="4" class="accent-a"/><line x1="225.843" y1="124.222" x2="221.212" y2="124.222" class="accent-c" stroke-dasharray="5 4" stroke-width="1.4"/><circle cx="225.843" cy="124.222" r="4" class="accent-a"/><line x1="225.843" y1="110.667" x2="221.212" y2="110.667" class="accent-c" stroke-dasharray="5 4" stroke-width="1.4"/><circle cx="225.843" cy="110.667" r="4" class="accent-a"/><line x1="272.157" y1="97.111" x2="221.212" y2="97.111" class="accent-c" stroke-dasharray="5 4" stroke-width="1.4"/><circle cx="272.157" cy="97.111" r="4" class="accent-a"/><line x1="318.47" y1="83.556" x2="221.212" y2="83.556" class="accent-c" stroke-dasharray="5 4" stroke-width="1.4"/><circle cx="318.47" cy="83.556" r="4" class="accent-a"/><line x1="411.097" y1="70" x2="221.212" y2="70" class="accent-c" stroke-dasharray="5 4" stroke-width="1.4"/><circle cx="411.097" cy="70" r="4" class="accent-a"/><text x="48" y="32" text-anchor="start" class="lbl-sm">mỗi đoạn nét đứt là một độ lệch xᵢ − x̄</text><text x="450" y="32" text-anchor="end" class="lbl-sm">n = 10</text></svg>