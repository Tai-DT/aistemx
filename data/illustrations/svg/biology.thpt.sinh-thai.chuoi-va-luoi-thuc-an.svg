<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 532 200" role="img" aria-label="Chuỗi thức ăn và bậc dinh dưỡng"><title>Chuỗi thức ăn và bậc dinh dưỡng</title><desc>Các mắt xích nối nhau bằng mũi tên chỉ chiều truyền chất và năng lượng; mỗi mắt xích là một bậc dinh dưỡng, đánh số từ 1.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="532" height="200"/><rect x="34" y="76" width="104" height="56" class="fill-a"/><rect x="34" y="76" width="104" height="56" class="ink"/><text x="86" y="108" text-anchor="middle" class="lbl-sm">SV sản xuất</text><text x="86" y="66" text-anchor="middle" class="lbl-sm">bậc 1</text><line x1="139" y1="104" x2="151" y2="104" class="accent-b" stroke-width="2.5"/><polygon points="151,104 144.938,107.5 144.938,100.5" class="accent-b" stroke="none" fill-opacity="1"/><rect x="152" y="76" width="104" height="56" class="fill-a"/><rect x="152" y="76" width="104" height="56" class="ink"/><text x="204" y="108" text-anchor="middle" class="lbl-sm">SVTT bậc 1</text><text x="204" y="66" text-anchor="middle" class="lbl-sm">bậc 2</text><line x1="257" y1="104" x2="269" y2="104" class="accent-b" stroke-width="2.5"/><polygon points="269,104 262.938,107.5 262.938,100.5" class="accent-b" stroke="none" fill-opacity="1"/><rect x="270" y="76" width="104" height="56" class="fill-a"/><rect x="270" y="76" width="104" height="56" class="ink"/><text x="322" y="108" text-anchor="middle" class="lbl-sm">SVTT bậc 2</text><text x="322" y="66" text-anchor="middle" class="lbl-sm">bậc 3</text><line x1="375" y1="104" x2="387" y2="104" class="accent-b" stroke-width="2.5"/><polygon points="387,104 380.938,107.5 380.938,100.5" class="accent-b" stroke="none" fill-opacity="1"/><rect x="388" y="76" width="104" height="56" class="fill-a"/><rect x="388" y="76" width="104" height="56" class="ink"/><text x="440" y="108" text-anchor="middle" class="lbl-sm">SVTT bậc 3</text><text x="440" y="66" text-anchor="middle" class="lbl-sm">bậc 4</text><text x="34" y="168" text-anchor="start" class="lbl-sm">mũi tên chỉ chiều dòng năng lượng đi qua các bậc dinh dưỡng</text></svg>