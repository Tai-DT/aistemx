<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Trường hấp dẫn và định luật vạn vật hấp dẫn"><title>Trường hấp dẫn và định luật vạn vật hấp dẫn</title><desc>Tương tác hấp dẫn giữa hai vật F = G·m₁m₂/r².</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="480" height="320"/><text x="240" y="40" text-anchor="middle" class="lbl" font-size="20px">F = G · (m₁ · m₂) / r²</text><text x="240" y="68" text-anchor="middle" class="lbl-sm">Hai vật hút nhau bằng cặp lực trực đối: F⃗₁₂ = -F⃗₂₁</text><circle cx="110" cy="185" r="32" class="accent-a" fill-opacity="0.3" stroke-width="2"/><circle cx="110" cy="185" r="4" class="accent-a"/><text x="110" y="190" text-anchor="middle" class="lbl">m₁</text><circle cx="360" cy="185" r="24" class="accent-c" fill-opacity="0.3" stroke-width="2"/><circle cx="360" cy="185" r="4" class="accent-c"/><text x="360" y="190" text-anchor="middle" class="lbl">m₂</text><line x1="110" y1="240" x2="360" y2="240" class="ink" stroke-width="1.8"/><line x1="140" y1="240" x2="110" y2="240" class="ink" stroke-width="2.5"/><polygon points="110,240 115.196,237 115.196,243" class="ink" stroke="none" fill-opacity="1"/><line x1="330" y1="240" x2="360" y2="240" class="ink" stroke-width="2.5"/><polygon points="360,240 354.804,243 354.804,237" class="ink" stroke="none" fill-opacity="1"/><line x1="110" y1="185" x2="110" y2="250" class="ink-thin" stroke-dasharray="3 3"/><line x1="360" y1="185" x2="360" y2="250" class="ink-thin" stroke-dasharray="3 3"/><text x="235" y="233" text-anchor="middle" class="lbl-sm">r (Khoảng cách giữa hai tâm)</text><line x1="110" y1="185" x2="175" y2="185" class="accent-b" stroke-width="2.5"/><polygon points="175,185 168.072,189 168.072,181" class="accent-b" stroke="none" fill-opacity="1"/><text x="178" y="175" text-anchor="start" class="lbl">F⃗₁₂</text><line x1="360" y1="185" x2="295" y2="185" class="accent-b" stroke-width="2.5"/><polygon points="295,185 301.928,181 301.928,189" class="accent-b" stroke="none" fill-opacity="1"/><text x="280" y="175" text-anchor="start" class="lbl">F⃗₂₁</text><text x="240" y="300" text-anchor="middle" class="lbl-sm">G ≈ 6,674 × 10⁻¹¹ N·m²/kg²</text></svg>