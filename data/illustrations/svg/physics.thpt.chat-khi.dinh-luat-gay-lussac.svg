<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" role="img" aria-label="Giản đồ p - V: đẳng tích (V = const)"><title>Giản đồ p - V: đẳng tích (V = const)</title><desc>Giản đồ áp suất - thể tích của khí lí tưởng.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="420" height="320"/><line x1="58" y1="246" x2="370" y2="246" class="axis" stroke-width="2.5"/><polygon points="370,246 363.938,249.5 363.938,242.5" class="axis" stroke="none" fill-opacity="1"/><line x1="58" y1="246" x2="58" y2="18" class="axis" stroke-width="2.5"/><polygon points="58,18 61.5,24.062 54.5,24.062" class="axis" stroke="none" fill-opacity="1"/><text x="368" y="264" text-anchor="end" class="lbl">V</text><text x="64" y="14" text-anchor="start" class="lbl">p</text><text x="50" y="261" text-anchor="middle" class="lbl-sm">O</text><polyline points="130.115,79.846 130.115,187.846" class="curve" fill="none" style="fill:none"/><circle cx="130.115" cy="79.846" r="3.6" class="accent-b"/><text x="122.115" y="71.846" text-anchor="end" class="lbl">1</text><circle cx="130.115" cy="187.846" r="3.6" class="accent-b"/><text x="138.115" y="179.846" text-anchor="start" class="lbl">2</text><polygon points="130.115,187.846 126.365,181.351 133.865,181.351" class="accent-b" stroke="none" fill-opacity="1"/><text x="58" y="292" text-anchor="start" class="lbl-sm">đẳng tích (V = const)</text></svg>