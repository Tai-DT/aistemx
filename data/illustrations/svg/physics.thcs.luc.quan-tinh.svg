<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 274" role="img" aria-label="Sơ đồ lực - vật trên mặt phẳng ngang"><title>Sơ đồ lực - vật trên mặt phẳng ngang</title><desc>Các lực tác dụng lên vật đặt trên mặt phẳng ngang: trọng lực, phản lực, lực kéo và lực ma sát.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="400" height="274"/><line x1="36" y1="194" x2="364" y2="194" class="ink"/><line x1="43.5" y1="194" x2="36.75" y2="203" class="ink-thin"/><line x1="58.5" y1="194" x2="51.75" y2="203" class="ink-thin"/><line x1="73.5" y1="194" x2="66.75" y2="203" class="ink-thin"/><line x1="88.5" y1="194" x2="81.75" y2="203" class="ink-thin"/><line x1="103.5" y1="194" x2="96.75" y2="203" class="ink-thin"/><line x1="118.5" y1="194" x2="111.75" y2="203" class="ink-thin"/><line x1="133.5" y1="194" x2="126.75" y2="203" class="ink-thin"/><line x1="148.5" y1="194" x2="141.75" y2="203" class="ink-thin"/><line x1="163.5" y1="194" x2="156.75" y2="203" class="ink-thin"/><line x1="223.5" y1="194" x2="216.75" y2="203" class="ink-thin"/><line x1="238.5" y1="194" x2="231.75" y2="203" class="ink-thin"/><line x1="253.5" y1="194" x2="246.75" y2="203" class="ink-thin"/><line x1="268.5" y1="194" x2="261.75" y2="203" class="ink-thin"/><line x1="283.5" y1="194" x2="276.75" y2="203" class="ink-thin"/><line x1="298.5" y1="194" x2="291.75" y2="203" class="ink-thin"/><line x1="313.5" y1="194" x2="306.75" y2="203" class="ink-thin"/><line x1="328.5" y1="194" x2="321.75" y2="203" class="ink-thin"/><line x1="343.5" y1="194" x2="336.75" y2="203" class="ink-thin"/><line x1="358.5" y1="194" x2="351.75" y2="203" class="ink-thin"/><polygon points="161,142 239,142 239,194 161,194" class="fill-a"/><polyline points="161,142 239,142 239,194 161,194 161,142" class="ink" fill="none"/><line x1="200" y1="168" x2="200" y2="102" class="accent-c" stroke-width="2.5"/><polygon points="200,102 204.5,109.794 195.5,109.794" class="accent-c" stroke="none" fill-opacity="1"/><text x="207" y="100" text-anchor="start" class="lbl">N</text><line x1="200" y1="168" x2="200" y2="232" class="accent-b" stroke-width="2.5"/><polygon points="200,232 195.5,224.206 204.5,224.206" class="accent-b" stroke="none" fill-opacity="1"/><text x="207" y="230" text-anchor="start" class="lbl">P</text><text x="388" y="252" text-anchor="end" class="lbl-sm">hợp lực bằng 0 → vật đứng yên hoặc chuyển động thẳng đều</text></svg>