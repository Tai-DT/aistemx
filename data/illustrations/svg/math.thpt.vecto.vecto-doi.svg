<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 401.699 264.398" role="img" aria-label="Nhân vectơ với số k = 2"><title>Nhân vectơ với số k = 2</title><desc>Vectơ a và vectơ k·a vẽ song song để so sánh hướng và độ dài.</desc><style>@media (prefers-color-scheme: dark){
