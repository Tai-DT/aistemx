yle="stroke-width:1.5"/><polygon points="220,116 213.505,119.75 213.505,112.25" class="accent-a" stroke="none" fill-opacity="1"/><line x1="116" y1="140" x2="324" y2="140" class="accent-a" style="stroke-width:1.5"/><polygon points="220,140 213.505,143.75 213.505,136.25" class="accent-a" stroke="none" fill-opacity="1"/><line x1="116" y1="164" x2="324" y2="164" class="accent-a" style="stroke-width:1.5"/><polygon points="220,164 213.505,167.75 213.505,160.25" class="accent-a" stroke="none" fill-opacity="1"/><text x="220" y="74" text-anchor="middle" class="lbl">B = μ₀·n·I</text><text x="342" y="145" text-anchor="start" class="lbl">N</text><text x="98" y="145" text-anchor="end" class="lbl">S</text><path d="M 324 140 C 404 140, 376 82, 220 82 C 64 82, 36 140, 116 140" class="accent-a" style="fill:none;stroke-width:1.3"/><polygon points="220,82 226.062,78.5 226.062,85.5" class="accent-a" stroke="none" fill-opacity="1"/><path d="M 324 140 C 404 140, 376 198, 220 198 C 64 198, 36 140, 116 140" class="accent-a" style="fill:none;stroke-width:1.3"/><polygon points="220,198 226.062,194.5 226.062,201.5" class="accent-a" stroke="none" fill-opacity="1"/><line x1="110" y1="230" x2="330" y2="230" class="ink-thin"/><polygon points="330,230 324.804,233 324.804,227" class="ink-thin" stroke="none" fill-opacity="1"/><polygon points="110,230 115.196,227 115.196,233" class="ink-thin" stroke="none" fill-opacity="1"/><text x="220" y="224" text-anchor="middle" class="lbl-sm">ℓ  (N vòng)</text><text x="220" y="268" text-anchor="middle" class="lbl-sm">trong lòng ống dây từ trường coi như đều</text></svg>