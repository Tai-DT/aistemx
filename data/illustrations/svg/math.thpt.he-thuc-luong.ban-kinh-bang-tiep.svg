<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 257.498 412" role="img" aria-label="Đường tròn bàng tiếp"><title>Đường tròn bàng tiếp</title><desc>Đường tròn bàng tiếp trong góc A tiếp xúc cạnh BC và phần kéo dài của hai cạnh AB, AC; bán kính r_a = S/(p − a).</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="257.498" height="412"/><line x1="83.028" y1="238.884" x2="56" y2="346.996" class="ink-thin" stroke-dasharray="6 4" stroke-width="1.4"/><line x1="174.47" y1="238.884" x2="201.498" y2="346.996" class="ink-thin" stroke-dasharray="6 4" stroke-width="1.4"/><circle cx="128.749" cy="297.442" r="58.558" class="ink-thin"/><polygon points="128.749,56 83.028,238.884 174.47,238.884" class="fill-a"/><polyline points="128.749,56 83.028,238.884 174.47,238.884 128.749,56" class="ink" fill="none"/><line x1="128.749" y1="297.442" x2="128.749" y2="238.884" class="accent-b" stroke-width="2"/><polyline points="128.749,248.884 138.749,248.884 138.749,238.884" class="ink-thin" fill="none"/><text x="141.749" y="272.663" text-anchor="middle" class="lbl">r<tspan font-size="70%" dy="3.5">a</tspan></text><circle cx="128.749" cy="238.884" r="2.8" class="accent-d"/><circle cx="71.939" cy="283.239" r="2.8" class="accent-d"/><circle cx="185.559" cy="283.239" r="2.8" class="accent-d"/><circle cx="128.749" cy="297.442" r="3.6" class="accent-d"/><text x="143.749" y="305.942" text-anchor="middle" class="lbl">I<tspan font-size="70%" dy="3.5">a</tspan></text><text x="128.749" y="43.5" text-anchor="middle" class="lbl">A</text><text x="72.828" y="256.984" text-anchor="middle" class="lbl">B</text><text x="184.67" y="256.984" text-anchor="middle" class="lbl">C</text></svg>