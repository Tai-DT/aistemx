<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 289.939 392" role="img" aria-label="Cung chứa góc"><title>Cung chứa góc</title><desc>Quỹ tích các điểm M nhìn đoạn AB dưới góc 55° là hai cung tròn đối xứng nhau qua AB.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="289.939" height="392"/><path d="M 72.09 196 A 88.969 88.969 0 1 1 217.849 196" class="accent-a" style="fill:none" stroke-width="3"/><path d="M 72.09 196 A 88.969 88.969 0 1 0 217.849 196" class="accent-a" style="fill:none" stroke-width="3"/><line x1="72.09" y1="196" x2="217.849" y2="196" class="ink" stroke-width="2.4"/><line x1="76.815" y1="87.781" x2="72.09" y2="196" class="ink-thin"/><line x1="76.815" y1="87.781" x2="217.849" y2="196" class="ink-thin"/><path d="M 75.855 109.76 A 22 22 0 0 0 94.269 101.174" class="accent-d" style="fill:none" stroke-width="1.8"/><text x="92.452" y="125.814" text-anchor="middle" class="lbl-sm">55°</text><circle cx="76.815" cy="87.781" r="3" class="accent-b"/><text x="68.821" y="79.588" text-anchor="middle" class="lbl-sm">M</text><line x1="189.454" y1="67.92" x2="72.09" y2="196" class="ink-thin"/><line x1="189.454" y1="67.92" x2="217.849" y2="196" class="ink-thin"/><path d="M 174.591 84.14 A 22 22 0 0 0 194.216 89.398" class="accent-d" style="fill:none" stroke-width="1.8"/><text x="179.878" y="108.159" text-anchor="middle" class="lbl-sm">55°</text><circle cx="189.454" cy="67.92" r="3" class="accent-b"/><text x="194.375" y="58.25" text-anchor="middle" class="lbl-sm">M</text><circle cx="72.09" cy="196" r="3" class="accent-b"/><circle cx="217.849" cy="196" r="3" class="accent-b"/><text x="58.09" y="204.5" text-anchor="end" class="lbl">A</text><text x="231.849" y="204.5" text-anchor="middle" class="lbl">B</text></svg>