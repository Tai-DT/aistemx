<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 312" role="img" aria-label="Ba đường đồng quy trong tam giác"><title>Ba đường đồng quy trong tam giác</title><desc>Ba đường cao của tam giác ABC đồng quy tại trực tâm H.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="412" height="312"/><polygon points="151,56 56,256 356,256" class="fill-a"/><polyline points="151,56 56,256 356,256 151,56" class="ink" fill="none"/><line x1="151" y1="56" x2="151" y2="256" class="accent-b" stroke-dasharray="5 4" stroke-width="1.7"/><polyline points="151,247 160,247 160,256" class="ink-thin" fill="none"/><line x1="56" y1="256" x2="202.297" y2="106.046" class="accent-b" stroke-dasharray="5 4" stroke-width="1.7"/><polyline points="196.012,112.488 189.57,106.203 195.855,99.761" class="ink-thin" fill="none"/><line x1="356" y1="256" x2="111.227" y2="139.733" class="accent-b" stroke-dasharray="5 4" stroke-width="1.7"/><polyline points="119.356,143.594 115.495,151.724 107.365,147.862" class="ink-thin" fill="none"/><circle cx="151" cy="158.625" r="4" class="accent-d"/><text x="164" y="167.125" text-anchor="middle" class="lbl">H</text><text x="146.492" y="44.109" text-anchor="middle" class="lbl">A</text><text x="40.833" y="268.179" text-anchor="middle" class="lbl">B</text><text x="371.806" y="266.76" text-anchor="middle" class="lbl">C</text></svg>