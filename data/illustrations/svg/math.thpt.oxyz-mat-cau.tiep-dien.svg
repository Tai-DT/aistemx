<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247.852 225.852" role="img" aria-label="Hình cầu"><title>Hình cầu</title><desc>Hình cầu với bán kính, xích đạo và kinh tuyến</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="247.852" height="225.852"/><circle cx="119.926" cy="109.926" r="75.926" class="fill-a"/><circle cx="119.926" cy="109.926" r="75.926" class="ink"/><path d="M 44 109.926 A 75.926 25.968 0 0 1 195.852 109.926" class="ink-thin" stroke-dasharray="6 5"/><path d="M 44 109.926 A 75.926 25.968 0 0 0 195.852 109.926" class="ink-thin"/><path d="M 44 109.926 A 75.926 71.347 0 0 1 195.852 109.926" class="ink-thin"/><path d="M 44 109.926 A 75.926 71.347 0 0 0 195.852 109.926" class="ink-thin" stroke-dasharray="6 5"/><circle cx="119.926" cy="109.926" r="2.8" class="accent-b"/><line x1="119.926" y1="109.926" x2="179.756" y2="63.181" class="accent-b" stroke-width="1.6"/><text x="151.841" y="79.554" text-anchor="start" class="lbl">R</text><text x="113.926" y="124.926" text-anchor="end" class="lbl-sm">O</text></svg>