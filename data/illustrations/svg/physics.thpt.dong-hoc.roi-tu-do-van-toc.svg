<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 292" role="img" aria-label="Đồ thị v - t"><title>Đồ thị v - t</title><desc>Đồ thị vận tốc theo thời gian; độ dốc là gia tốc, diện tích dưới đồ thị là độ dịch chuyển.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="400" height="292"/><line x1="60" y1="26" x2="60" y2="248" class="grid"/><line x1="158.718" y1="26" x2="158.718" y2="248" class="grid"/><text x="158.718" y="233.618" text-anchor="middle" class="lbl-sm">1</text><line x1="257.436" y1="26" x2="257.436" y2="248" class="grid"/><text x="257.436" y="233.618" text-anchor="middle" class="lbl-sm">2</text><line x1="356.154" y1="26" x2="356.154" y2="248" class="grid"/><line x1="60" y1="218.618" x2="368" y2="218.618" class="grid"/><line x1="60" y1="150.603" x2="368" y2="150.603" class="grid"/><text x="53" y="154.603" text-anchor="end" class="lbl-sm">10</text><line x1="60" y1="82.588" x2="368" y2="82.588" class="grid"/><text x="53" y="86.588" text-anchor="end" class="lbl-sm">20</text><line x1="60" y1="218.618" x2="376" y2="218.618" class="axis" stroke-width="2.5"/><polygon points="376,218.618 369.938,222.118 369.938,215.118" class="axis" stroke="none" fill-opacity="1"/><line x1="60" y1="248" x2="60" y2="18" class="axis" stroke-width="2.5"/><polygon points="60,18 63.5,24.062 56.5,24.062" class="axis" stroke="none" fill-opacity="1"/><text x="374" y="235.618" text-anchor="end" class="lbl-sm">t (s)</text><text x="56" y="14" text-anchor="middle" class="lbl-sm">v (m/s)</text><polyline points="60,218.618 356.154,55.382" class="curve" fill="none"/><line x1="131.077" y1="179.441" x2="261.385" y2="179.441" class="accent-d" stroke-dasharray="5 4" stroke-width="1.5"/><line x1="261.385" y1="179.441" x2="261.385" y2="107.618" class="accent-d" stroke-dasharray="5 4" stroke-width="1.5"/><text x="196.231" y="194.441" text-anchor="middle" class="lbl-sm">Δt</text><text x="268.385" y="147.529" text-anchor="start" class="lbl-sm">Δv</text><text x="366" y="42" text-anchor="end" class="lbl-sm">g = Δv / Δt</text></svg>