<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" role="img" aria-label="Vectơ trong không gian Oxyz"><title>Vectơ trong không gian Oxyz</title><desc>Tích có hướng và ứng dụng hình học trong không gian Oxyz.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="460" height="320"/><polygon points="120,230 360,210 450,130 210,140" class="fill-a"/><line x1="160" y1="220" x2="320" y2="200" class="accent-a" stroke-width="2.5"/><polygon points="320,200 313.621,204.828 312.629,196.89" class="accent-a" stroke="none" fill-opacity="1"/><line x1="160" y1="220" x2="250" y2="150" class="accent-a" stroke-width="2.5"/><polygon points="250,150 246.987,157.411 242.075,151.096" class="accent-a" stroke="none" fill-opacity="1"/><line x1="160" y1="220" x2="160" y2="90" class="accent-b" stroke-width="2.5"/><polygon points="160,90 164,96.928 156,96.928" class="accent-b" stroke="none" fill-opacity="1"/><polyline points="160,208 171.907,206.512 171.907,218.512" class="ink-thin" fill="none"/><polyline points="160,208 169.472,200.633 169.472,212.633" class="ink-thin" fill="none"/><text x="330" y="205" text-anchor="start" class="lbl">u⃗</text><text x="258" y="146" text-anchor="start" class="lbl">v⃗</text><text x="170" y="100" text-anchor="start" class="lbl" font-weight="bold">n⃗ = [u⃗, v⃗]</text><text x="440" y="50" text-anchor="end" class="lbl-sm">n⃗ ⊥ u⃗  và  n⃗ ⊥ v⃗</text><text x="440" y="75" text-anchor="end" class="lbl-sm">|[u⃗, v⃗]| = |u⃗|·|v⃗|·sin(u⃗, v⃗)</text><text x="440" y="100" text-anchor="end" class="lbl-sm">Quy tắc bàn tay phải</text></svg>