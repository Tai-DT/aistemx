ss="accent-a"/><circle cx="234.923" cy="196.286" r="3" class="accent-a"/><circle cx="260.769" cy="199" r="3" class="accent-a"/><circle cx="286.615" cy="201.111" r="3" class="accent-a"/><circle cx="312.462" cy="202.8" r="3" class="accent-a"/><circle cx="338.308" cy="204.182" r="3" class="accent-a"/><circle cx="364.154" cy="205.333" r="3" class="accent-a"/><text x="412" y="17" text-anchor="end" class="lbl">lim 1/nᵏ = 0</text></svg>