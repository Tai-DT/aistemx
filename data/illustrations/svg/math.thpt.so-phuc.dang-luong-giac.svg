<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 545.84 525.84" role="img" aria-label="Nhân số phức là phép quay kết hợp vị tự"><title>Nhân số phức là phép quay kết hợp vị tự</title><desc>Nhân z với một số phức làm acgumen cộng thêm và môđun nhân lên.</desc><style>@media (prefers-color-scheme: dark){
