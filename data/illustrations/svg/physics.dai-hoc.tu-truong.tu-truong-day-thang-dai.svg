<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 330" role="img" aria-label="Từ trường của dòng điện thẳng dài"><title>Từ trường của dòng điện thẳng dài</title><desc>Các đường sức từ là những đường tròn đồng tâm quanh dây dẫn thẳng, nằm trong mặt phẳng vuông góc với dây.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="330" height="330"/><circle cx="165" cy="165" r="44" class="accent-a" style="fill:none;stroke-width:1.5"/><polygon points="193.283,131.294 200.669,132.596 195.848,138.342" class="accent-a" stroke="none" fill-opacity="1"/><circle cx="165" cy="165" r="76" class="accent-a" style="fill:none;stroke-width:1.5"/><polygon points="213.852,106.781 221.238,108.083 216.417,113.828" class="accent-a" stroke="none" fill-opacity="1"/><circle cx="165" cy="165" r="108" class="accent-a" style="fill:none;stroke-width:1.5"/><polygon points="234.421,82.267 241.807,83.57 236.986,89.315" class="accent-a" stroke="none" fill-opacity="1"/><circle cx="165" cy="165" r="140" class="accent-a" style="fill:none;stroke-width:1.5"/><polygon points="254.99,57.754 262.376,59.056 257.555,64.801" class="accent-a" stroke="none" fill-opacity="1"/><circle cx="165" cy="165" r="13" class="ink"/><circle cx="165" cy="165" r="4" class="accent-b"/><text x="145" y="170" text-anchor="end" class="lbl">I</text><line x1="165" y1="165" x2="256.589" y2="222.231" class="ink-thin" style="stroke-dasharray:5 4"/><text x="210.795" y="209.616" text-anchor="middle" class="lbl">r</text><circle cx="256.589" cy="222.231" r="3.4" class="accent-b"/><line x1="256.589" y1="222.231" x2="277.786" y2="188.309" class="accent-b" style="stroke-width:2.3"/><polygon points="277.786,188.309 277.507,196.304 270.722,192.065" class="accent-b" stroke="none" fill-opacity="1"/><text x="279.906" y="188.917" text-anchor="start" class="lbl">B</text><text x="165" y="318" text-anchor="middle" class="lbl-sm">dòng điện hướng ra khỏi mặt phẳng hình vẽ</text></svg>