<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 300" role="img" aria-label="Đường cong sinh trưởng của vi khuẩn trong nuôi cấy không liên tục"><title>Đường cong sinh trưởng của vi khuẩn trong nuôi cấy không liên tục</title><desc>Đồ thị log số tế bào theo thời gian gồm bốn pha nối tiếp: tiềm phát nằm ngang, luỹ thừa đi lên thẳng, cân bằng nằm ngang, suy vong đi xuống.</desc><style>@media (prefers-color-scheme: dark){
