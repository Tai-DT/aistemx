<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 362 362" role="img" aria-label="Tứ giác nội tiếp"><title>Tứ giác nội tiếp</title><desc>Tứ giác ABCD nội tiếp đường tròn: tổng hai góc đối bằng 180°.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="362" height="362"/><circle cx="181" cy="181" r="125" class="ink"/><polygon points="138.247,63.538 60.259,213.352 213.352,301.741 298.462,138.247" class="fill-a"/><polyline points="138.247,63.538 60.259,213.352 213.352,301.741 298.462,138.247 138.247,63.538" class="ink" fill="none"/><line x1="138.247" y1="63.538" x2="213.352" y2="301.741" class="accent-b" stroke-dasharray="5 4" stroke-width="1.8"/><line x1="60.259" y1="213.352" x2="298.462" y2="138.247" class="accent-c" stroke-dasharray="5 4" stroke-width="1.8"/><path d="M 127.166 84.827 A 24 24 0 0 0 159.999 73.681" class="accent-d" style="fill:none" stroke-width="1.8"/><text x="150.784" y="104.969" text-anchor="middle" class="lbl-sm">Â</text><path d="M 224.434 280.452 A 24 24 0 0 0 192.568 289.741" class="accent-c" style="fill:none" stroke-width="1.8"/><text x="202.439" y="268.799" text-anchor="middle" class="lbl-sm">Ĉ</text><circle cx="181" cy="181" r="2.8" class="accent-b"/><text x="132.775" y="53.003" text-anchor="middle" class="lbl">A</text><text x="44.804" y="221.993" text-anchor="middle" class="lbl">B</text><text x="217.493" y="321.696" text-anchor="middle" class="lbl">C</text><text x="313.497" y="137.275" text-anchor="middle" class="lbl">D</text></svg>