<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 412" role="img" aria-label="Ba đường đồng quy trong tam giác"><title>Ba đường đồng quy trong tam giác</title><desc>Ba đường trung trực đồng quy tại tâm O của đường tròn ngoại tiếp; OA = OB = OC = R.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
