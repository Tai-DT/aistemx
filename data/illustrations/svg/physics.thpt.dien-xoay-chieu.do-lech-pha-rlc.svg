<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Giản đồ vectơ Fre-nen của mạch RLC"><title>Giản đồ vectơ Fre-nen của mạch RLC</title><desc>Giản đồ vectơ: U_R theo trục dòng điện, U_L vượt pha 90 độ, U_C trễ pha 90 độ, vectơ tổng U.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="400" height="320"/><line x1="46" y1="144" x2="366" y2="144" class="axis"/><line x1="206" y1="26" x2="206" y2="262" class="axis"/><text x="362" y="162" text-anchor="end" class="lbl">i</text><line x1="206" y1="144" x2="206" y2="33.655" class="accent-c" stroke-width="2.5"/><polygon points="206,33.655 210,40.583 202,40.583" class="accent-c" stroke="none" fill-opacity="1"/><text x="198" y="27.655" text-anchor="end" class="lbl">U_L</text><line x1="206" y1="144" x2="206" y2="185.379" class="accent-d" stroke-width="2.5"/><polygon points="206,185.379 202,178.451 210,178.451" class="accent-d" stroke="none" fill-opacity="1"/><text x="198" y="199.379" text-anchor="end" class="lbl">U_C</text><line x1="206" y1="144" x2="288.759" y2="144" class="accent-a" stroke-width="2.5"/><polygon points="288.759,144 280.964,148.5 280.964,139.5" class="accent-a" stroke="none" fill-opacity="1"/><text x="247.379" y="162" text-anchor="middle" class="lbl">U_R</text><line x1="288.759" y1="144" x2="288.759" y2="75.034" class="accent-c" stroke-width="2.5"/><polygon points="288.759,75.034 292.759,81.963 284.759,81.963" class="accent-c" stroke="none" fill-opacity="1"/><text x="296.759" y="109.517" text-anchor="start" class="lbl-sm">U_L − U_C</text><line x1="206" y1="33.655" x2="288.759" y2="75.034" class="ink-thin" style="stroke-dasharray:5 4"/><line x1="206" y1="144" x2="288.759" y2="75.034" class="accent-b" stroke-width="2.5"/><polygon points="288.759,75.034 285.307,84.42 278.905,76.738" class="accent-b" stroke="none" fill-opacity="1"/><text x="298.759" y="69.034" text-anchor="start" class="lbl">U</text><polyline points="277.759,144 277.759,133 288.759,133" class="ink-thin" fill="none"/><path d="M 248 144 A 42 42 0 0 0 238.265 117.112" class="accent-b" style="fill:none;stroke-width:1.8"/><text x="254.894" y="130.298" text-anchor="start" class="lbl">φ</text><text x="46" y="296" text-anchor="start" class="lbl-sm">φ = 39.8° — mạch có tính cảm kháng</text></svg>