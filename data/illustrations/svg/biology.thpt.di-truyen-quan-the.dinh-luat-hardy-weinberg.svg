<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393.2 322" role="img" aria-label="Khung Punnett"><title>Khung Punnett</title><desc>Khung Punnett 2×2: hàng là giao tử p (A), q (a), cột là giao tử p (A), q (a); mỗi ô là kiểu gen của hợp tử tương ứng.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="393.2" height="322"/><text x="129.2" y="30" text-anchor="start" class="lbl-sm"></text><text x="269.2" y="48" text-anchor="middle" class="lbl-sm">giao tử ♂ (tần số)</text><text x="119.2" y="196" text-anchor="end" class="lbl-sm">giao tử ♀ (tần số)</text><text x="221.2" y="86" text-anchor="middle" class="lbl">p (A)</text><text x="317.2" y="86" text-anchor="middle" class="lbl">q (a)</text><text x="151.2" y="153" text-anchor="middle" class="lbl">p (A)</text><text x="151.2" y="249" text-anchor="middle" class="lbl">q (a)</text><line x1="173.2" y1="100" x2="365.2" y2="100" class="ink"/><line x1="173.2" y1="196" x2="365.2" y2="196" class="ink"/><line x1="173.2" y1="292" x2="365.2" y2="292" class="ink"/><line x1="173.2" y1="100" x2="173.2" y2="292" class="ink"/><line x1="269.2" y1="100" x2="269.2" y2="292" class="ink"/><line x1="365.2" y1="100" x2="365.2" y2="292" class="ink"/><text x="221.2" y="153" text-anchor="middle" class="lbl">p² AA</text><text x="317.2" y="153" text-anchor="middle" class="lbl">pq Aa</text><text x="221.2" y="249" text-anchor="middle" class="lbl">pq Aa</text><text x="317.2" y="249" text-anchor="middle" class="lbl">q² aa</text><text x="129.2" y="316" text-anchor="start" class="lbl">p² + 2pq + q² = 1</text></svg>