<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 292.4 229.8" role="img" aria-label="Hiệu hai vectơ chung gốc"><title>Hiệu hai vectơ chung gốc</title><desc>Hai vectơ OA và OB chung gốc O; hiệu của chúng là vectơ AB nối ngọn A tới ngọn B.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="292.4" height="229.8"/><polygon points="56,161.8 111.2,56 212.4,120.4" class="fill-a"/><line x1="56" y1="161.8" x2="111.2" y2="56" class="accent-a" stroke-width="2.5"/><polygon points="111.2,56 111.584,64.992 103.605,60.829" class="accent-a" stroke="none" fill-opacity="1"/><line x1="56" y1="161.8" x2="212.4" y2="120.4" class="accent-c" stroke-width="2.5"/><polygon points="212.4,120.4 206.017,126.745 203.714,118.044" class="accent-c" stroke="none" fill-opacity="1"/><line x1="111.2" y1="56" x2="212.4" y2="120.4" class="accent-b" stroke-width="2.5"/><polygon points="212.4,120.4 202.409,119.969 207.778,111.532" class="accent-b" stroke="none" fill-opacity="1"/><circle cx="56" cy="161.8" r="3" class="ink"/><text x="48" y="178.8" text-anchor="end" class="lbl">O</text><text x="103.2" y="50" text-anchor="end" class="lbl">A</text><text x="220.4" y="114.4" text-anchor="start" class="lbl">B</text><text x="161.8" y="79.2" text-anchor="middle" class="lbl">AB</text><text x="146.2" y="211.8" text-anchor="middle" class="lbl-sm">OB − OA = AB</text></svg>