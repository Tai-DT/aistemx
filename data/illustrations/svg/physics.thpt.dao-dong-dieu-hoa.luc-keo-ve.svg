<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 254" role="img" aria-label="Con lắc lò xo nằm ngang"><title>Con lắc lò xo nằm ngang</title><desc>Con lắc lò xo dao động trên mặt ngang; O là vị trí cân bằng, lực kéo về luôn hướng về O.</desc><style>@media (prefers-color-scheme: dark){
