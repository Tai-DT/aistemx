<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 434.8 328.674" role="img" aria-label="Tích vô hướng của hai vectơ"><title>Tích vô hướng của hai vectơ</title><desc>Hai vectơ chung gốc hợp với nhau góc phi; hình chiếu của vectơ b lên phương của a có độ dài bằng b nhân cos phi.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="434.8" height="328.674"/><polyline points="141.6,219.074 141.576,217.788 141.503,216.505 141.381,215.225 141.212,213.95 140.994,212.683 140.729,211.425 140.416,210.178 140.056,208.944 139.65,207.724 139.198,206.521 138.701,205.335 138.159,204.169 137.574,203.024 136.945,201.903 136.275,200.805 135.564,199.734 134.813,198.691 134.023,197.677 133.195,196.693 132.331,195.741 131.431,194.823 130.497,193.939 129.53,193.092 128.532,192.281" class="accent-d" fill="none" style="fill:none" stroke-width="2"/><text x="152.54" y="202.155" text-anchor="middle" class="lbl">φ</text><line x1="196.255" y1="105.6" x2="196.255" y2="219.074" class="ink-thin" stroke-dasharray="4 3"/><polyline points="186.255,219.074 186.255,209.074 196.255,209.074" class="ink-thin" fill="none"/><text x="151.928" y="240.074" text-anchor="middle" class="lbl-sm">|b|·cos φ</text><line x1="107.6" y1="219.074" x2="309.2" y2="219.074" class="accent-a" stroke-width="2.5"/><polygon points="309.2,219.074 301.406,223.574 301.406,214.574" class="accent-a" stroke="none" fill-opacity="1"/><line x1="107.6" y1="219.074" x2="196.255" y2="105.6" class="accent-c" stroke-width="2.5"/><polygon points="196.255,105.6 195.003,114.512 187.911,108.971" class="accent-c" stroke="none" fill-opacity="1"/><line x1="107.6" y1="219.074" x2="196.255" y2="219.074" class="accent-d" style="fill:none" stroke-width="4.2"/><text x="317.2" y="213.074" text-anchor="start" class="lbl">a</text><text x="204.255" y="99.6" text-anchor="start" class="lbl">b</text><circle cx="107.6" cy="219.074" r="3" class="ink"/><text x="217.4" y="310.674" text-anchor="middle" class="lbl-sm">a·b = |a|·|b|·cos φ</text></svg>