<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 362.288 338.288" role="img" aria-label="Toạ độ cực và toạ độ Descartes"><title>Toạ độ cực và toạ độ Descartes</title><desc>Điểm M có toạ độ cực r và theta; hình chiếu lên hai trục cho x = r cos theta và y = r sin theta.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="362.288" height="338.288"/><line x1="30.2" y1="260.288" x2="295.232" y2="260.288" class="axis" stroke-width="2.5"/><polygon points="295.232,260.288 289.17,263.788 289.17,256.788" class="axis" stroke="none" fill-opacity="1"/><line x1="68" y1="287.288" x2="68" y2="33.056" class="axis" stroke-width="2.5"/><polygon points="68,33.056 71.5,39.118 64.5,39.118" class="axis" stroke="none" fill-opacity="1"/><text x="293.232" y="251.288" text-anchor="end" class="lbl">x</text><text x="77" y="44.056" text-anchor="start" class="lbl">y</text><text x="60" y="275.288" text-anchor="end" class="lbl">O</text><line x1="204.441" y1="137.436" x2="204.441" y2="260.288" class="ink-thin" stroke-dasharray="4 3"/><line x1="204.441" y1="137.436" x2="68" y2="137.436" class="ink-thin" stroke-dasharray="4 3"/><polyline points="120,260.288 119.982,258.927 119.929,257.567 119.84,256.208 119.715,254.853 119.555,253.501 119.36,252.153 119.129,250.812 118.864,249.477 118.563,248.149 118.228,246.829 117.859,245.519 117.455,244.219 117.017,242.93 116.546,241.653 116.042,240.388 115.504,239.138 114.934,237.901 114.332,236.68 113.698,235.476 113.033,234.288 112.337,233.118 111.611,231.967 110.855,230.835 110.069,229.723 109.254,228.632 108.412,227.563 107.541,226.517 106.644,225.493" class="accent-d" fill="none" style="fill:none" stroke-width="2"/><text x="131.483" y="235.919" text-anchor="middle" class="lbl">θ</text><line x1="68" y1="260.288" x2="204.441" y2="137.436" class="accent-a" stroke-width="2.5"/><polygon points="204.441,137.436 201.66,145.995 195.638,139.307" class="accent-a" stroke="none" fill-opacity="1"/><circle cx="204.441" cy="137.436" r="3.8" class="accent-a"/><text x="213.441" y="129.436" text-anchor="start" class="lbl">M(r; θ)</text><text x="126.221" y="190.862" text-anchor="end" class="lbl">r</text><text x="204.441" y="278.288" text-anchor="middle" class="lbl">x</text><text x="59" y="141.436" text-anchor="end" class="lbl">y</text><text x="181.144" y="320.288" text-anchor="middle" class="lbl-sm">x = r·cos θ, y = r·sin θ, r² = x² + y², tan θ = y/x</text></svg>