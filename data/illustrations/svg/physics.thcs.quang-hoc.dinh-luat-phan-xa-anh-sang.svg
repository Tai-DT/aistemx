<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" role="img" aria-label="Định luật phản xạ ánh sáng"><title>Định luật phản xạ ánh sáng</title><desc>Tia tới, pháp tuyến và tia phản xạ; góc phản xạ bằng góc tới.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="420" height="280"/><line x1="60" y1="196" x2="360" y2="196" class="ink" style="stroke-width:3"/><line x1="60" y1="196" x2="50" y2="206" class="ink-thin"/><line x1="85" y1="196" x2="75" y2="206" class="ink-thin"/><line x1="110" y1="196" x2="100" y2="206" class="ink-thin"/><line x1="135" y1="196" x2="125" y2="206" class="ink-thin"/><line x1="160" y1="196" x2="150" y2="206" class="ink-thin"/><line x1="185" y1="196" x2="175" y2="206" class="ink-thin"/><line x1="210" y1="196" x2="200" y2="206" class="ink-thin"/><line x1="235" y1="196" x2="225" y2="206" class="ink-thin"/><line x1="260" y1="196" x2="250" y2="206" class="ink-thin"/><line x1="285" y1="196" x2="275" y2="206" class="ink-thin"/><line x1="310" y1="196" x2="300" y2="206" class="ink-thin"/><line x1="335" y1="196" x2="325" y2="206" class="ink-thin"/><line x1="360" y1="196" x2="350" y2="206" class="ink-thin"/><line x1="210" y1="196" x2="210" y2="46" class="ink-thin" style="stroke-dasharray:6 4"/><text x="216" y="44" text-anchor="start" class="lbl">N</text><line x1="121.295" y1="90.286" x2="210" y2="196" class="accent-a" style="stroke-width:2.2"/><polygon points="176.292,155.829 167.835,152.75 174.729,146.965" class="accent-a" stroke="none" fill-opacity="1"/><line x1="210" y1="196" x2="298.705" y2="90.286" class="accent-b" style="stroke-width:2.2"/><polygon points="273.867,119.886 272.305,128.749 265.41,122.964" class="accent-b" stroke="none" fill-opacity="1"/><text x="115.295" y="84.286" text-anchor="end" class="lbl">S</text><text x="304.705" y="84.286" text-anchor="start" class="lbl">R</text><circle cx="210" cy="196" r="3.4" class="accent-c"/><text x="202" y="214" text-anchor="end" class="lbl">I</text><path d="M 210 144 A 52 52 0 0 0 176.575 156.166" class="accent-a" style="fill:none;stroke-width:1.8"/><path d="M 243.425 156.166 A 52 52 0 0 0 210 144" class="accent-b" style="fill:none;stroke-width:1.8"/><text x="188.795" y="141.739" text-anchor="middle" class="lbl">i</text><text x="231.205" y="141.739" text-anchor="middle" class="lbl">i′</text><text x="210" y="266" text-anchor="middle" class="lbl-sm">i′ = i = 40°  (đo từ pháp tuyến)</text></svg>