<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 325.333" role="img" aria-label="Góc tạo bởi tiếp tuyến và dây cung"><title>Góc tạo bởi tiếp tuyến và dây cung</title><desc>Tiếp tuyến Ax tại A và dây AB; góc xAB bằng nửa số đo cung AB nằm bên trong góc đó.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="432" height="325.333"/><circle cx="216" cy="162.667" r="106.667" class="ink"/><path d="M 216 269.333 A 106.667 106.667 0 0 0 316.234 199.149" class="accent-a" style="fill:none" stroke-width="3.4"/><line x1="93.333" y1="269.333" x2="349.333" y2="269.333" class="accent-c" stroke-width="2.2"/><line x1="216" y1="269.333" x2="316.234" y2="199.149" class="ink" stroke-width="2.2"/><line x1="216" y1="162.667" x2="216" y2="269.333" class="ink-thin"/><line x1="216" y1="162.667" x2="316.234" y2="199.149" class="ink-thin"/><path d="M 242 269.333 A 26 26 0 0 0 237.298 254.42" class="accent-d" style="fill:none" stroke-width="1.8"/><text x="255.102" y="261.504" text-anchor="middle" class="lbl-sm">α</text><path d="M 216 205.333 A 42.667 42.667 0 0 0 256.094 177.26" class="accent-d" style="fill:none" stroke-width="1.8"/><text x="248.503" y="213.585" text-anchor="middle" class="lbl-sm">2α</text><circle cx="216" cy="269.333" r="3" class="accent-b"/><circle cx="316.234" cy="199.149" r="3" class="accent-b"/><circle cx="216" cy="162.667" r="2.8" class="accent-b"/><text x="206" y="289.833" text-anchor="middle" class="lbl">A</text><text x="330.329" y="208.779" text-anchor="middle" class="lbl">B</text><text x="361.333" y="273.833" text-anchor="middle" class="lbl">x</text><text x="204" y="163.167" text-anchor="end" class="lbl-sm">O</text></svg>