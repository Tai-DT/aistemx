<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 372" role="img" aria-label="Hai góc nội tiếp cùng chắn một cung"><title>Hai góc nội tiếp cùng chắn một cung</title><desc>Góc BAC và góc BDC cùng chắn cung BC nên bằng nhau.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="372" height="372"/><circle cx="186" cy="186" r="130" class="ink"/><path d="M 73.417 251 A 130 130 0 0 0 298.583 251" class="accent-a" style="fill:none" stroke-width="3.4"/><line x1="230.463" y1="63.84" x2="298.583" y2="251" class="ink"/><line x1="230.463" y1="63.84" x2="73.417" y2="251" class="ink"/><line x1="102.438" y1="86.414" x2="298.583" y2="251" class="ink"/><line x1="102.438" y1="86.414" x2="73.417" y2="251" class="ink"/><line x1="298.583" y1="251" x2="73.417" y2="251" class="ink-thin" stroke-dasharray="5 4" stroke-width="1.4"/><path d="M 213.75 83.757 A 26 26 0 0 0 239.355 88.272" class="accent-d" style="fill:none" stroke-width="1.8"/><text x="223.343" y="108.717" text-anchor="middle" class="lbl-sm">α</text><path d="M 97.923 112.019 A 26 26 0 0 0 122.355 103.127" class="accent-c" style="fill:none" stroke-width="1.8"/><text x="116.46" y="129.442" text-anchor="middle" class="lbl-sm">α</text><text x="235.593" y="54.245" text-anchor="middle" class="lbl">A</text><text x="92.796" y="79.424" text-anchor="middle" class="lbl">D</text><text x="311.574" y="263" text-anchor="middle" class="lbl">B</text><text x="60.426" y="263" text-anchor="middle" class="lbl">C</text><circle cx="186" cy="186" r="2.8" class="accent-b"/></svg>