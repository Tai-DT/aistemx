<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" role="img" aria-label="Trục số"><title>Trục số</title><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="420" height="90"/><line x1="24" y1="52" x2="396" y2="52" class="axis" stroke-width="2.5"/><polygon points="396,52 389.938,55.5 389.938,48.5" class="axis" stroke="none" fill-opacity="1"/><line x1="32" y1="47" x2="32" y2="57" class="ink-thin"/><text x="32" y="74" text-anchor="middle" class="lbl-sm">-4</text><line x1="76.5" y1="47" x2="76.5" y2="57" class="ink-thin"/><text x="76.5" y="74" text-anchor="middle" class="lbl-sm">-3</text><line x1="121" y1="47" x2="121" y2="57" class="ink-thin"/><text x="121" y="74" text-anchor="middle" class="lbl-sm">-2</text><line x1="165.5" y1="47" x2="165.5" y2="57" class="ink-thin"/><text x="165.5" y="74" text-anchor="middle" class="lbl-sm">-1</text><line x1="210" y1="47" x2="210" y2="57" class="ink-thin"/><text x="210" y="74" text-anchor="middle" class="lbl-sm">0</text><line x1="254.5" y1="47" x2="254.5" y2="57" class="ink-thin"/><text x="254.5" y="74" text-anchor="middle" class="lbl-sm">1</text><line x1="299" y1="47" x2="299" y2="57" class="ink-thin"/><text x="299" y="74" text-anchor="middle" class="lbl-sm">2</text><line x1="343.5" y1="47" x2="343.5" y2="57" class="ink-thin"/><text x="343.5" y="74" text-anchor="middle" class="lbl-sm">3</text><line x1="388" y1="47" x2="388" y2="57" class="ink-thin"/><text x="388" y="74" text-anchor="middle" class="lbl-sm">4</text><circle cx="76.5" cy="52" r="5" class="accent-b"/><text x="76.5" y="38" text-anchor="middle" class="lbl">−a</text><circle cx="210" cy="52" r="5" class="accent-b"/><text x="210" y="38" text-anchor="middle" class="lbl">0</text><circle cx="343.5" cy="52" r="5" class="accent-b"/><text x="343.5" y="38" text-anchor="middle" class="lbl">a</text></svg>