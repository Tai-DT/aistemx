<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 367.6 378" role="img" aria-label="Khung Punnett"><title>Khung Punnett</title><desc>Khung Punnett 2×2: hàng là giao tử A, a, cột là giao tử a, a; mỗi ô là kiểu gen của hợp tử tương ứng.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="367.6" height="378"/><text x="103.6" y="30" text-anchor="start" class="lbl-sm"></text><text x="243.6" y="48" text-anchor="middle" class="lbl-sm">giao tử ♂ (aa)</text><text x="93.6" y="196" text-anchor="end" class="lbl-sm">giao tử ♀ (Aa)</text><text x="195.6" y="86" text-anchor="middle" class="lbl">a</text><text x="291.6" y="86" text-anchor="middle" class="lbl">a</text><text x="125.6" y="153" text-anchor="middle" class="lbl">A</text><text x="125.6" y="249" text-anchor="middle" class="lbl">a</text><rect x="147.6" y="100" width="96" height="96" class="fill-a"/><rect x="243.6" y="100" width="96" height="96" class="fill-a"/><rect x="147.6" y="196" width="96" height="96" class="fill-b"/><rect x="243.6" y="196" width="96" height="96" class="fill-b"/><line x1="147.6" y1="100" x2="339.6" y2="100" class="ink"/><line x1="147.6" y1="196" x2="339.6" y2="196" class="ink"/><line x1="147.6" y1="292" x2="339.6" y2="292" class="ink"/><line x1="147.6" y1="100" x2="147.6" y2="292" class="ink"/><line x1="243.6" y1="100" x2="243.6" y2="292" class="ink"/><line x1="339.6" y1="100" x2="339.6" y2="292" class="ink"/><text x="195.6" y="153" text-anchor="middle" class="lbl">Aa</text><text x="291.6" y="153" text-anchor="middle" class="lbl">Aa</text><text x="195.6" y="249" text-anchor="middle" class="lbl">aa</text><text x="291.6" y="249" text-anchor="middle" class="lbl">aa</text><text x="103.6" y="316" text-anchor="start" class="lbl">1 Aa : 1 aa  →  1 trội : 1 lặn</text><rect x="103.6" y="326" width="14" height="12" class="fill-a"/><rect x="103.6" y="326" width="14" height="12" class="ink-thin"/><text x="125.6" y="336" text-anchor="start" class="lbl-sm">1 trội (Aa)</text><rect x="103.6" y="348" width="14" height="12" class="fill-b"/><rect x="103.6" y="348" width="14" height="12" class="ink-thin"/><text x="125.6" y="358" text-anchor="start" class="lbl-sm">1 lặn (aa)</text></svg>