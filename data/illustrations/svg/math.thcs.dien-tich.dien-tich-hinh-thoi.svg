<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 298.667" role="img" aria-label="Hình thoi"><title>Hình thoi</title><desc>Hình thoi có hai đường chéo d₁ = 6 và d₂ = 4 vuông góc với nhau tại trung điểm mỗi đường.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="392" height="298.667"/><polygon points="56,149.333 196,56 336,149.333 196,242.667" class="fill-a"/><polyline points="56,149.333 196,56 336,149.333 196,242.667 56,149.333" class="ink" fill="none"/><line x1="56" y1="149.333" x2="336" y2="149.333" class="accent-b" stroke-dasharray="5 4" stroke-width="1.8"/><line x1="196" y1="242.667" x2="196" y2="56" class="accent-c" stroke-dasharray="5 4" stroke-width="1.8"/><polyline points="207,149.333 207,138.333 196,138.333" class="ink-thin" fill="none"/><text x="126" y="141.833" text-anchor="middle" class="lbl">d₁ = 6</text><text x="184" y="200.5" text-anchor="end" class="lbl">d₂ = 4</text><line x1="122.672" y1="97.674" x2="129.328" y2="107.659" class="ink-thin"/><line x1="269.328" y1="97.674" x2="262.672" y2="107.659" class="ink-thin"/><line x1="269.328" y1="200.992" x2="262.672" y2="191.008" class="ink-thin"/><line x1="122.672" y1="200.992" x2="129.328" y2="191.008" class="ink-thin"/><line x1="196" y1="56" x2="282.154" y2="185.231" class="accent-d" stroke-dasharray="5 4" stroke-width="1.6"/><polyline points="276.607,176.91 284.927,171.363 290.474,179.684" class="ink-thin" fill="none"/><text x="244.069" y="110.971" text-anchor="middle" class="lbl">h</text><text x="279.313" y="98.291" text-anchor="middle" class="lbl">a</text></svg>