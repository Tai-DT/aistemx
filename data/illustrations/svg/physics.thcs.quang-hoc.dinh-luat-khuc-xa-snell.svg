<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" role="img" aria-label="Khúc xạ ánh sáng qua mặt phân cách"><title>Khúc xạ ánh sáng qua mặt phân cách</title><desc>Tia tới, pháp tuyến, tia phản xạ và tia khúc xạ tại mặt phân cách giữa hai môi trường trong suốt.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="440" height="330"/><rect x="40" y="150" width="360" height="130" class="fill-a"/><line x1="40" y1="150" x2="400" y2="150" class="ink" style="stroke-width:2.5"/><line x1="220" y1="32" x2="220" y2="268" class="ink-thin" style="stroke-dasharray:6 4"/><text x="226" y="30" text-anchor="start" class="lbl">N</text><text x="48" y="138" text-anchor="start" class="lbl-sm">n₁ = 1</text><text x="48" y="172" text-anchor="start" class="lbl-sm">n₂ = 1.5</text><line x1="136.561" y1="66.561" x2="220" y2="150" class="accent-a" style="stroke-width:2.2"/><polygon points="188.293,118.293 179.6,115.964 185.964,109.6" class="accent-a" stroke="none" fill-opacity="1"/><text x="130.561" y="62.561" text-anchor="end" class="lbl">S</text><circle cx="220" cy="150" r="3.4" class="accent-c"/><path d="M 220 104 A 46 46 0 0 0 187.473 117.473" class="accent-a" style="fill:none;stroke-width:1.8"/><text x="198.57" y="102.263" text-anchor="middle" class="lbl">i</text><line x1="220" y1="150" x2="275.626" y2="254.066" class="accent-b" style="stroke-width:2.2"/><polygon points="261.163,227.009 253.52,222.256 261.457,218.014" class="accent-b" stroke="none" fill-opacity="1"/><text x="281.626" y="264.066" text-anchor="start" class="lbl">R</text><path d="M 220 196 A 46 46 0 0 0 241.685 190.568" class="accent-b" style="fill:none;stroke-width:1.8"/><text x="233.607" y="208.322" text-anchor="middle" class="lbl">r</text><line x1="220" y1="150" x2="280.076" y2="89.924" class="accent-d" style="stroke-width:1.4;stroke-dasharray:5 4"/><polygon points="271.064,98.936 269.253,105.697 264.303,100.747" class="accent-d" stroke="none" fill-opacity="1"/><text x="220" y="316" text-anchor="middle" class="lbl-sm">n₁·sin i = n₂·sin r → r = 28.1°   (đi vào môi trường chiết quang hơn: r &lt; i)</text></svg>