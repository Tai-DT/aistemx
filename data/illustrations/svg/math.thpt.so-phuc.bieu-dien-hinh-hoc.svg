<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 417.2 346.8" role="img" aria-label="Điểm biểu diễn số phức"><title>Điểm biểu diễn số phức</title><desc>Số phức z = a + bi ứng với điểm M(a; b) trên mặt phẳng toạ độ; môđun là độ dài OM, acgumen là góc giữa tia OM và trục thực.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="417.2" height="346.8"/><line x1="66" y1="230.2" x2="321.2" y2="230.2" class="axis" stroke-width="2.5"/><polygon points="321.2,230.2 315.138,233.7 315.138,226.7" class="axis" stroke="none" fill-opacity="1"/><line x1="106.6" y1="270.8" x2="106.6" y2="62" class="axis" stroke-width="2.5"/><polygon points="106.6,62 110.1,68.062 103.1,68.062" class="axis" stroke="none" fill-opacity="1"/><text x="319.2" y="221.2" text-anchor="end" class="lbl">Re</text><text x="115.6" y="73" text-anchor="start" class="lbl">Im</text><text x="98.6" y="245.2" text-anchor="end" class="lbl">O</text><line x1="280.6" y1="102.6" x2="280.6" y2="230.2" class="ink-thin" stroke-dasharray="4 3"/><line x1="280.6" y1="102.6" x2="106.6" y2="102.6" class="ink-thin" stroke-dasharray="4 3"/><line x1="106.6" y1="230.2" x2="280.6" y2="102.6" class="accent-a" stroke-width="2.5"/><polygon points="280.6,102.6 276.976,110.838 271.654,103.58" class="accent-a" stroke="none" fill-opacity="1"/><circle cx="280.6" cy="102.6" r="3.8" class="accent-a"/><polyline points="136.6,230.2 136.59,229.409 136.558,228.619 136.506,227.83 136.433,227.042 136.34,226.257 136.225,225.474 136.091,224.695 135.935,223.919 135.759,223.148 135.563,222.382 135.347,221.621 135.111,220.866 134.855,220.118 134.58,219.377 134.284,218.643 133.97,217.917 133.637,217.2 133.285,216.492 132.914,215.793 132.525,215.104 132.118,214.426 131.694,213.759 131.251,213.103 130.792,212.459" class="accent-d" fill="none" style="fill:none" stroke-width="2"/><text x="149.367" y="221.199" text-anchor="middle" class="lbl">φ</text><text x="289.6" y="94.6" text-anchor="start" class="lbl">M(a; b)</text><text x="184.138" y="157.498" text-anchor="middle" class="lbl-sm">r = |z|</text><text x="280.6" y="247.2" text-anchor="middle" class="lbl">a</text><text x="97.6" y="106.6" text-anchor="end" class="lbl">b</text><text x="208.6" y="328.8" text-anchor="middle" class="lbl-sm">z = a + bi, r = √(a² + b²) = 3.72, φ ≈ 36.25°</text></svg>