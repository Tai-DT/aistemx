<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-label="Phân phối nhị thức"><title>Phân phối nhị thức</title><desc>Biểu đồ cột xác suất của phân phối nhị thức.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="480" height="330"/><line x1="64" y1="266" x2="64" y2="64" class="axis"/><line x1="59" y1="260" x2="64" y2="260" class="axis"/><text x="55" y="264" text-anchor="end" class="lbl-sm">0</text><line x1="64" y1="208.333" x2="444" y2="208.333" class="grid"/><line x1="59" y1="208.333" x2="64" y2="208.333" class="axis"/><text x="55" y="212.333" text-anchor="end" class="lbl-sm">0,2</text><line x1="64" y1="156.667" x2="444" y2="156.667" class="grid"/><line x1="59" y1="156.667" x2="64" y2="156.667" class="axis"/><text x="55" y="160.667" text-anchor="end" class="lbl-sm">0,4</text><line x1="64" y1="105" x2="444" y2="105" class="grid"/><line x1="59" y1="105" x2="64" y2="105" class="axis"/><text x="55" y="109" text-anchor="end" class="lbl-sm">0,6</text><text x="28" y="58" text-anchor="start" class="lbl-sm">P(X = k)</text><rect x="117.833" y="105" width="114" height="155" class="fill-a"/><rect x="117.833" y="105" width="114" height="155" class="ink-thin"/><rect x="276.167" y="156.667" width="114" height="103.333" class="fill-a"/><rect x="276.167" y="156.667" width="114" height="103.333" class="ink-thin"/><line x1="58" y1="260" x2="454" y2="260" class="axis"/><line x1="174.833" y1="260" x2="174.833" y2="265" class="axis"/><text x="174.833" y="279" text-anchor="middle" class="lbl-sm">0</text><line x1="333.167" y1="260" x2="333.167" y2="265" class="axis"/><text x="333.167" y="279" text-anchor="middle" class="lbl-sm">1</text><text x="454" y="296" text-anchor="end" class="lbl">k</text><text x="20" y="28" text-anchor="start" class="lbl-sm">X ~ B(n = 1; p = 0,4)</text><text x="460" y="28" text-anchor="end" class="lbl-sm">μ = 0,4;  σ = 0,49</text></svg>