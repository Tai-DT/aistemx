<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 541.3 418.929" role="img" aria-label="Đường tròn Apollonius |z − a| = k|z − b|"><title>Đường tròn Apollonius |z − a| = k|z − b|</title><desc>Tập hợp các điểm có tỉ số khoảng cách tới hai điểm cố định không đổi là một đường tròn.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="541.3" height="418.929"/><line x1="150.771" y1="200.464" x2="491.5" y2="200.464" class="axis" stroke-width="2.5"/><polygon points="491.5,200.464 485.438,203.964 485.438,196.964" class="axis" stroke="none" fill-opacity="1"/><line x1="148.8" y1="368.529" x2="148.8" y2="27.8" class="axis" stroke-width="2.5"/><polygon points="148.8,27.8 152.3,33.862 145.3,33.862" class="axis" stroke="none" fill-opacity="1"/><text x="489.5" y="191.464" text-anchor="end" class="lbl">Re</text><text x="157.8" y="38.8" text-anchor="start" class="lbl">Im</text><text x="140.8" y="215.464" text-anchor="end" class="lbl">O</text><circle cx="318.836" cy="200.464" r="140.464" class="accent-a" style="fill:none" stroke-width="2.4"/><circle cx="66" cy="200.464" r="3.4" class="accent-b"/><text x="66" y="219.464" text-anchor="middle" class="lbl">A</text><circle cx="240.8" cy="200.464" r="3.4" class="accent-b"/><text x="240.8" y="219.464" text-anchor="middle" class="lbl">B</text><line x1="388.727" y1="78.622" x2="66" y2="200.464" class="accent-c" style="fill:none" stroke-width="1.8" stroke-dasharray="5 4"/><line x1="388.727" y1="78.622" x2="240.8" y2="200.464" class="accent-c" style="fill:none" stroke-width="1.8" stroke-dasharray="5 4"/><circle cx="388.727" cy="78.622" r="3.4" class="accent-c"/><text x="396.727" y="71.622" text-anchor="start" class="lbl">M</text><text x="270.65" y="400.929" text-anchor="middle" class="lbl-sm">MA = k·MB (k = 1.8) ⇔ M chạy trên một đường tròn</text></svg>