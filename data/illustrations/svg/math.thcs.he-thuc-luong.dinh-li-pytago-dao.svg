<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 312 336" role="img" aria-label="Định lí Pytago"><title>Định lí Pytago</title><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="312" height="336"/><polygon points="108,204 204,204 204,300 108,300" class="fill-a"/><polyline points="108,204 204,204 204,300 108,300 108,204" class="ink-thin" fill="none"/><polygon points="108,204 108,132 36,132 36,204" class="fill-c"/><polyline points="108,204 108,132 36,132 36,204 108,204" class="ink-thin" fill="none"/><polygon points="204,204 276,108 180,36 108,132" class="fill-b"/><polyline points="204,204 276,108 180,36 108,132" class="ink-thin" fill="none"/><text x="156" y="257" text-anchor="middle" class="lbl">b²</text><text x="72" y="173" text-anchor="middle" class="lbl">c²</text><text x="192" y="125" text-anchor="middle" class="lbl">a² = b² + c²</text><polygon points="108,204 204,204 108,132" class="fill-a" fill-opacity="0.1"/><polyline points="108,132 108,204 204,204 108,132" class="ink" fill="none" stroke-width="2.2"/><polyline points="120,204 120,192 108,192" class="ink-thin" fill="none"/><text x="156" y="198" text-anchor="middle" class="lbl">b</text><text x="116" y="172" text-anchor="start" class="lbl">c</text><text x="148" y="160" text-anchor="start" class="lbl">a</text></svg>