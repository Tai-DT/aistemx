" text-anchor="middle" class="lbl-sm">2</text><line x1="219.818" y1="256" x2="219.818" y2="261" class="axis"/><text x="219.818" y="275" text-anchor="middle" class="lbl-sm">3</text><line x1="276.182" y1="256" x2="276.182" y2="261" class="axis"/><text x="276.182" y="275" text-anchor="middle" class="lbl-sm">4</text><line x1="332.545" y1="256" x2="332.545" y2="261" class="axis"/><text x="332.545" y="275" text-anchor="middle" class="lbl-sm">5</text><line x1="388.909" y1="256" x2="388.909" y2="261" class="axis"/><text x="388.909" y="275" text-anchor="middle" class="lbl-sm">6</text><text x="444" y="292" text-anchor="end" class="lbl">x</text><text x="219.818" y="18" text-anchor="middle" class="lbl">Mₒ = 3</text><text x="107.091" y="206.25" text-anchor="middle" class="lbl-sm">3</text><text x="163.455" y="147.917" text-anchor="middle" class="lbl-sm">7</text><text x="219.818" y="75" text-anchor="middle" class="lbl-sm">12</text><text x="276.182" y="118.75" text-anchor="middle" class="lbl-sm">9</text><text x="332.545" y="177.083" text-anchor="middle" class="lbl-sm">5</text><text x="388.909" y="220.833" text-anchor="middle" class="lbl-sm">2</text></svg>