<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 324" role="img" aria-label="Giá trị lượng giác của cung đặc biệt"><title>Giá trị lượng giác của cung đặc biệt</title><desc>Cung phần tư thứ nhất của đường tròn đơn vị với toạ độ (cos; sin) của các cung 0, π/6, π/4, π/3, π/2.</desc><style>@media (prefers-color-scheme: dark){
