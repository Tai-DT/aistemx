<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 372" role="img" aria-label="Góc nội tiếp chắn nửa đường tròn"><title>Góc nội tiếp chắn nửa đường tròn</title><desc>BC là đường kính nên góc BAC nội tiếp chắn nửa đường tròn và bằng 90°.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="372" height="372"/><circle cx="186" cy="186" r="130" class="ink"/><polygon points="247.031,71.217 56,186 316,186" class="fill-a"/><polyline points="247.031,71.217 56,186 316,186 247.031,71.217" class="ink" fill="none"/><line x1="56" y1="186" x2="316" y2="186" class="accent-c" stroke-width="2.4"/><polyline points="235.888,77.912 242.584,89.055 253.727,82.36" class="ink-thin" fill="none"/><circle cx="186" cy="186" r="3" class="accent-b"/><text x="255.012" y="60.707" text-anchor="middle" class="lbl">A</text><text x="39.525" y="194.693" text-anchor="middle" class="lbl">B</text><text x="332.051" y="196.1" text-anchor="middle" class="lbl">C</text><text x="186" y="207.5" text-anchor="middle" class="lbl-sm">O</text></svg>