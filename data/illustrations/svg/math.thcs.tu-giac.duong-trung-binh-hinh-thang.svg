<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 262" role="img" aria-label="Đường trung bình của hình thang"><title>Đường trung bình của hình thang</title><desc>M, N là trung điểm hai cạnh bên; MN song song hai đáy và bằng nửa tổng hai đáy.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="412" height="262"/><polygon points="101,56 261,56 356,206 56,206" class="fill-a"/><polyline points="101,56 261,56 356,206 56,206 101,56" class="ink" fill="none"/><line x1="78.5" y1="131" x2="308.5" y2="131" class="accent-b" stroke-width="2.4"/><circle cx="78.5" cy="131" r="3" class="accent-b"/><circle cx="308.5" cy="131" r="3" class="accent-b"/><line x1="95.497" y1="95.224" x2="84.003" y2="91.776" class="ink-thin"/><line x1="72.997" y1="170.224" x2="61.503" y2="166.776" class="ink-thin"/><line x1="289.819" y1="90.29" x2="279.681" y2="96.71" class="ink-thin"/><line x1="337.319" y1="165.29" x2="327.181" y2="171.71" class="ink-thin"/><text x="181" y="46.5" text-anchor="middle" class="lbl">AB = 3.2</text><text x="206" y="231.5" text-anchor="middle" class="lbl">CD = 6</text><text x="193.5" y="123.5" text-anchor="middle" class="lbl">MN</text><text x="65.5" y="139.5" text-anchor="end" class="lbl">M</text><text x="321.5" y="139.5" text-anchor="middle" class="lbl">N</text><text x="89.349" y="51.053" text-anchor="middle" class="lbl">A</text><text x="271.034" y="49.351" text-anchor="middle" class="lbl">B</text><text x="369.619" y="216.786" text-anchor="middle" class="lbl">C</text><text x="42.832" y="217.683" text-anchor="middle" class="lbl">D</text></svg>