oke="none" fill-opacity="1"/><text x="177.314" y="88.686" text-anchor="start" class="lbl-sm">β⁺  (pozitron)</text><text x="102.2" y="267" text-anchor="end" class="lbl-sm">A</text><text x="102.2" y="284" text-anchor="end" class="lbl-sm">Z</text><text x="105.2" y="279" text-anchor="start" class="lbl">X</text><text x="127.4" y="279" text-anchor="start" class="lbl-sm">→</text><text x="153.8" y="267" text-anchor="end" class="lbl-sm">0</text><text x="153.8" y="284" text-anchor="end" class="lbl-sm">+1</text><text x="156.8" y="279" text-anchor="start" class="lbl">e</text><text x="179" y="279" text-anchor="start" class="lbl-sm">+</text><text x="212.2" y="267" text-anchor="end" class="lbl-sm">A</text><text x="212.2" y="284" text-anchor="end" class="lbl-sm">Z−1</text><text x="215.2" y="279" text-anchor="start" class="lbl">Y</text><text x="237.4" y="279" text-anchor="start" class="lbl-sm">+ nơtrinô</text><text x="200" y="306" text-anchor="middle" class="lbl-sm">ΔZ = -1,  ΔN = +1</text></svg>