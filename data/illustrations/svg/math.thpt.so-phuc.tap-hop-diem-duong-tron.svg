<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352.4 342.4" role="img" aria-label="Tập hợp điểm |z − z₀| = R"><title>Tập hợp điểm |z − z₀| = R</title><desc>Tập hợp các điểm cách điểm I cố định một khoảng không đổi là một đường tròn.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="352.4" height="342.4"/><line x1="45" y1="204.6" x2="298" y2="204.6" class="axis" stroke-width="2.5"/><polygon points="298,204.6 291.938,208.1 291.938,201.1" class="axis" stroke="none" fill-opacity="1"/><line x1="114" y1="287.4" x2="114" y2="34.4" class="axis" stroke-width="2.5"/><polygon points="114,34.4 117.5,40.462 110.5,40.462" class="axis" stroke="none" fill-opacity="1"/><text x="296" y="195.6" text-anchor="end" class="lbl">Re</text><text x="123" y="45.4" text-anchor="start" class="lbl">Im</text><text x="106" y="219.6" text-anchor="end" class="lbl">O</text><circle cx="169.2" cy="163.2" r="101.2" class="accent-a" style="fill:none" stroke-width="2.4"/><circle cx="169.2" cy="163.2" r="3.4" class="accent-b"/><text x="177.2" y="179.2" text-anchor="start" class="lbl-sm">I(a₀; b₀)</text><line x1="169.2" y1="163.2" x2="236.916" y2="87.994" class="accent-b" style="fill:none" stroke-width="2"/><circle cx="236.916" cy="87.994" r="3.4" class="accent-b"/><text x="209.058" y="119.597" text-anchor="start" class="lbl">R</text><text x="244.916" y="80.994" text-anchor="start" class="lbl">M</text><text x="176.2" y="309.4" text-anchor="middle" class="lbl-sm">|z − z₀| = R ⇔ M chạy trên đường tròn tâm I bán</text><text x="176.2" y="324.4" text-anchor="middle" class="lbl-sm">kính R</text></svg>