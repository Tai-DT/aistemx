<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 394 274" role="img" aria-label="Mạch kín có nguồn điện"><title>Mạch kín có nguồn điện</title><desc>Nguồn điện suất điện động ξ, điện trở trong r, mạch ngoài điện trở R_N.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="394" height="274"/><line x1="66" y1="206" x2="114" y2="206" class="ink"/><line x1="142" y1="206" x2="191" y2="206" class="ink"/><line x1="237" y1="206" x2="348" y2="206" class="ink"/><line x1="66" y1="70" x2="184" y2="70" class="ink"/><line x1="230" y1="70" x2="348" y2="70" class="ink"/><line x1="66" y1="70" x2="66" y2="206" class="ink"/><line x1="348" y1="70" x2="348" y2="206" class="ink"/><rect x="52" y="164" width="194" height="74" class="ink-thin" style="stroke-dasharray:6 4"/><text x="149" y="156" text-anchor="middle" class="lbl-sm">nguồn điện</text><line x1="134" y1="193" x2="134" y2="219" class="ink"/><line x1="122" y1="199" x2="122" y2="213" class="ink" style="stroke-width:4"/><text x="138" y="234" text-anchor="middle" class="lbl-sm">+</text><text x="118" y="234" text-anchor="middle" class="lbl-sm">−</text><text x="128" y="186" text-anchor="middle" class="lbl">ξ</text><rect x="191" y="197" width="46" height="18" class="ink"/><text x="214" y="189" text-anchor="middle" class="lbl">r</text><rect x="184" y="61" width="46" height="18" class="ink"/><text x="207" y="53" text-anchor="middle" class="lbl">R_N</text><line x1="348" y1="186" x2="348" y2="152" class="accent-b" style="stroke-width:2.2"/><polygon points="348,152 352,158.928 344,158.928" class="accent-b" stroke="none" fill-opacity="1"/><text x="356" y="172" text-anchor="start" class="lbl">I</text><text x="207" y="40" text-anchor="middle" class="lbl-sm">U_N = ξ − I·r</text><text x="197" y="262" text-anchor="middle" class="lbl">I = ξ / (R_N + r)</text></svg>