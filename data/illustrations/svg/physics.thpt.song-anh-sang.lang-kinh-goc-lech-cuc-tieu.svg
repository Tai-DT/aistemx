<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Đường truyền tia sáng qua lăng kính"><title>Đường truyền tia sáng qua lăng kính</title><desc>Tia sáng đơn sắc đi qua lăng kính góc chiết quang A: sin i₁ = n·sin r₁, sin i₂ = n·sin r₂, D = i₁ + i₂ − A.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="480" height="320"/><polygon points="240,55 120,265 360,265" class="fill-a"/><polyline points="240,55 120,265 360,265 240,55" class="ink" fill="none" stroke-width="2"/><text x="240" y="45" text-anchor="middle" class="lbl-sm">A (góc chiết quang)</text><text x="108" y="279" text-anchor="start" class="lbl">B</text><text x="364" y="279" text-anchor="start" class="lbl">C</text><line x1="55" y1="225" x2="170" y2="180" class="accent-b" stroke-width="2.5"/><polygon points="170,180 165.006,186.25 162.091,178.8" class="accent-b" stroke="none" fill-opacity="1"/><text x="102.5" y="218.5" text-anchor="start" class="lbl-sm">SI (tia tới)</text><line x1="170" y1="180" x2="300" y2="165" class="accent-b" stroke-width="2.5"/><polygon points="300,165 293.576,169.768 292.659,161.821" class="accent-b" stroke="none" fill-opacity="1"/><text x="235" y="188.5" text-anchor="middle" class="lbl-sm">r₁     r₂</text><line x1="300" y1="165" x2="425" y2="220" class="accent-b" stroke-width="2.5"/><polygon points="425,220 417.048,220.871 420.269,213.548" class="accent-b" stroke="none" fill-opacity="1"/><text x="372.5" y="208.5" text-anchor="start" class="lbl-sm">JR (tia ló)</text><line x1="170" y1="180" x2="235" y2="145" class="ink-thin" stroke-dasharray="4 3"/><line x1="300" y1="165" x2="235" y2="145" class="ink-thin" stroke-dasharray="4 3"/><text x="245" y="137" text-anchor="start" class="lbl-sm">D (góc lệch)</text><line x1="145" y1="150" x2="205" y2="222" class="axis" stroke-dasharray="3 3"/><line x1="265" y1="207" x2="325" y2="135" class="axis" stroke-dasharray="3 3"/><text x="240" y="310" text-anchor="middle" class="lbl-sm">A = r₁ + r₂  |  D = i₁ + i₂ − A</text></svg>