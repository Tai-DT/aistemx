<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 304" role="img" aria-label="Vị trí tương đối của hai đường tròn"><title>Vị trí tương đối của hai đường tròn</title><desc>Năm trường hợp theo khoảng cách d giữa hai tâm: ngoài nhau, tiếp xúc ngoài, cắt nhau, tiếp xúc trong, đựng nhau.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="624" height="304"/><circle cx="62" cy="70" r="42" class="ink"/><circle cx="146" cy="70" r="26" class="accent-a" style="fill:none" stroke-width="2"/><circle cx="62" cy="70" r="2.2" class="accent-b"/><circle cx="146" cy="70" r="2.2" class="accent-b"/><line x1="62" y1="70" x2="146" y2="70" class="ink-thin" stroke-dasharray="3 3" stroke-width="1.1"/><text x="104" y="122.5" text-anchor="middle" class="lbl-sm">ở ngoài nhau</text><text x="104" y="138.5" text-anchor="middle" class="lbl-sm">d &gt; R + r</text><circle cx="278" cy="70" r="42" class="ink"/><circle cx="346" cy="70" r="26" class="accent-a" style="fill:none" stroke-width="2"/><circle cx="278" cy="70" r="2.2" class="accent-b"/><circle cx="346" cy="70" r="2.2" class="accent-b"/><line x1="278" y1="70" x2="346" y2="70" class="ink-thin" stroke-dasharray="3 3" stroke-width="1.1"/><text x="312" y="122.5" text-anchor="middle" class="lbl-sm">tiếp xúc ngoài</text><text x="312" y="138.5" text-anchor="middle" class="lbl-sm">d = R + r</text><circle cx="496" cy="70" r="42" class="ink"/><circle cx="544" cy="70" r="26" class="accent-a" style="fill:none" stroke-width="2"/><circle cx="496" cy="70" r="2.2" class="accent-b"/><circle cx="544" cy="70" r="2.2" class="accent-b"/><line x1="496" y1="70" x2="544" y2="70" class="ink-thin" stroke-dasharray="3 3" stroke-width="1.1"/><text x="520" y="122.5" text-anchor="middle" class="lbl-sm">cắt nhau</text><text x="520" y="138.5" text-anchor="middle" class="lbl-sm">|R − r| &lt; d &lt; R + r</text><circle cx="96" cy="222" r="42" class="ink"/><circle cx="112" cy="222" r="26" class="accent-a" style="fill:none" stroke-width="2"/><circle cx="96" cy="222" r="2.2" class="accent-b"/><circle cx="112" cy="222" r="2.2" class="accent-b"/><line x1="96" y1="222" x2="112" y2="222" class="ink-thin" stroke-dasharray="3 3" stroke-width="1.1"/><text x="104" y="274.5" text-anchor="middle" class="lbl-sm">tiếp xúc trong</text><text x="104" y="290.5" text-anchor="middle" class="lbl-sm">d = |R − r|</text><circle cx="310" cy="222" r="42" class="ink"/><circle cx="314" cy="222" r="26" class="accent-a" style="fill:none" stroke-width="2"/><circle cx="310" cy="222" r="2.2" class="accent-b"/><circle cx="314" cy="222" r="2.2" class="accent-b"/><line x1="310" y1="222" x2="314" y2="222" class="ink-thin" stroke-dasharray="3 3" stroke-width="1.1"/><text x="312" y="274.5" text-anchor="middle" class="lbl-sm">đựng nhau</text><text x="312" y="290.5" text-anchor="middle" class="lbl-sm">d &lt; |R − r|</text></svg>