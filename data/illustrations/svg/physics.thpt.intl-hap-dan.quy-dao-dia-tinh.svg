<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Trường hấp dẫn và định luật vạn vật hấp dẫn"><title>Trường hấp dẫn và định luật vạn vật hấp dẫn</title><desc>Tương tác hấp dẫn giữa hai vật F = G·m₁m₂/r².</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="480" height="320"/><text x="240" y="35" text-anchor="middle" class="lbl" font-size="16px">v = √(G·M / r)   và   v_thoát = √(2G·M / r)</text><text x="240" y="60" text-anchor="middle" class="lbl-sm">Lực hấp dẫn đóng vai trò lực hướng tâm: F_hd = F_ht</text><circle cx="180" cy="185" r="45" class="accent-a" fill-opacity="0.3"/><text x="180" y="189" text-anchor="middle" class="lbl-sm">Trái Đất (M)</text><circle cx="180" cy="185" r="105" class="accent-c" fill="none" stroke-dasharray="5 4" stroke-width="1.8"/><rect x="248.246" y="104.754" width="12" height="12" class="ink"/><line x1="240.246" y1="110.754" x2="268.246" y2="110.754" class="accent-a" stroke-width="3"/><text x="268.246" y="102.754" text-anchor="start" class="lbl-sm">Vệ tinh (m)</text><line x1="254.246" y1="110.754" x2="293.137" y2="149.645" class="accent-c" stroke-width="2.5"/><polygon points="293.137,149.645 286.376,147.833 291.325,142.883" class="accent-c" stroke="none" fill-opacity="1"/><text x="299.137" y="149.645" text-anchor="start" class="lbl">v⃗</text><line x1="254.246" y1="110.754" x2="218.891" y2="146.109" class="accent-b" stroke-width="2.5"/><polygon points="218.891,146.109 220.703,139.348 225.652,144.297" class="accent-b" stroke="none" fill-opacity="1"/><text x="204.891" y="158.109" text-anchor="start" class="lbl">F⃗_hd</text><line x1="180" y1="185" x2="75" y2="185" class="ink-thin" stroke-dasharray="3 3"/><line x1="180" y1="185" x2="180" y2="80" class="accent-b" stroke-width="1.8"/><line x1="180" y1="160" x2="180" y2="185" class="accent-b" stroke-width="2.5"/><polygon points="180,185 177.5,180.67 182.5,180.67" class="accent-b" stroke="none" fill-opacity="1"/><line x1="180" y1="105" x2="180" y2="80" class="accent-b" stroke-width="2.5"/><polygon points="180,80 182.5,84.33 177.5,84.33" class="accent-b" stroke="none" fill-opacity="1"/><text x="170" y="132.5" text-anchor="end" class="lbl-sm">r = R + h</text><text x="460" y="160" text-anchor="end" class="lbl">W = -G·Mm / (2r)</text><text x="460" y="185" text-anchor="end" class="lbl-sm">Thế năng W_t = -G·Mm/r</text><text x="460" y="210" text-anchor="end" class="lbl-sm">Động năng W_d = G·Mm/(2r)</text></svg>