<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 320" role="img" aria-label="Giản đồ mức năng lượng và dãy quang phổ hiđrô"><title>Giản đồ mức năng lượng và dãy quang phổ hiđrô</title><desc>Các mức năng lượng nằm ngang, đánh số n = 1 tới n = 6, dồn dần về giới hạn ion hoá E = 0. Mũi tên đi xuống là các chuyển mức phát xạ của từng dãy quang phổ.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="470" height="320"/><line x1="80.12" y1="53.828" x2="380" y2="53.828" class="ink-thin" stroke-dasharray="6 4"/><text x="384" y="48.828" text-anchor="start" class="lbl-sm">E = 0  (ion hoá)</text><line x1="80.12" y1="252.103" x2="380" y2="252.103" class="ink"/><text x="384" y="256.103" text-anchor="start" class="lbl-sm">n = 1</text><text x="74.12" y="256.103" text-anchor="end" class="lbl-sm">-13.6 eV</text><line x1="80.12" y1="103.397" x2="380" y2="103.397" class="ink"/><text x="384" y="107.397" text-anchor="start" class="lbl-sm">n = 2</text><text x="74.12" y="107.397" text-anchor="end" class="lbl-sm">-3.4 eV</text><line x1="80.12" y1="75.858" x2="380" y2="75.858" class="ink"/><text x="384" y="79.858" text-anchor="start" class="lbl-sm">n = 3</text><text x="74.12" y="79.858" text-anchor="end" class="lbl-sm">-1.51 eV</text><line x1="80.12" y1="66.22" x2="380" y2="66.22" class="ink"/><line x1="80.12" y1="61.759" x2="380" y2="61.759" class="ink"/><line x1="80.12" y1="59.335" x2="380" y2="59.335" class="ink"/><text x="384" y="63.335" text-anchor="start" class="lbl-sm">n = 4–6</text><line x1="116.84" y1="103.397" x2="116.84" y2="252.103" class="accent-a" stroke-width="2.5"/><polygon points="116.84,252.103 113.34,246.041 120.34,246.041" class="accent-a" stroke="none" fill-opacity="1"/><line x1="132.14" y1="75.858" x2="132.14" y2="252.103" class="accent-a" stroke-width="2.5"/><polygon points="132.14,252.103 128.64,246.041 135.64,246.041" class="accent-a" stroke="none" fill-opacity="1"/><line x1="147.44" y1="66.22" x2="147.44" y2="252.103" class="accent-a" stroke-width="2.5"/><polygon points="147.44,252.103 143.94,246.041 150.94,246.041" class="accent-a" stroke="none" fill-opacity="1"/><text x="129.08" y="269.103" text-anchor="middle" class="lbl-sm">Lyman</text><line x1="202.52" y1="75.858" x2="202.52" y2="103.397" class="accent-c" stroke-width="2.5"/><polygon points="202.52,103.397 199.02,97.334 206.02,97.334" class="accent-c" stroke="none" fill-opacity="1"/><line x1="217.82" y1="66.22" x2="217.82" y2="103.397" class="accent-c" stroke-width="2.5"/><polygon points="217.82,103.397 214.32,97.334 221.32,97.334" class="accent-c" stroke="none" fill-opacity="1"/><text x="214.76" y="120.397" text-anchor="middle" class="lbl-sm">Balmer</text><line x1="288.2" y1="66.22" x2="288.2" y2="75.858" class="accent-d" stroke-width="2.5"/><polygon points="288.2,75.858 284.7,69.796 291.7,69.796" class="accent-d" stroke="none" fill-opacity="1"/><text x="300.44" y="92.858" text-anchor="middle" class="lbl-sm">Paschen</text><text x="74" y="306" text-anchor="start" class="lbl">E(n) = −13,6·Z²/n²  (eV)</text></svg>