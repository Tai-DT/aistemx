<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 312" role="img" aria-label="Ba đường đồng quy trong tam giác"><title>Ba đường đồng quy trong tam giác</title><desc>Ba đường phân giác trong đồng quy tại tâm I của đường tròn nội tiếp; I cách đều ba cạnh.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="412" height="312"/><polygon points="151,56 56,256 356,256" class="fill-a"/><polyline points="151,56 56,256 356,256 151,56" class="ink" fill="none"/><circle cx="173.508" cy="181.726" r="74.274" class="ink-thin"/><line x1="151" y1="56" x2="186.805" y2="256" class="accent-b" stroke-dasharray="5 4" stroke-width="1.7"/><path d="M 142.419 74.066 A 20 20 0 0 0 154.524 75.687" class="accent-d" style="fill:none" stroke-width="1.8"/><path d="M 155.582 81.593 A 26 26 0 0 0 169.61 74.156" class="accent-d" style="fill:none" stroke-width="1.8"/><line x1="56" y1="256" x2="238.052" y2="140.929" class="accent-b" stroke-dasharray="5 4" stroke-width="1.7"/><path d="M 76 256 A 20 20 0 0 0 72.906 245.314" class="accent-d" style="fill:none" stroke-width="1.8"/><path d="M 77.978 242.108 A 26 26 0 0 0 67.155 232.515" class="accent-d" style="fill:none" stroke-width="1.8"/><line x1="356" y1="256" x2="104.602" y2="153.681" class="accent-b" stroke-dasharray="5 4" stroke-width="1.7"/><path d="M 341.684 242.034 A 20 20 0 0 0 337.476 248.461" class="accent-d" style="fill:none" stroke-width="1.8"/><path d="M 331.918 246.199 A 26 26 0 0 0 330 256" class="accent-d" style="fill:none" stroke-width="1.8"/><line x1="173.508" y1="181.726" x2="173.508" y2="256" class="accent-c" stroke-width="2"/><polyline points="173.508,247 182.508,247 182.508,256" class="ink-thin" fill="none"/><text x="173.508" y="223.363" text-anchor="end" class="lbl">r</text><circle cx="173.508" cy="181.726" r="4" class="accent-d"/><text x="186.508" y="190.226" text-anchor="middle" class="lbl">I</text><text x="146.492" y="44.109" text-anchor="middle" class="lbl">A</text><text x="40.833" y="268.179" text-anchor="middle" class="lbl">B</text><text x="371.806" y="266.76" text-anchor="middle" class="lbl">C</text></svg>