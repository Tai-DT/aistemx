<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 227.862 207.317" role="img" aria-label="Tứ diện đều"><title>Tứ diện đều</title><desc>Khối tứ diện với các cạnh được đánh dấu</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="227.862" height="207.317"/><line x1="171.862" y1="116.752" x2="48" y2="136.506" class="ink-thin" stroke-dasharray="6 5"/><line x1="48" y1="136.506" x2="159.951" y2="163.317" class="ink"/><line x1="171.862" y1="116.752" x2="159.951" y2="163.317" class="ink"/><line x1="48" y1="136.506" x2="126.604" y2="34" class="ink"/><line x1="171.862" y1="116.752" x2="126.604" y2="34" class="ink"/><line x1="159.951" y1="163.317" x2="126.604" y2="34" class="ink"/><text x="103.975" y="169.911" text-anchor="middle" class="lbl">a</text><line x1="126.604" y1="138.858" x2="126.604" y2="34" class="accent-b" stroke-dasharray="6 5" stroke-width="1.6"/><polyline points="115.907,136.296 115.907,125.296 126.604,127.858" class="ink-thin" fill="none"/><text x="119.604" y="86.429" text-anchor="end" class="lbl">h</text></svg>