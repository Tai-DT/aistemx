<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 252.8" role="img" aria-label="Hệ thức lượng trong tam giác vuông"><title>Hệ thức lượng trong tam giác vuông</title><desc>Tam giác vuông tại A với đường cao AH xuống cạnh huyền BC.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="392" height="252.8"/><polygon points="159.6,62 66,186.8 326,186.8" class="fill-a"/><polyline points="159.6,62 66,186.8 326,186.8 159.6,62" class="ink" fill="none"/><polyline points="151.8,72.4 162.2,80.2 170,69.8" class="ink-thin" fill="none"/><text x="159.6" y="50" text-anchor="middle" class="lbl">A</text><text x="58" y="204.8" text-anchor="end" class="lbl">B</text><text x="334" y="204.8" text-anchor="start" class="lbl">C</text><text x="100.8" y="124.4" text-anchor="end" class="lbl">c</text><text x="252.8" y="124.4" text-anchor="start" class="lbl">b</text><line x1="159.6" y1="62" x2="159.6" y2="186.8" class="accent-b" style="fill:none" stroke-width="2.4"/><polyline points="148.6,186.8 148.6,175.8 159.6,175.8" class="ink-thin" fill="none"/><circle cx="159.6" cy="186.8" r="3" class="accent-b"/><text x="167.6" y="204.8" text-anchor="start" class="lbl">H</text><text x="169.6" y="124.4" text-anchor="start" class="lbl">h</text><line x1="66" y1="208.8" x2="159.6" y2="208.8" class="accent-c" style="fill:none" stroke-width="2"/><line x1="159.6" y1="208.8" x2="326" y2="208.8" class="accent-d" style="fill:none" stroke-width="2"/><text x="112.8" y="224.8" text-anchor="middle" class="lbl">c′</text><text x="242.8" y="224.8" text-anchor="middle" class="lbl">b′</text><text x="196" y="238.8" text-anchor="middle" class="lbl-sm">b² = a·b′, c² = a·c′, h² = b′·c′, a·h = b·c</text></svg>