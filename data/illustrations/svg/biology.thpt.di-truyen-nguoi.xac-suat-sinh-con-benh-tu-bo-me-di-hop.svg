<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 300" role="img" aria-label="Sơ đồ phả hệ"><title>Sơ đồ phả hệ</title><desc>Phả hệ hai thế hệ: một cặp bố mẹ ở thế hệ I và 4 người con ở thế hệ II; hình vuông là nam, hình tròn là nữ, ký hiệu tô đặc là người bị bệnh, chấm ở giữa là người mang gen bệnh nhưng không biểu hiện.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="372" height="300"/><text x="24" y="89" text-anchor="middle" class="lbl">I</text><text x="24" y="201" text-anchor="middle" class="lbl">II</text><line x1="147" y1="84" x2="225" y2="84" class="ink"/><rect x="121" y="71" width="26" height="26" class="ink"/><circle cx="134" cy="84" r="4" class="accent-b"/><text x="134" y="62" text-anchor="middle" class="lbl-sm">Aa</text><circle cx="238" cy="84" r="13" class="ink"/><circle cx="238" cy="84" r="4" class="accent-b"/><text x="238" y="62" text-anchor="middle" class="lbl-sm">Aa</text><line x1="186" y1="84" x2="186" y2="140" class="ink"/><line x1="75" y1="140" x2="297" y2="140" class="ink"/><line x1="75" y1="140" x2="75" y2="183" class="ink"/><rect x="62" y="183" width="26" height="26" class="ink"/><text x="75" y="226" text-anchor="middle" class="lbl-sm">AA</text><line x1="149" y1="140" x2="149" y2="183" class="ink"/><circle cx="149" cy="196" r="13" class="ink"/><circle cx="149" cy="196" r="4" class="accent-b"/><text x="149" y="226" text-anchor="middle" class="lbl-sm">Aa</text><line x1="223" y1="140" x2="223" y2="183" class="ink"/><rect x="210" y="183" width="26" height="26" class="ink"/><circle cx="223" cy="196" r="4" class="accent-b"/><text x="223" y="226" text-anchor="middle" class="lbl-sm">Aa</text><line x1="297" y1="140" x2="297" y2="183" class="ink"/><circle cx="297" cy="196" r="13" class="accent-b" fill-opacity="1"/><circle cx="297" cy="196" r="13" class="ink"/><text x="297" y="226" text-anchor="middle" class="lbl-sm">aa</text><rect x="40" y="249" width="18" height="18" class="ink"/><text x="64" y="263" text-anchor="start" class="lbl-sm">nam</text><circle cx="122" cy="258" r="9" class="ink"/><text x="136" y="263" text-anchor="start" class="lbl-sm">nữ</text><circle cx="184" cy="258" r="9" class="accent-b" fill-opacity="1"/><text x="198" y="263" text-anchor="start" class="lbl-sm">bị bệnh</text><circle cx="262" cy="258" r="9" class="ink"/><circle cx="262" cy="258" r="3.4" class="accent-b"/><text x="276" y="263" text-anchor="start" class="lbl-sm">mang gen</text><text x="348" y="30" text-anchor="end" class="lbl">P(con bệnh) = 1/4</text></svg>