<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 316" role="img" aria-label="Giản đồ năng lượng: phản ứng toả nhiệt và thu nhiệt"><title>Giản đồ năng lượng: phản ứng toả nhiệt và thu nhiệt</title><desc>Hai giản đồ năng lượng theo tiến trình phản ứng: bên trái sản phẩm thấp hơn chất đầu (ΔH &lt; 0, toả nhiệt), bên phải sản phẩm cao hơn chất đầu (ΔH &gt; 0, thu nhiệt).</desc><style>@media (prefers-color-scheme: dark){
