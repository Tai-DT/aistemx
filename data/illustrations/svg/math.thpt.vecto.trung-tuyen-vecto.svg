<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 385.6 268" role="img" aria-label="Hệ thức vectơ trung điểm"><title>Hệ thức vectơ trung điểm</title><desc>I là trung điểm của đoạn AB; hai vectơ IA và IB đối nhau.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="385.6" height="268"/><line x1="68" y1="192" x2="317.6" y2="192" class="ink"/><circle cx="68" cy="192" r="3.4" class="ink"/><text x="68" y="212" text-anchor="middle" class="lbl">A</text><circle cx="317.6" cy="192" r="3.4" class="ink"/><text x="317.6" y="212" text-anchor="middle" class="lbl">B</text><circle cx="192.8" cy="192" r="3.4" class="ink"/><text x="192.8" y="212" text-anchor="middle" class="lbl">I</text><circle cx="224" cy="62" r="3.4" class="ink"/><text x="224" y="52" text-anchor="middle" class="lbl">M</text><line x1="192.8" y1="176" x2="68" y2="176" class="accent-a" stroke-width="2.5"/><polygon points="68,176 74.928,172 74.928,180" class="accent-a" stroke="none" fill-opacity="1"/><line x1="192.8" y1="176" x2="317.6" y2="176" class="accent-b" stroke-width="2.5"/><polygon points="317.6,176 310.672,180 310.672,172" class="accent-b" stroke="none" fill-opacity="1"/><line x1="224" y1="62" x2="68" y2="192" class="accent-a" style="fill:none" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="224" y1="62" x2="317.6" y2="192" class="accent-b" style="fill:none" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="224" y1="62" x2="192.8" y2="192" class="accent-d" style="fill:none" stroke-width="1.6" stroke-dasharray="5 4"/><text x="192.8" y="250" text-anchor="middle" class="lbl-sm">IA + IB = 0 ⇔ MA + MB = 2·MI (mọi điểm M)</text></svg>