<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 248" role="img" aria-label="Dải số liệu và mốc thống kê"><title>Dải số liệu và mốc thống kê</title><desc>Các giá trị của mẫu trên trục số cùng một số đặc trưng của mẫu.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="480" height="248"/><line x1="42" y1="180" x2="460" y2="180" class="axis"/><line x1="86.903" y1="180" x2="86.903" y2="185" class="axis"/><text x="86.903" y="199" text-anchor="middle" class="lbl-sm">4</text><line x1="179.53" y1="180" x2="179.53" y2="185" class="axis"/><text x="179.53" y="199" text-anchor="middle" class="lbl-sm">6</text><line x1="272.157" y1="180" x2="272.157" y2="185" class="axis"/><text x="272.157" y="199" text-anchor="middle" class="lbl-sm">8</text><line x1="364.783" y1="180" x2="364.783" y2="185" class="axis"/><text x="364.783" y="199" text-anchor="middle" class="lbl-sm">10</text><text x="460" y="216" text-anchor="end" class="lbl">giá trị</text><circle cx="86.903" cy="164" r="4" class="accent-a"/><circle cx="133.217" cy="164" r="4" class="accent-a"/><circle cx="133.217" cy="151" r="4" class="accent-a"/><circle cx="179.53" cy="164" r="4" class="accent-a"/><circle cx="225.843" cy="164" r="4" class="accent-a"/><circle cx="225.843" cy="151" r="4" class="accent-a"/><circle cx="225.843" cy="138" r="4" class="accent-a"/><circle cx="272.157" cy="164" r="4" class="accent-a"/><circle cx="318.47" cy="164" r="4" class="accent-a"/><circle cx="411.097" cy="164" r="4" class="accent-a"/><line x1="86.903" y1="64" x2="411.097" y2="64" class="accent-b" stroke-width="2.5"/><polygon points="411.097,64 404.169,68 404.169,60" class="accent-b" stroke="none" fill-opacity="1"/><line x1="411.097" y1="64" x2="86.903" y2="64" class="accent-b" stroke-width="2.5"/><polygon points="86.903,64 93.831,60 93.831,68" class="accent-b" stroke="none" fill-opacity="1"/><text x="249" y="56" text-anchor="middle" class="lbl">R = 7</text><line x1="86.903" y1="180" x2="86.903" y2="64" class="ink-thin" stroke-dasharray="5 4" stroke-width="1.2"/><line x1="411.097" y1="180" x2="411.097" y2="64" class="ink-thin" stroke-dasharray="5 