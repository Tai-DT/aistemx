<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.4 356" role="img" aria-label="Khung Punnett"><title>Khung Punnett</title><desc>Khung Punnett 2×2: hàng là giao tử Xᴬ, Xᵃ, cột là giao tử Xᴬ, Y; mỗi ô là kiểu gen của hợp tử tương ứng.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="380.4" height="356"/><text x="116.4" y="30" text-anchor="start" class="lbl-sm"></text><text x="256.4" y="48" text-anchor="middle" class="lbl-sm">giao tử ♂ (XᴬY)</text><text x="106.4" y="196" text-anchor="end" class="lbl-sm">giao tử ♀ (XᴬXᵃ)</text><text x="208.4" y="86" text-anchor="middle" class="lbl">Xᴬ</text><text x="304.4" y="86" text-anchor="middle" class="lbl">Y</text><text x="138.4" y="153" text-anchor="middle" class="lbl">Xᴬ</text><text x="138.4" y="249" text-anchor="middle" class="lbl">Xᵃ</text><rect x="256.4" y="196" width="96" height="96" class="fill-b"/><line x1="160.4" y1="100" x2="352.4" y2="100" class="ink"/><line x1="160.4" y1="196" x2="352.4" y2="196" class="ink"/><line x1="160.4" y1="292" x2="352.4" y2="292" class="ink"/><line x1="160.4" y1="100" x2="160.4" y2="292" class="ink"/><line x1="256.4" y1="100" x2="256.4" y2="292" class="ink"/><line x1="352.4" y1="100" x2="352.4" y2="292" class="ink"/><text x="208.4" y="153" text-anchor="middle" class="lbl">XᴬXᴬ</text><text x="304.4" y="153" text-anchor="middle" class="lbl">XᴬY</text><text x="208.4" y="249" text-anchor="middle" class="lbl">XᴬXᵃ</text><text x="304.4" y="249" text-anchor="middle" class="lbl">XᵃY</text><text x="116.4" y="316" text-anchor="start" class="lbl">1 XᴬXᴬ : 1 XᴬXᵃ : 1 XᴬY : 1 XᵃY  —  chỉ con trai biểu hiện</text><rect x="116.4" y="326" width="14" height="12" class="fill-b"/><rect x="116.4" y="326" width="14" height="12" class="ink-thin"/><text x="138.4" y="336" text-anchor="start" class="lbl-sm">con trai mang alen lặn thì biểu hiện bệnh</text></svg>