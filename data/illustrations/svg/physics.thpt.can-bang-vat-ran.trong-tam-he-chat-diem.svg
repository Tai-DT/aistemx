<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" role="img" aria-label="Quy tắc đòn bẩy và hợp lực"><title>Quy tắc đòn bẩy và hợp lực</title><desc>Điều kiện cân bằng đòn bẩy F₁·d₁ = F₂·d₂.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="460" height="320"/><text x="230" y="40" text-anchor="middle" class="lbl" font-size="16px">F⃗ = F⃗₁ + F⃗₂   (F = F₁ + F₂)</text><text x="230" y="65" text-anchor="middle" class="lbl-sm">F₁ · d₁ = F₂ · d₂   (Chia trong theo tỉ lệ nghịch)</text><line x1="80" y1="160" x2="380" y2="160" class="ink" stroke-width="5" stroke-linecap="round"/><line x1="80" y1="160" x2="80" y2="230" class="accent-a" stroke-width="2.5"/><polygon points="80,230 76,223.072 84,223.072" class="accent-a" stroke="none" fill-opacity="1"/><text x="70" y="245" text-anchor="start" class="lbl">F⃗₁</text><line x1="380" y1="160" x2="380" y2="270" class="accent-a" stroke-width="2.5"/><polygon points="380,270 376,263.072 384,263.072" class="accent-a" stroke="none" fill-opacity="1"/><text x="388" y="280" text-anchor="start" class="lbl">F⃗₂</text><line x1="275" y1="160" x2="275" y2="305" class="accent-b" stroke-width="2.5"/><polygon points="275,305 270.5,297.206 279.5,297.206" class="accent-b" stroke="none" fill-opacity="1"/><text x="283" y="315" text-anchor="start" class="lbl" font-weight="bold">F⃗ = F⃗₁ + F⃗₂</text><circle cx="80" cy="160" r="3.5" class="ink"/><circle cx="380" cy="160" r="3.5" class="ink"/><circle cx="275" cy="160" r="4" class="accent-b"/><text x="80" y="150" text-anchor="middle" class="lbl-sm">A</text><text x="380" y="150" text-anchor="middle" class="lbl-sm">B</text><text x="275" y="150" text-anchor="middle" class="lbl-sm">O</text><line x1="80" y1="135" x2="275" y2="135" class="accent-c" stroke-width="1.8"/><line x1="275" y1="135" x2="380" y2="135" class="accent-d" stroke-width="1.8"/><text x="177.5" y="130" text-anchor="middle" class="lbl">d₁</text><text x="327.5" y="130" text-anchor="middle" class="lbl">d₂</text></svg>