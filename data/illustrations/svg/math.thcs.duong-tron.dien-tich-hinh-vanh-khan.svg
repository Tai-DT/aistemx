<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 352" role="img" aria-label="Hình vành khăn"><title>Hình vành khăn</title><desc>Phần mặt phẳng giữa hai đường tròn đồng tâm bán kính R = 3 và r = 1.9.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="352" height="352"/><path d="M 56 176 A 120 120 0 1 0 296 176 A 120 120 0 1 0 56 176 Z M 100 176 A 76 76 0 1 0 252 176 A 76 76 0 1 0 100 176 Z" class="fill-a" fill-rule="evenodd"/><circle cx="176" cy="176" r="120" class="ink"/><circle cx="176" cy="176" r="76" class="ink"/><line x1="176" y1="176" x2="102.121" y2="81.439" class="accent-b" stroke-width="2"/><line x1="176" y1="176" x2="235.889" y2="222.79" class="accent-c" stroke-width="2"/><circle cx="176" cy="176" r="3" class="accent-b"/><text x="130.195" y="111.372" text-anchor="middle" class="lbl">R</text><text x="213.131" y="219.01" text-anchor="middle" class="lbl">r</text><text x="165" y="184.5" text-anchor="end" class="lbl-sm">O</text></svg>