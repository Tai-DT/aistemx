<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 310" role="img" aria-label="Con lắc đơn"><title>Con lắc đơn</title><desc>Con lắc đơn lệch góc alpha: trọng lực phân tích thành thành phần tiếp tuyến (lực kéo về) và thành phần dọc dây.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="420" height="310"/><line x1="96" y1="46" x2="220" y2="46" class="ink"/><line x1="103.5" y1="46" x2="96.75" y2="37" class="ink-thin"/><line x1="118.5" y1="46" x2="111.75" y2="37" class="ink-thin"/><line x1="133.5" y1="46" x2="126.75" y2="37" class="ink-thin"/><line x1="148.5" y1="46" x2="141.75" y2="37" class="ink-thin"/><line x1="163.5" y1="46" x2="156.75" y2="37" class="ink-thin"/><line x1="178.5" y1="46" x2="171.75" y2="37" class="ink-thin"/><line x1="193.5" y1="46" x2="186.75" y2="37" class="ink-thin"/><line x1="208.5" y1="46" x2="201.75" y2="37" class="ink-thin"/><line x1="158" y1="46" x2="158" y2="234" class="ink-thin" stroke-dasharray="5 5"/><line x1="158" y1="46" x2="251.266" y2="195.256" class="ink"/><text x="192.633" y="120.628" text-anchor="end" class="lbl">ℓ</text><path d="M 158 90 A 44 44 0 0 0 181.316 83.314" class="accent-d" style="fill:none;stroke-width:1.8"/><text x="176.884" y="101.908" text-anchor="start" class="lbl">α</text><path d="M 158 222 A 176 176 0 0 0 251.266 195.256" class="accent-c" style="fill:none;stroke-width:2"/><text x="213.679" y="244.175" text-anchor="middle" class="lbl-sm">s = αℓ</text><circle cx="158" cy="222" r="3.2" class="accent-c"/><circle cx="251.266" cy="195.256" r="13" class="fill-a"/><circle cx="251.266" cy="195.256" r="13" class="ink"/><line x1="251.266" y1="195.256" x2="251.266" y2="257.256" class="accent-b" stroke-width="2.5"/><polygon points="251.266,257.256 246.766,249.462 255.766,249.462" class="accent-b" stroke="none" fill-opacity="1"/><text x="258.266" y="259.256" text-anchor="start" class="lbl">P</text><line x1="251.266" y1="195.256" x2="223.403" y2="212.667" class="accent-d" stroke-width="2.5"/><polygon points="223.403,212.667 227.159,205.603 231.398,212.388" class="accent-d" stroke="none" fill-opacity="1"/><line x1="251.266" y1="195.256" x2="279.128" y2="239.846" class="accent-d" stroke-width="2.5"/><polygon points="279.128,239.846 272.065,236.09 278.849,231.851" class="accent-d" stroke="none" fill-opacity="1"/><line x1="223.403" y1="212.667" x2="251.266" y2="257.256" class="ink-thin" stroke-dasharray="4 4"/><line x1="279.128" y1="239.846" x2="251.266" y2="257.256" class="ink-thin" stroke-dasharray="4 4"/><text x="215.403" y="204.667" text-anchor="end" class="lbl-sm">P sin α</text><text x="287.128" y="251.846" text-anchor="start" class="lbl-sm">P cos α</text></svg>