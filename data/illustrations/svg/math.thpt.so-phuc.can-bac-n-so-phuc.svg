ircle cx="236.464" cy="312.225" r="3.6" class="accent-a"/><text x="241.717" y="332.393" text-anchor="middle" class="lbl-sm">z<tspan font-size="70%" dy="4">4</tspan></text><circle cx="200" cy="200" r="3" class="ink"/><text x="200" y="391" text-anchor="middle" class="lbl-sm">n = 5 căn cách đều nhau góc 2π/n trên đường tròn bán kính</text><text x="200" y="406" text-anchor="middle" class="lbl-sm">ⁿ√r</text></svg>