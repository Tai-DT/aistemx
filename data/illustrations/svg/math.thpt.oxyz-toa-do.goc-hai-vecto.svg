<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" role="img" aria-label="Vectơ trong không gian Oxyz"><title>Vectơ trong không gian Oxyz</title><desc>Tích có hướng và ứng dụng hình học trong không gian Oxyz.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="460" height="320"/><line x1="140" y1="190" x2="300" y2="170" class="accent-a" stroke-width="2.5"/><polygon points="300,170 293.621,174.828 292.629,166.89" class="accent-a" stroke="none" fill-opacity="1"/><line x1="140" y1="190" x2="240" y2="80" class="accent-a" stroke-width="2.5"/><polygon points="240,80 238.299,87.817 232.38,82.436" class="accent-a" stroke="none" fill-opacity="1"/><circle cx="140" cy="190" r="3.5" class="accent-a"/><path d="M 175.0 186.0 A 35 35 0 0 0 160.0 162.0" class="accent-b" fill="none" stroke-width="1.8"/><text x="182" y="172" text-anchor="start" class="lbl">φ</text><text x="308" y="170" text-anchor="start" class="lbl">u⃗</text><text x="244" y="72" text-anchor="start" class="lbl">v⃗</text><text x="230" y="45" text-anchor="middle" class="lbl" font-size="16px">u⃗ · v⃗ = |u⃗|·|v⃗|·cos φ</text><text x="230" y="72" text-anchor="middle" class="lbl-sm">cos φ = (u₁v₁ + u₂v₂ + u₃v₃) / (|u⃗|·|v⃗|)</text></svg>