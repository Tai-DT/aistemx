x="207.565" y="275" text-anchor="middle" class="lbl-sm">1</text><line x1="288.435" y1="256" x2="288.435" y2="261" class="axis"/><text x="288.435" y="275" text-anchor="middle" class="lbl-sm">2</text><line x1="369.304" y1="256" x2="369.304" y2="261" class="axis"/><text x="369.304" y="275" text-anchor="middle" class="lbl-sm">3</text><text x="444" y="292" text-anchor="end" class="lbl">xᵢ</text><line x1="264.174" y1="256" x2="264.174" y2="40" class="accent-c" stroke-dasharray="5 4" stroke-width="2"/><text x="270.174" y="36" text-anchor="start" class="lbl">x̄ = 1,7</text><text x="126.696" y="206.25" text-anchor="middle" class="lbl-sm">0,1</text><text x="207.565" y="118.75" text-anchor="middle" class="lbl-sm">0,3</text><text x="288.435" y="75" text-anchor="middle" class="lbl-sm">0,4</text><text x="369.304" y="162.5" text-anchor="middle" class="lbl-sm">0,2</text></svg>