<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-label="Thí nghiệm giao thoa khe Y-âng"><title>Thí nghiệm giao thoa khe Y-âng</title><desc>Hai khe hẹp S₁, S₂ cách nhau a, màn cách hai khe D. Vân sáng tại x = ki, khoảng vân i = λD/a.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="520" height="320"/><circle cx="45" cy="160" r="3.5" class="accent-a"/><text x="37" y="152" text-anchor="start" class="lbl">S</text><line x1="135" y1="25" x2="135" y2="138" class="ink" stroke-width="3"/><line x1="135" y1="182" x2="135" y2="295" class="ink" stroke-width="3"/><circle cx="135" cy="138" r="2.6" class="accent-a"/><circle cx="135" cy="182" r="2.6" class="accent-a"/><text x="121" y="132" text-anchor="start" class="lbl-sm">S₁</text><text x="121" y="196" text-anchor="start" class="lbl-sm">S₂</text><line x1="113" y1="138" x2="113" y2="182" class="ink-thin"/><line x1="109" y1="138" x2="117" y2="138" class="ink-thin"/><line x1="109" y1="182" x2="117" y2="182" class="ink-thin"/><text x="107" y="164" text-anchor="end" class="lbl-sm">a</text><line x1="420" y1="20" x2="420" y2="300" class="ink" stroke-width="2.5"/><text x="428" y="32" text-anchor="start" class="lbl-sm">Màn E</text><line x1="135" y1="305" x2="420" y2="305" class="axis"/><line x1="135" y1="300" x2="135" y2="310" class="axis"/><line x1="420" y1="300" x2="420" y2="310" class="axis"/><text x="277.5" y="298" text-anchor="middle" class="lbl-sm">D (khoảng cách khe – màn)</text><circle cx="420" cy="160" r="3" class="accent-b"/><text x="428" y="164" text-anchor="start" class="lbl-sm">O (vân trung tâm)</text><circle cx="420" cy="110" r="3.5" class="accent-a"/><text x="428" y="104" text-anchor="start" class="lbl-sm">M (vân tối thứ 3)</text><line x1="135" y1="138" x2="420" y2="110" class="accent-c" stroke-width="1.5"/><line x1="135" y1="182" x2="420" y2="110" class="accent-c" stroke-width="1.5"/><text x="262.5" y="116" text-anchor="start" class="lbl-sm">d₁</text><text x="287.5" y="158" text-anchor="start" class="lbl-sm">d₂</text><line x1="408" y1="160" x2="408" y2="110" class="accent-b" stroke-dasharray="3 2"/><text x="404" y="139" text-anchor="end" class="lbl-sm">x</text><line x1="420" y1="60" x2="442" y2="60" class="accent-b" stroke-width="3"/><line x1="420" y1="70" x2="432" y2="70" class="ink-thin" stroke-width="1" opacity="0.35"/><line x1="420" y1="80" x2="442" y2="80" class="accent-b" stroke-width="3"/><line x1="420" y1="90" x2="432" y2="90" class="ink-thin" stroke-width="1" opacity="0.35"/><line x1="420" y1="100" x2="442" y2="100" class="accent-b" stroke-width="3"/><line x1="420" y1="110" x2="432" y2="110" class="ink-thin" stroke-width="1" opacity="0.35"/><line x1="420" y1="120" x2="442" y2="120" class="accent-b" stroke-width="3"/><line x1="420" y1="130" x2="432" y2="130" class="ink-thin" stroke-width="1" opacity="0.35"/><line x1="420" y1="140" x2="442" y2="140" class="accent-b" stroke-width="3"/><line x1="420" y1="150" x2="432" y2="150" class="ink-thin" stroke-width="1" opacity="0.35"/><line x1="420" y1="160" x2="442" y2="160" class="accent-b" stroke-width="3"/><line x1="420" y1="170" x2="432" y2="170" class="ink-thin" stroke-width="1" opacity="0.35"/><line x1="420" y1="180" x2="442" y2="180" class="accent-b" stroke-width="3"/><line x1="420" y1="190" x2="432" y2="190" class="ink-thin" stroke-width="1" opacity="0.35"/><line x1="420" y1="200" x2="442" y2="200" class="accent-b" stroke-width="3"/><line x1="420" y1="210" x2="432" y2="210" class="ink-thin" stroke-width="1" opacity="0.35"/><line x1="420" y1="220" x2="442" y2="220" class="accent-b" stroke-width="3"/><line x1="420" y1="230" x2="432" y2="230" class="ink-thin" stroke-width="1" opacity="0.35"/><line x1="420" y1="240" x2="442" y2="240" class="accent-b" stroke-width="3"/><line x1="420" y1="250" x2="432" y2="250" class="ink-thin" stroke-width="1" opacity="0.35"/><line x1="420" y1="260" x2="442" y2="260" class="accent-b" stroke-width="3"/><line x1="448" y1="160" x2="448" y2="180" class="ink-thin"/><line x1="444" y1="160" x2="452" y2="160" class="ink-thin"/><line x1="444" y1="180" x2="452" y2="180" class="ink-thin"/><text x="456" y="174" text-anchor="