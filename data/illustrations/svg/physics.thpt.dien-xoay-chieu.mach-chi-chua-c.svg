<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 256" role="img" aria-label="Mạch xoay chiều nối tiếp"><title>Mạch xoay chiều nối tiếp</title><desc>Nguồn điện xoay chiều nối tiếp với C.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="330" height="256"/><line x1="74" y1="74" x2="171" y2="74" class="ink"/><line x1="187" y1="74" x2="284" y2="74" class="ink"/><line x1="74" y1="74" x2="74" y2="120" class="ink"/><line x1="74" y1="154" x2="74" y2="200" class="ink"/><line x1="284" y1="74" x2="284" y2="200" class="ink"/><line x1="74" y1="200" x2="284" y2="200" class="ink"/><circle cx="74" cy="137" r="17" class="ink"/><path d="M 64.65 137 C 68.39 122.975, 71.195 122.975, 74 137 C 76.805 151.025, 79.61 151.025, 83.35 137" class="ink"/><text x="49" y="142" text-anchor="end" class="lbl">u</text><line x1="175" y1="61" x2="175" y2="87" class="ink"/><line x1="183" y1="61" x2="183" y2="87" class="ink"/><text x="179" y="54" text-anchor="middle" class="lbl">C</text><text x="179" y="100" text-anchor="middle" class="lbl-sm">u_C</text><line x1="86" y1="74" x2="118" y2="74" class="accent-b" style="stroke-width:2.2"/><polygon points="118,74 111.072,78 111.072,70" class="accent-b" stroke="none" fill-opacity="1"/><text x="102" y="48" text-anchor="middle" class="lbl">i</text><text x="165" y="242" text-anchor="middle" class="lbl">u trễ pha π/2 so với i</text></svg>