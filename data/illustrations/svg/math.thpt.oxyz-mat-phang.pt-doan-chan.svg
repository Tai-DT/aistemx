<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" role="img" aria-label="Mặt phẳng trong không gian Oxyz"><title>Mặt phẳng trong không gian Oxyz</title><desc>Phương trình tổng quát mặt phẳng và khoảng cách trong Oxyz.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="460" height="320"/><line x1="150" y1="210" x2="150" y2="30" class="axis" stroke-width="2.5"/><polygon points="150,30 153.5,36.062 146.5,36.062" class="axis" stroke="none" fill-opacity="1"/><text x="158" y="35" text-anchor="start" class="lbl-sm">z</text><line x1="150" y1="210" x2="420" y2="210" class="axis" stroke-width="2.5"/><polygon points="420,210 413.938,213.5 413.938,206.5" class="axis" stroke="none" fill-opacity="1"/><text x="425" y="202" text-anchor="start" class="lbl-sm">y</text><line x1="150" y1="210" x2="60" y2="280" class="axis" stroke-width="2.5"/><polygon points="60,280 62.636,273.515 66.934,279.041" class="axis" stroke="none" fill-opacity="1"/><text x="48" y="292" text-anchor="start" class="lbl-sm">x</text><text x="136" y="225" text-anchor="start" class="lbl">O</text><polygon points="95,252 330,210 150,65" class="fill-c"/><line x1="95" y1="252" x2="330" y2="210" class="accent-c" stroke-width="2"/><line x1="330" y1="210" x2="150" y2="65" class="accent-c" stroke-width="2"/><line x1="150" y1="65" x2="95" y2="252" class="accent-c" stroke-width="2"/><circle cx="95" cy="252" r="3.5" class="accent-b"/><circle cx="330" cy="210" r="3.5" class="accent-b"/><circle cx="150" cy="65" r="3.5" class="accent-b"/><text x="87" y="268" text-anchor="start" class="lbl-sm">A(a,0,0)</text><text x="334" y="226" text-anchor="start" class="lbl-sm">B(0,b,0)</text><text x="158" y="65" text-anchor="start" class="lbl-sm">C(0,0,c)</text><text x="270" y="45" text-anchor="start" class="lbl" font-size="16px">x/a + y/b + z/c = 1</text><text x="270" y="70" text-anchor="start" class="lbl-sm">Phương trình mặt phẳng đoạn chắn</text></svg>