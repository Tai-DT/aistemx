<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" role="img" aria-label="Quy tắc đòn bẩy và hợp lực"><title>Quy tắc đòn bẩy và hợp lực</title><desc>Điều kiện cân bằng đòn bẩy F₁·d₁ = F₂·d₂.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="460" height="320"/><text x="230" y="35" text-anchor="middle" class="lbl" font-size="16px">F₁ · d₁ = F₂ · d₂   hay   F₁ / F₂ = d₂ / d₁</text><text x="230" y="60" text-anchor="middle" class="lbl-sm">Quy tắc mômen lực cho đòn bẩy</text><polygon points="210,180 192,212 228,212" class="fill-a"/><polyline points="210,180 192,212 228,212 210,180" class="ink" fill="none"/><circle cx="210" cy="180" r="4" class="accent-a"/><text x="210" y="226" text-anchor="middle" class="lbl-sm">Điểm tựa O</text><line x1="70" y1="180" x2="390" y2="180" class="ink" stroke-width="6" stroke-linecap="round"/><circle cx="70" cy="180" r="4" class="accent-a"/><circle cx="390" cy="180" r="4" class="accent-a"/><text x="60" y="168" text-anchor="start" class="lbl">A</text><text x="398" y="168" text-anchor="start" class="lbl">B</text><line x1="70" y1="180" x2="70" y2="270" class="accent-b" stroke-width="2.5"/><polygon points="70,270 66,263.072 74,263.072" class="accent-b" stroke="none" fill-opacity="1"/><text x="58" y="285" text-anchor="start" class="lbl-sm">F⃗₁ (Tải)</text><line x1="390" y1="180" x2="390" y2="250" class="accent-c" stroke-width="2.5"/><polygon points="390,250 386,243.072 394,243.072" class="accent-c" stroke="none" fill-opacity="1"/><text x="380" y="265" text-anchor="start" class="lbl-sm">F⃗₂ (Lực tác dụng)</text><line x1="70" y1="155" x2="210" y2="155" class="accent-b" stroke-width="1.8"/><line x1="210" y1="155" x2="390" y2="155" class="accent-c" stroke-width="1.8"/><line x1="90" y1="155" x2="70" y2="155" class="accent-b" stroke-width="2.5"/><polygon points="70,155 74.33,152.5 74.33,157.5" class="accent-b" stroke="none" fill-opacity="1"/><line x1="190" y1="155" x2="210" y2="155" class="accent-b" stroke-width="2.5"/><polygon points="210,155 205.67,157.5 205.67,152.5" class="accent-b" stroke="none" fill-opacity="1"/><line x1="230" y1="155" x2="210" y2="155" class="accent-c" stroke-width="2.5"/><polygon points="210,155 214.33,152.5 214.33,157.5" class="accent-c" stroke="none" fill-opacity="1"/><line x1="370" y1="155" x2="390" y2="155" class="accent-c" stroke-width="2.5"/><polygon points="390,155 385.67,157.5 385.67,152.5" class="accent-c" stroke="none" fill-opacity="1"/><text x="140" y="148" text-anchor="middle" class="lbl">d₁</text><text x="300" y="148" text-anchor="middle" class="lbl">d₂</text><text x="230" y="300" text-anchor="middle" class="lbl-sm">Nếu d₂ &gt; d₁ thì F₂ &lt; F₁ (Được lợi về lực)</text></svg>