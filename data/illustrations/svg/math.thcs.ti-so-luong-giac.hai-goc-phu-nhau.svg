<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 420" role="img" aria-label="Cung liên kết (doi) trên đường tròn lượng giác"><title>Cung liên kết (doi) trên đường tròn lượng giác</title><desc>Hai điểm liên kết trên đường tròn đơn vị cùng hình chiếu của chúng lên hai trục.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
