<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-label="Đường tần số tích luỹ"><title>Đường tần số tích luỹ</title><desc>Đường tần số tích luỹ và cách đọc trung vị, tứ phân vị từ đồ thị.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="480" height="330"/><line x1="66" y1="260" x2="66" y2="24" class="axis"/><line x1="61" y1="254" x2="66" y2="254" class="axis"/><text x="57" y="258" text-anchor="end" class="lbl-sm">0</text><line x1="66" y1="209.357" x2="438" y2="209.357" class="grid"/><line x1="61" y1="209.357" x2="66" y2="209.357" class="axis"/><text x="57" y="213.357" text-anchor="end" class="lbl-sm">10</text><line x1="66" y1="164.714" x2="438" y2="164.714" class="grid"/><line x1="61" y1="164.714" x2="66" y2="164.714" class="axis"/><text x="57" y="168.714" text-anchor="end" class="lbl-sm">20</text><line x1="66" y1="120.071" x2="438" y2="120.071" class="grid"/><line x1="61" y1="120.071" x2="66" y2="120.071" class="axis"/><text x="57" y="124.071" text-anchor="end" class="lbl-sm">30</text><line x1="66" y1="75.429" x2="438" y2="75.429" class="grid"/><line x1="61" y1="75.429" x2="66" y2="75.429" class="axis"/><text x="57" y="79.429" text-anchor="end" class="lbl-sm">40</text><text x="30" y="18" text-anchor="start" class="lbl-sm">tần số tích luỹ</text><line x1="60" y1="254" x2="448" y2="254" class="axis"/><line x1="79.527" y1="254" x2="79.527" y2="259" class="axis"/><text x="79.527" y="273" text-anchor="middle" class="lbl-sm">0</text><line x1="147.164" y1="254" x2="147.164" y2="259" class="axis"/><text x="147.164" y="273" text-anchor="middle" class="lbl-sm">10</text><line x1="214.8" y1="254" x2="214.8" y2="259" class="axis"/><text x="214.8" y="273" text-anchor="middle" class="lbl-sm">20</text><line x1="282.436" y1="254" x2="282.436" y2="259" class="axis"/><text x="282.436" y="273" text-anchor="middle" class="lbl-sm">30</text><line x1="350.073" y1="254" x2="350.073" y2="259" class="axis"/><text x="350.073" y="273" text-anchor="middle" class="lbl-sm">40</text><line x1="417.709" y1="254" x2="417.709" y2="259" class="axis"/><text x="417.709" y="273" text-anchor="middle" class="lbl-sm">50</text><text x="448" y="290" text-anchor="end" class="lbl">giá trị</text><polyline points="79.527,254 147.164,236.143 214.8,195.964 282.436,129 350.073,84.357 417.709,57.571" class="curve" fill="none"/><circle cx="79.527" cy="254" r="3" class="accent-a"/><circle cx="147.164" cy="236.143" r="3" class="accent-a"/><circle cx="214.8" cy="195.964" r="3" class="accent-a"/><circle cx="282.436" cy="129" r="3" class="accent-a"/><circle cx="350.073" cy="84.357" r="3" class="accent-a"/><circle cx="417.709" cy="57.571" r="3" class="accent-a"/><line x1="66" y1="204.893" x2="199.77" y2="204.893" class="accent-b" stroke-dasharray="5 4" stroke-width="1.5"/><line x1="199.77" y1="204.893" x2="199.77" y2="254" class="accent-b" stroke-dasharray="5 4" stroke-width="1.5"/><circle cx="199.77" cy="204.893" r="3.4" class="accent-b"/><text x="191.77" y="196.893" text-anchor="end" class="lbl-sm">Q₁ ≈ 17,8</text><line x1="66" y1="155.786" x2="255.382" y2="155.786" class="accent-b" stroke-dasharray="5 4" stroke-width="1.5"/><line x1="255.382" y1="155.786" x2="255.382" y2="254" class="accent-b" stroke-dasharray="5 4" stroke-width="1.5"/><circle cx="255.382" cy="155.786" r="3.4" class="accent-b"/><text x="247.382" y="147.786" text-anchor="end" class="lbl-sm">Q₂ ≈ 26</text><line x1="66" y1="106.679" x2="316.255" y2="106.679" class="accent-b" stroke-dasharray="5 4" stroke-width="1.5"/><line x1="316.255" y1="106.679" x2="316.255" y2="254" class="accent-b" stroke-dasharray="5 4" stroke-width="1.5"/><circle cx="316.255" cy="106.679" r="3.4" class="accent-b"/><text x="308.255" y="98.679" text-anchor="end" class="lbl-sm">Q₃ ≈ 35</text></svg>