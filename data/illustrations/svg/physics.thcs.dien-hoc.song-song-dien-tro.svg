<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 414 262" role="img" aria-label="Mạch điện song song"><title>Mạch điện song song</title><desc>Sơ đồ mạch điện: nguồn một chiều và các điện trở R₁, R₂, R₃ mắc song song.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="414" height="262"/><line x1="66" y1="66" x2="354" y2="66" class="ink"/><line x1="66" y1="208" x2="354" y2="208" class="ink"/><line x1="66" y1="66" x2="66" y2="121" class="ink"/><line x1="66" y1="153" x2="66" y2="208" class="ink"/><line x1="53" y1="131" x2="79" y2="131" class="ink"/><line x1="59" y1="143" x2="73" y2="143" class="ink" style="stroke-width:4"/><text x="47" y="135" text-anchor="end" class="lbl-sm">+</text><text x="47" y="148" text-anchor="end" class="lbl-sm">−</text><text x="87" y="142" text-anchor="start" class="lbl">U</text><line x1="138" y1="66" x2="138" y2="114" class="ink"/><line x1="138" y1="160" x2="138" y2="208" class="ink"/><rect x="129" y="114" width="18" height="46" class="ink"/><text x="154" y="142" text-anchor="start" class="lbl">R₁</text><circle cx="138" cy="66" r="3" class="accent-a"/><circle cx="138" cy="208" r="3" class="accent-a"/><line x1="210" y1="66" x2="210" y2="114" class="ink"/><line x1="210" y1="160" x2="210" y2="208" class="ink"/><rect x="201" y="114" width="18" height="46" class="ink"/><text x="226" y="142" text-anchor="start" class="lbl">R₂</text><circle cx="210" cy="66" r="3" class="accent-a"/><circle cx="210" cy="208" r="3" class="accent-a"/><line x1="282" y1="66" x2="282" y2="114" class="ink"/><line x1="282" y1="160" x2="282" y2="208" class="ink"/><rect x="273" y="114" width="18" height="46" class="ink"/><text x="298" y="142" text-anchor="start" class="lbl">R₃</text><circle cx="282" cy="66" r="3" class="accent-a"/><circle cx="282" cy="208" r="3" class="accent-a"/><line x1="78" y1="66" x2="110" y2="66" class="accent-b" style="stroke-width:2.2"/><polygon points="110,66 103.072,70 103.072,62" class="accent-b" stroke="none" fill-opacity="1"/><text x="94" y="57" text-anchor="middle" class="lbl">I</text><line x1="354" y1="66" x2="354" y2="208" class="ink"/><text x="368" y="142" text-anchor="start" class="lbl">U</text><text x="207" y="248" text-anchor="middle" class="lbl">1/R_tđ = 1/R₁ + 1/R₂ + 1/R₃</text></svg>