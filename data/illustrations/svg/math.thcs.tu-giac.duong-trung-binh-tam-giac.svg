<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 339.857" role="img" aria-label="Định lí Ta-lét trong tam giác"><title>Định lí Ta-lét trong tam giác</title><desc>MN song song với BC nên AM/AB = AN/AC = MN/BC.</desc><style>@media (prefers-color-scheme: dark){
