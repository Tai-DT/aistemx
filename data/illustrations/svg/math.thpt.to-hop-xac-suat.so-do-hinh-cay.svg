<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" role="img" aria-label="Sơ đồ cây xác suất"><title>Sơ đồ cây xác suất</title><desc>Sơ đồ hình cây cho phép thử gồm hai giai đoạn.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="500" height="230"/><circle cx="40" cy="130" r="4" class="accent-a"/><line x1="40" y1="130" x2="176" y2="86" class="ink"/><circle cx="176" cy="86" r="3.6" class="accent-a"/><text x="184" y="80" text-anchor="start" class="lbl">A</text><text x="108" y="103" text-anchor="middle" class="lbl-sm">0,6</text><line x1="176" y1="86" x2="330" y2="64" class="ink"/><circle cx="330" cy="64" r="3.6" class="accent-a"/><text x="338" y="68" text-anchor="start" class="lbl">B</text><text x="253" y="70" text-anchor="middle" class="lbl-sm">0,7</text><text x="484" y="68" text-anchor="end" class="lbl-sm">0,42</text><line x1="176" y1="86" x2="330" y2="108" class="ink"/><circle cx="330" cy="108" r="3.6" class="accent-a"/><text x="338" y="112" text-anchor="start" class="lbl">B̄</text><text x="253" y="92" text-anchor="middle" class="lbl-sm">0,3</text><text x="484" y="112" text-anchor="end" class="lbl-sm">0,18</text><line x1="40" y1="130" x2="176" y2="174" class="ink"/><circle cx="176" cy="174" r="3.6" class="accent-a"/><text x="184" y="168" text-anchor="start" class="lbl">Ā</text><text x="108" y="147" text-anchor="middle" class="lbl-sm">0,4</text><line x1="176" y1="174" x2="330" y2="152" class="ink"/><circle cx="330" cy="152" r="3.6" class="accent-a"/><text x="338" y="156" text-anchor="start" class="lbl">B</text><text x="253" y="158" text-anchor="middle" class="lbl-sm">0,2</text><text x="484" y="156" text-anchor="end" class="lbl-sm">0,08</text><line x1="176" y1="174" x2="330" y2="196" class="ink"/><circle cx="330" cy="196" r="3.6" class="accent-a"/><text x="338" y="200" text-anchor="start" class="lbl">B̄</text><text x="253" y="180" text-anchor="middle" class="lbl-sm">0,8</text><text x="484" y="200" text-anchor="end" class="lbl-sm">0,32</text><text x="484" y="30" text-anchor="end" class="lbl-sm">tích dọc nhánh</text></svg>