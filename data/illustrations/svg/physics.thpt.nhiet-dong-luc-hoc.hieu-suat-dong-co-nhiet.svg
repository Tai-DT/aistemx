<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 330" role="img" aria-label="Động cơ nhiệt"><title>Động cơ nhiệt</title><desc>Sơ đồ trao đổi nhiệt giữa nguồn nóng, tác nhân và nguồn lạnh.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="380" height="330"/><rect x="42" y="26" width="216" height="44" class="fill-b"/><rect x="42" y="26" width="216" height="44" class="ink"/><text x="150" y="54" text-anchor="middle" class="lbl-sm">nguồn nóng  T₁</text><rect x="42" y="250" width="216" height="44" class="fill-a"/><rect x="42" y="250" width="216" height="44" class="ink"/><text x="150" y="278" text-anchor="middle" class="lbl-sm">nguồn lạnh  T₂</text><circle cx="150" cy="160" r="44" class="ink"/><text x="150" y="165" text-anchor="middle" class="lbl-sm">động cơ</text><line x1="150" y1="74" x2="150" y2="114" class="accent-b" style="stroke-width:2.6"/><polygon points="150,114 145,105.34 155,105.34" class="accent-b" stroke="none" fill-opacity="1"/><line x1="150" y1="206" x2="150" y2="246" class="accent-a" style="stroke-width:2.6"/><polygon points="150,246 145,237.34 155,237.34" class="accent-a" stroke="none" fill-opacity="1"/><line x1="196" y1="160" x2="354" y2="160" class="accent-c" style="stroke-width:2.6"/><polygon points="354,160 345.34,165 345.34,155" class="accent-c" stroke="none" fill-opacity="1"/><text x="160" y="96" text-anchor="start" class="lbl-sm">Q₁ (nhận)</text><text x="160" y="232" text-anchor="start" class="lbl-sm">Q₂ (nhả)</text><text x="350" y="150" text-anchor="end" class="lbl-sm">A′ (sinh công)</text><text x="190" y="318" text-anchor="middle" class="lbl-sm">H = A′ / Q₁ = 1 − |Q₂| / Q₁</text></svg>