<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-label="Sơ đồ pin điện hoá"><title>Sơ đồ pin điện hoá</title><desc>Hai cốc dung dịch nối nhau bằng cầu muối; điện cực Zn là anot (cực âm, xảy ra oxi hoá), điện cực Cu là catot (cực dương, xảy ra khử); electron đi trong dây dẫn ngoài từ anot sang catot.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="480" height="330"/><polyline points="46,132 46,286 206,286 206,132" class="ink" fill="none"/><rect x="48" y="176" width="156" height="108" class="fill-a"/><polyline points="274,132 274,286 434,286 434,132" class="ink" fill="none"/><rect x="276" y="176" width="156" height="108" class="fill-a"/><rect x="99" y="108" width="22" height="132" class="ink"/><text x="110" y="100" text-anchor="middle" class="lbl">Zn</text><rect x="339" y="108" width="22" height="132" class="ink"/><text x="350" y="100" text-anchor="middle" class="lbl">Cu</text><polyline points="110,108 110,62 206,62" class="ink" fill="none"/><polyline points="254,62 350,62 350,108" class="ink" fill="none"/><circle cx="230" cy="62" r="24" class="ink"/><text x="230" y="67" text-anchor="middle" class="lbl">V</text><line x1="150" y1="48" x2="196" y2="48" class="accent-b" stroke-width="2.5"/><polygon points="196,48 189.072,52 189.072,44" class="accent-b" stroke="none" fill-opacity="1"/><text x="173" y="40" text-anchor="middle" class="lbl">e⁻</text><path d="M 150 192 L 150 156 L 310 156 L 310 192" class="ink" stroke-width="6" stroke-opacity="0.35"/><text x="230" y="150" text-anchor="middle" class="lbl-sm">cầu muối</text><line x1="258" y1="172" x2="198" y2="172" class="accent-c" stroke-width="2.5"/><polygon points="198,172 204.062,168.5 204.062,175.5" class="accent-c" stroke="none" fill-opacity="1"/><text x="264" y="176" text-anchor="start" class="lbl-sm">anion</text><text x="126" y="300" text-anchor="middle" class="lbl-sm">anot (−) — oxi hoá</text><text x="354" y="300" text-anchor="middle" class="lbl-sm">catot (+) — khử</text><text x="126" y="318" text-anchor="middle" class="lbl">Zn → Zn²⁺ + 2e⁻</text><text x="354" y="318" text-anchor="middle" class="lbl">Cu²⁺ + 2e⁻ → Cu</text><text x="126" y="264" text-anchor="middle" class="lbl">Zn²⁺</text><text x="354" y="264" text-anchor="middle" class="lbl">Cu²⁺</text><text x="230" y="24" text-anchor="middle" class="lbl-sm">E pin = E catot − E anot &gt; 0</text></svg>