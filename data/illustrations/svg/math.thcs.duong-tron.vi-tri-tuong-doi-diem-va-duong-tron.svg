<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 382 382" role="img" aria-label="Vị trí tương đối của điểm và đường tròn"><title>Vị trí tương đối của điểm và đường tròn</title><desc>Điểm M nằm trong, nằm trên hay nằm ngoài đường tròn tuỳ theo OM nhỏ hơn, bằng hay lớn hơn R.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="382" height="382"/><circle cx="191" cy="191" r="93.103" class="fill-a"/><circle cx="191" cy="191" r="93.103" class="ink"/><circle cx="191" cy="191" r="3" class="accent-b"/><line x1="191" y1="191" x2="150.685" y2="167.724" class="ink-thin" stroke-dasharray="3 3" stroke-width="1.2"/><circle cx="150.685" cy="167.724" r="3.4" class="accent-b"/><text x="138.561" y="165.224" text-anchor="middle" class="lbl">M₁</text><text x="116.044" y="152.224" text-anchor="middle" class="lbl-sm">OM &lt; R</text><line x1="191" y1="191" x2="271.63" y2="144.448" class="ink-thin" stroke-dasharray="3 3" stroke-width="1.2"/><circle cx="271.63" cy="144.448" r="3.4" class="accent-b"/><text x="283.754" y="141.948" text-anchor="middle" class="lbl">M₂</text><text x="306.271" y="128.948" text-anchor="middle" class="lbl-sm">OM = R</text><line x1="191" y1="191" x2="224.875" y2="309.136" class="ink-thin" stroke-dasharray="3 3" stroke-width="1.2"/><circle cx="224.875" cy="309.136" r="3.4" class="accent-b"/><text x="228.734" y="327.093" text-anchor="middle" class="lbl">M₃</text><text x="235.9" y="352.086" text-anchor="middle" class="lbl-sm">OM &gt; R</text><text x="179" y="199.5" text-anchor="end" class="lbl-sm">O</text></svg>