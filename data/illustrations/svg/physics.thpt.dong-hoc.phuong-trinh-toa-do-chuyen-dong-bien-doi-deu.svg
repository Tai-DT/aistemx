<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 436" role="img" aria-label="Đồ thị x - t, v - t, a - t"><title>Đồ thị x - t, v - t, a - t</title><desc>Ba đồ thị chuyển động thẳng biến đổi đều dóng cùng một trục thời gian.</desc><style>@media (prefers-color-scheme: dark){
