<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 372" role="img" aria-label="Dây cung và khoảng cách tới tâm"><title>Dây cung và khoảng cách tới tâm</title><desc>Đường tròn (O; R) với dây AB; OI vuông góc với dây tại trung điểm I, OI = d = 1.5.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="372" height="372"/><circle cx="186" cy="186" r="130" class="ink"/><line x1="73.417" y1="251" x2="298.583" y2="251" class="accent-a" stroke-width="2.6"/><line x1="186" y1="186" x2="186" y2="251" class="accent-b" stroke-dasharray="5 4" stroke-width="1.8"/><line x1="186" y1="186" x2="94.076" y2="94.076" class="ink-thin"/><polyline points="186,240 197,240 197,251" class="ink-thin" fill="none"/><circle cx="186" cy="186" r="3" class="accent-b"/><circle cx="186" cy="251" r="2.8" class="accent-b"/><line x1="129.708" y1="245" x2="129.708" y2="257" class="ink-thin"/><line x1="242.292" y1="245" x2="242.292" y2="257" class="ink-thin"/><text x="60.426" y="263" text-anchor="middle" class="lbl">A</text><text x="311.574" y="263" text-anchor="middle" class="lbl">B</text><text x="199" y="182.5" text-anchor="start" class="lbl-sm">O</text><text x="197" y="270.5" text-anchor="middle" class="lbl-sm">I</text><text x="175" y="223" text-anchor="end" class="lbl">d = 1.5</text><text x="129.387" y="137.084" text-anchor="middle" class="lbl">R</text></svg>