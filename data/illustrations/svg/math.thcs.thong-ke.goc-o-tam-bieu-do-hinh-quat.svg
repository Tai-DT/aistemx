<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 300" role="img" aria-label="Biểu đồ hình quạt tròn"><title>Biểu đồ hình quạt tròn</title><desc>Biểu đồ hình quạt tròn với góc ở tâm của từng nhóm.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="470" height="300"/><text x="20" y="28" text-anchor="start" class="lbl-sm">Góc ở tâm: αᵢ = nᵢ/N · 360°</text><path d="M 140,156 L 140,56 A 100 100 0 0 1 198.779,236.902 Z" class="fill-a"/><path d="M 140,156 L 140,56 A 100 100 0 0 1 198.779,236.902 Z" class="ink-thin"/><rect x="300" y="56" width="13" height="13" class="fill-a"/><rect x="300" y="56" width="13" height="13" class="ink-thin"/><text x="320" y="66" text-anchor="start" class="lbl-sm">nhóm 1: n = 12, α = 144°</text><path d="M 140,156 L 198.779,236.902 A 100 100 0 0 1 53.397,206 Z" class="fill-b"/><path d="M 140,156 L 198.779,236.902 A 100 100 0 0 1 53.397,206 Z" class="ink-thin"/><rect x="300" y="80" width="13" height="13" class="fill-b"/><rect x="300" y="80" width="13" height="13" class="ink-thin"/><text x="320" y="90" text-anchor="start" class="lbl-sm">nhóm 2: n = 8, α = 96°</text><path d="M 140,156 L 53.397,206 A 100 100 0 0 1 65.686,89.087 Z" class="fill-c"/><path d="M 140,156 L 53.397,206 A 100 100 0 0 1 65.686,89.087 Z" class="ink-thin"/><rect x="300" y="104" width="13" height="13" class="fill-c"/><rect x="300" y="104" width="13" height="13" class="ink-thin"/><text x="320" y="114" text-anchor="start" class="lbl-sm">nhóm 3: n = 6, α = 72°</text><path d="M 140,156 L 65.686,89.087 A 100 100 0 0 1 140,56 Z" class="fill-a" style="opacity:.48"/><path d="M 140,156 L 65.686,89.087 A 100 100 0 0 1 140,56 Z" class="ink-thin"/><rect x="300" y="128" width="13" height="13" class="fill-a" style="opacity:.48"/><rect x="300" y="128" width="13" height="13" class="ink-thin"/><text x="320" y="138" text-anchor="start" class="lbl-sm">nhóm 4: n = 4, α = 48°</text><circle cx="140" cy="156" r="100" class="ink"/><text x="140" y="282" text-anchor="middle" class="lbl-sm">N = 30</text></svg>