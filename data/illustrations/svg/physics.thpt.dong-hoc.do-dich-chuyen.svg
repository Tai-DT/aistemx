<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 292" role="img" aria-label="Đồ thị x - t"><title>Đồ thị x - t</title><desc>Đồ thị toạ độ theo thời gian; độ dốc của đồ thị là vận tốc.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="400" height="292"/><line x1="60" y1="26" x2="60" y2="248" class="grid"/><line x1="119.231" y1="26" x2="119.231" y2="248" class="grid"/><text x="119.231" y="233.618" text-anchor="middle" class="lbl-sm">1</text><line x1="178.462" y1="26" x2="178.462" y2="248" class="grid"/><text x="178.462" y="233.618" text-anchor="middle" class="lbl-sm">2</text><line x1="237.692" y1="26" x2="237.692" y2="248" class="grid"/><text x="237.692" y="233.618" text-anchor="middle" class="lbl-sm">3</text><line x1="296.923" y1="26" x2="296.923" y2="248" class="grid"/><text x="296.923" y="233.618" text-anchor="middle" class="lbl-sm">4</text><line x1="356.154" y1="26" x2="356.154" y2="248" class="grid"/><line x1="60" y1="218.618" x2="368" y2="218.618" class="grid"/><line x1="60" y1="132.704" x2="368" y2="132.704" class="grid"/><text x="53" y="136.704" text-anchor="end" class="lbl-sm">5</text><line x1="60" y1="46.791" x2="368" y2="46.791" class="grid"/><text x="53" y="50.791" text-anchor="end" class="lbl-sm">10</text><line x1="60" y1="218.618" x2="376" y2="218.618" class="axis" stroke-width="2.5"/><polygon points="376,218.618 369.938,222.118 369.938,215.118" class="axis" stroke="none" fill-opacity="1"/><line x1="60" y1="248" x2="60" y2="18" class="axis" stroke-width="2.5"/><polygon points="60,18 63.5,24.062 56.5,24.062" class="axis" stroke="none" fill-opacity="1"/><text x="374" y="235.618" text-anchor="end" class="lbl-sm">t (s)</text><text x="56" y="14" text-anchor="middle" class="lbl-sm">x (m)</text><polyline points="60,184.252 356.154,55.382" class="curve" fill="none"/><circle cx="60" cy="184.252" r="3.2" class="accent-a"/><circle cx="356.154" cy="55.382" r="3.2" class="accent-a"/><line x1="60" y1="184.252" x2="360" y2="184.252" class="ink-thin" stroke-dasharray="4 4"/><line x1="60" y1="55.382" x2="360" y2="55.382" class="ink-thin" stroke-dasharray="4 4"/><text x="53" y="188.252" text-anchor="end" class="lbl">x<tspan dy="4" font-size="10">1</tspan></text><text x="53" y="59.382" text-anchor="end" class="lbl">x<tspan dy="4" font-size="10">2</tspan></text><line x1="352" y1="184.252" x2="352" y2="55.382" class="accent-b" stroke-width="1.3"/><polygon points="352,55.382 355.052,61.122 348.948,61.122" class="accent-b" stroke="none" fill-opacity="1"/><polygon points="352,184.252 348.948,178.513 355.052,178.513" class="accent-b" stroke="none" fill-opacity="1"/><text x="346" y="123.817" text-anchor="end" class="lbl">d</text></svg>