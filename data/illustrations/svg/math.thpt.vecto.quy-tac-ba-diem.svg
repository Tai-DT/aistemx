<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 333.8 275.8" role="img" aria-label="Cộng hai vectơ"><title>Cộng hai vectơ</title><desc>Tổng hai vectơ dựng theo quy tắc hình bình hành hoặc quy tắc ba điểm.</desc><style>@media (prefers-color-scheme: dark){
  :root{--ill-ink:#e5e9f0;--ill-axis:#9aa5b4;--ill-grid:#3a4656;--ill-muted:#9aa5b4}
}
.ill-bg{fill:var(--ill-bg,transparent)}
.ink{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ink-thin{stroke:var(--ill-ink,#1f2933);fill:none;stroke-width:1;opacity:.55}
.axis{stroke:var(--ill-axis,#6b7280);fill:none;stroke-width:1.5}
.grid{stroke:var(--ill-grid,#d1d5db);fill:none;stroke-width:1;opacity:.5}
.accent-a{stroke:var(--ill-a,#2563eb);fill:var(--ill-a,#2563eb)}
.accent-b{stroke:var(--ill-b,#dc2626);fill:var(--ill-b,#dc2626)}
.accent-c{stroke:var(--ill-c,#16a34a);fill:var(--ill-c,#16a34a)}
.accent-d{stroke:var(--ill-d,#d97706);fill:var(--ill-d,#d97706)}
.fill-a{fill:var(--ill-a,#2563eb);stroke:none;opacity:.2}
.fill-b{fill:var(--ill-b,#dc2626);stroke:none;opacity:.2}
.fill-c{fill:var(--ill-c,#16a34a);stroke:none;opacity:.2}
.curve{stroke:var(--ill-a,#2563eb);fill:none;stroke-width:2.5}
.lbl{fill:var(--ill-ink,#1f2933);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:15px;font-style:italic}
.lbl-sm{fill:var(--ill-muted,#6b7280);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:12px;font-style:normal}</style><rect class="ill-bg" x="0" y="0" width="333.8" height="275.8"/><polygon points="56,207.8 203.2,166.4 253.8,56 106.6,97.4" class="fill-a"/><line x1="203.2" y1="166.4" x2="253.8" y2="56" class="ink-thin" stroke-dasharray="5 4"/><line x1="106.6" y1="97.4" x2="253.8" y2="56" class="ink-thin" stroke-dasharray="5 4"/><line x1="56" y1="207.8" x2="203.2" y2="166.4" class="accent-a" stroke-width="2.5"/><polygon points="203.2,166.4 196.915,172.842 194.479,164.178" class="accent-a" stroke="none" fill-opacity="1"/><line x1="56" y1="207.8" x2="106.6" y2="97.4" class="accent-c" stroke-width="2.5"/><polygon points="106.6,97.4 107.443,106.36 99.262,102.611" class="accent-c" stroke="none" fill-opacity="1"/><text x="210.2" y="161.4" text-anchor="start" class="lbl">u</text><text x="99.6" y="92.4" text-anchor="end" class="lbl">v</text><line x1="56" y1="207.8" x2="253.8" y2="56" class="accent-b" stroke-width="2.5"/><polygon points="253.8,56 249.974,65.239 243.886,57.306" class="accent-b" stroke="none" fill-opacity="1"/><text x="260.8" y="51" text-anchor="start" class="lbl">u + v</text><circle cx="56" cy="207.8" r="3" class="ink"/></svg>