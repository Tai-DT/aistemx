		<script type="text/javascript">
		function parseParams(paramsString, params) {
			paramsString = paramsString.substring(1);
			var firstSeparatorPos = paramsString.indexOf(",");
			if (firstSeparatorPos != -1) {
				params.startNode = paramsString.slice(0, firstSeparatorPos);
				var viewingParamsString = paramsString.slice(firstSeparatorPos + 1);
				var viewingParams = viewingParamsString.split(",");
				if (viewingParams.length >= 3) {
					var startView = {};
					startView["pan"] = viewingParams[0];
					startView["tilt"] = viewingParams[1];
					startView["fov"] = viewingParams[2];
					if (viewingParams.length >= 4) {
						startView["projection"] = viewingParams[3];
					}
					params.startView = startView;
				}
			} else {
				params.startNode = paramsString;
				params.startView = "";
			}
		}
		var params = {};
		parseParams(document.location.hash, params);
		var startNode = params.startNode;
		var startView = params.startView;
		if (("onhashchange" in window) && (!(/MSIE (\d+\.\d+);/.test(navigator.userAgent)))) {
			window.onhashchange = function () {
				parseParams(window.location.hash, params);
				pano.openNext('{' + params.startNode + '}', params.startView);
         	}
	    } else {
        	var lastHash = window.location.hash;
        	window.setInterval(function () {
	           	if (window.location.hash != lastHash) {
   	        		lastHash = window.location.hash;
					parseParams(window.location.hash, params);
					pano.openNext('{' + params.startNode + '}', params.startView);
        	   	}
        	}, 100);
		}
	
			// create the panorama player with the container
			pano=new pano2vrPlayer("container", { webGLFlags: { preserveDrawingBuffer:true } });
			pano.startNode = startNode;
			pano.startView = startView;
			// add the skin object
			skin=new pano2vrSkin(pano);
			// load the configuration
		
			window.addEventListener("load", function() {
				pano.readConfigUrlAsync("pano.xml");
			});
			if (window.navigator.userAgent.match(/iPhone/i)) {
				// fix for white borders, rotation on iPhone
				function iosHfix() {
					window.scrollTo(0, 1);
					document.documentElement.style.setProperty('height', '100vh');
				};
				window.addEventListener('orientationchange', function() {
					setTimeout(iosHfix, 0);
					setTimeout(iosHfix, 200);
					setTimeout(iosHfix, 2000);
				});
			}
		pano.addListener("configloaded", () => {
			custom_for_thumb_menu();
		});

		function custom_for_thumb_menu() {
			var old_ontouchstart = skin._scroll_master__content.ontouchstart;
			skin._scroll_master__content.ontouchstart = function (p_e) {
				old_ontouchstart(p_e);
				skin._scroll_master__content.ontouchmove = null;
				skin._scroll_master__content.ontouchmove = function (e) {
					// debugger;
					e = e || window.event;
					e.preventDefault();
					var t = e.touches;
					var diffX = ((t ? t[0].clientX : e.clientX) - skin._scroll_master.ggDragLastX) * skin._scroll_master.ggHPercentVisible;
					var diffY = ((t ? t[0].clientY : e.clientY) - skin._scroll_master.ggDragLastY);
					skin._scroll_master.ggDragInertiaX = -diffX;
					skin._scroll_master.ggDragInertiaY = -diffY;
					skin._scroll_master.ggDragLastX = t ? t[0].clientX : e.clientX;
					skin._scroll_master.ggDragLastY = t ? t[0].clientY : e.clientY;
					skin._scroll_master.ggScrollByX(-diffX);
					skin._scroll_master.ggScrollByY(-diffY * 0.6);
				}
			}
		}
			pano.addListener("changenode", ()=>{
				let userdata = pano.getNodeUserdata();
				let node_id= userdata.customnodeid ? userdata.customnodeid : userdata.nodeid
				let hash = '#' + node_id;
				if (history.pushState) {
					history.pushState(null, null, hash);
				}
				else {
					window.location.hash = hash;
				}
			});
			 pano.addListener("varchanged_start_intro", () => {
				//let status = pano.getVariableValue("start_intro");
				document.getElementsByClassName("zalo-chat-widget")[0].classList.add("show");
			});
			
		</script>
