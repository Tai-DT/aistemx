		<meta property="og:description" content="TTC World l&#224; &#273;i&#7875;m nh&#7845;n &#273;&#7847;y th&#250; v&#7883; c&#7911;a chu&#7895;i gi&#225; tr&#7883; th&#432;&#417;ng hi&#7879;u TTC v&#7899;i nh&#7919;ng khu vui ch&#417;i n&#7893;i ti&#7871;ng t&#7841;i th&#224;nh ph&#7889; &#272;&#224; L&#7841;t, t&#7881;nh B&#236;nh Thu&#7853;n, t&#7881;nh Kh&#225;nh H&#242;a v&#224; B&#7871;n Tre. C&#225;c khu vui ch&#417;i vinh d&#7921; &#273;&#243;n h&#224;ng tri&#7879;u l&#432;&#7907;t kh&#225;ch m&#7895;i n&#259;m.

TTC World - T&#224; C&#250; &#273;&#432;&#7907;c xem l&#224; &#273;i&#7875;m &#273;&#7871;n sinh th&#225;i, t&#226;m linh c&#7911;a kh&#225;ch th&#7853;p ph&#432;&#417;ng trong v&#224; ngo&#224;i n&#432;&#7899;c. H&#7879; th&#7889;ng c&#225;p treo hi&#7879;n &#273;&#7841;i &#273;&#432;a du kh&#225;ch l&#234;n &#273;&#7881;nh n&#250;i T&#224; C&#250; chi&#234;m b&#225;i t&#432;&#7907;ng Ph&#7853;t Th&#237;ch ca nh&#7853;p ni&#7871;t b&#224;n l&#7853;p k&#7927; l&#7909;c ch&#226;u &#193;; vi&#7871;ng ng&#244;i ch&#249;a Linh S&#417;n Tr&#432;&#7901;ng Th&#7885; linh thi&#234;ng g&#7855;n li&#7873;n v&#7899;i huy&#7873;n t&#237;ch ch&#7919;a b&#7879;nh c&#7911;a ho&#224;ng th&#225;i h&#7853;u T&#249; D&#7909;; th&#432;&#7903;ng ngo&#7841;n c&#7843;nh s&#7855;c thi&#234;n nhi&#234;n h&#249;ng v&#297; v&#224; th&#417; m&#7897;ng. Ngo&#224;i ra, TTC World - T&#224; C&#250; c&#242;n ph&#7909;c v&#7909; &#7849;m th&#7921;c chay cho du kh&#225;ch h&#224;nh h&#432;&#417;ng ngay gi&#7919;a kh&#244;ng gian n&#250;i r&#7915;ng. 



TTC Resort &#8211; D&#7889;c L&#7871;t l&#224; khu ngh&#7881; d&#432;&#7905;ng v&#224; gi&#7843;i tr&#237; t&#7885;a l&#7841;c b&#234;n b&#227;i bi&#7875;n D&#7889;c L&#7871;t &#8211; m&#7897;t trong nh&#7919;ng b&#227;i bi&#7875;n &#273;&#7865;p nh&#7845;t Vi&#7879;t Nam. B&#234;n c&#7841;nh nh&#7919;ng bungalow ph&#7909;c v&#7909; kh&#225;ch l&#432;u tr&#250;, TTC Resort - D&#7889;c L&#7871;t c&#242;n s&#7903; h&#7919;u r&#7915;ng ph&#432;&#7907;ng r&#7897;ng tr&#234;n 3 ha, l&#224; n&#417;i th&#237;ch h&#7907;p cho nh&#7919;ng nh&#243;m b&#7841;n check in, c&#7855;m tr&#7841;i, th&#432;&#7903;ng th&#7913;c BBQ v&#224; t&#7893; ch&#7913;c ti&#7879;c c&#432;&#7899;i ngo&#224;i tr&#7901;i. &#272;&#7863;c bi&#7879;t, TTC Resort &#8211; D&#7889;c L&#7871;t c&#361;ng c&#243; v&#432;&#7901;n th&#250; thu nh&#7887; Tiny Zoo v&#7899;i nh&#7919;ng lo&#7841;i th&#250; &#273;&#225;ng y&#234;u, gi&#250;p du kh&#225;ch c&#243; th&#234;m nhi&#7873;u tr&#7843;i nghi&#7879;m vui ch&#417;i khi &#273;&#7871;n &#273;&#226;y.



TTC Mekong Aqua Park l&#224; c&#244;ng vi&#234;n n&#432;&#7899;c &#273;&#7847;u ti&#234;n t&#7841;i B&#7871;n Tre v&#7899;i nhi&#7873;u h&#7841;ng m&#7909;c tr&#242; ch&#417;i n&#432;&#7899;c h&#7845;p d&#7851;n, &#273;&#225;p &#7913;ng nhu c&#7847;u &#8220;gi&#7843;i nhi&#7879;t&#8221; cho kh&#225;ch &#273;&#7883;a ph&#432;&#417;ng c&#361;ng nh&#432; du kh&#225;ch nh&#7919;ng v&#249;ng l&#226;n c&#7853;n. B&#234;n c&#7841;nh &#273;&#243;, TTC Mekong Aqua Park c&#242;n c&#243; v&#432;&#7901;n th&#250; t&#432;&#417;ng t&#225;c Tiny Zoo, khu foodcourt v&#224; khu &#7849;m th&#7921;c &#273;&#225;p &#7913;ng nhu c&#7847;u &#259;n u&#7889;ng cho nh&#243;m kh&#225;ch.

		<script type="text/javascript">
		function parseParams(paramsString, params) {
			paramsString = paramsString.substring(1);
			var firstSeparatorPos = paramsString.indexOf(",");
			if (firstSeparatorPos != -1) {
				params.startNode = paramsString.slice(0, firstSeparatorPos);
				var viewingParamsString = paramsString.slice(firstSeparatorPos + 1);
				var viewingParams = viewingParamsString.split(",");
				if (viewingParams.length >= 3) {
					var startView = {};
					startView["pan"] = viewingParams[0];
					startView["tilt"] = viewingParams[1];
					startView["fov"] = viewingParams[2];
					if (viewingParams.length >= 4) {
						startView["projection"] = viewingParams[3];
					}
					params.startView = startView;
				}
			} else {
				params.startNode = paramsString;
				params.startView = "";
			}
		}
		var params = {};
		parseParams(document.location.hash, params);
		var startNode = params.startNode;
		var startView = params.startView;
		if (("onhashchange" in window) && (!(/MSIE (\d+\.\d+);/.test(navigator.userAgent)))) {
			window.onhashchange = function () {
				parseParams(window.location.hash, params);
				pano.openNext('{' + params.startNode + '}', params.startView);
			}
		} else {
			var lastHash = window.location.hash;
			window.setInterval(function () {
				if (window.location.hash != lastHash) {
					lastHash = window.location.hash;
					parseParams(window.location.hash, params);
					pano.openNext('{' + params.startNode + '}', params.startView);
				}
			}, 100);
		}
			// create the panorama player with the container
			pano=new pano2vrPlayer("container");
			pano.startNode = startNode;
			pano.startView = startView;
			pano.setQueryParameter("ts=12845908")
			// add the skin object
			skin=new pano2vrSkin(pano);
			// load the configuration
			window.addEventListener("load", function() {
				pano.readConfigUrlAsync("pano.xml?ts=12845908");
			});
			if (window.navigator.userAgent.match(/Safari/i)) {
				// fix for white borders, rotation on iPhone
				function iosHfix(e) {
					window.scrollTo(0, 1);
					var container=document.getElementById("container");
					var oh=container.offsetHeight;
					document.documentElement.style.setProperty('height', '100vh');
					if (oh!=container.offsetHeight) {
						container.style.setProperty('height',"100%");
					} else {
						container.style.setProperty('height',window.innerHeight+"px");
					}
					window.scrollTo(0, 0);
					pano.setViewerSize(container.offsetWidth, container.offsetHeight);
				};
				setTimeout(iosHfix,0);
				setTimeout(iosHfix,100);
				window.addEventListener("resize", function() {
					setTimeout(iosHfix,0);
					// hide toolbar on iPad happens with a delay
					setTimeout(iosHfix,500);
					setTimeout(iosHfix,1000);
					setTimeout(iosHfix,2000);
				});
			}
		</script>
