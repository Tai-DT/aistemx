		<script type="text/javascript">
		function parseParams(paramsString, params) {
			paramsString = paramsString.substring(1);
			var firstSeparatorPos = paramsString.indexOf(",");
			if (firstSeparatorPos != -1) {
				params.startNode = paramsString.slice(0, firstSeparatorPos);
				var viewingParamsString = paramsString.slice(firstSeparatorPos + 1);
				var viewingParams = viewingParamsString.split(",");
				if (viewingParams.length >= 3) {
					var startView = {};
					startView["pan"] = viewingParams[0];
					startView["tilt"] = viewingParams[1];
					startView["fov"] = viewingParams[2];
					if (viewingParams.length >= 4) {
						startView["projection"] = viewingParams[3];
					}
					params.startView = startView;
				}
			} else {
				params.startNode = paramsString;
				params.startView = "";
			}
		}
		var params = {};
		parseParams(document.location.hash, params);
		var startNode = params.startNode;
		var startView = params.startView;
		if (("onhashchange" in window) && (!(/MSIE (\d+\.\d+);/.test(navigator.userAgent)))) {
			window.onhashchange = function () {
				parseParams(window.location.hash, params);
				pano.openNext('{' + params.startNode + '}', params.startView);
			}
		} else {
			var lastHash = window.location.hash;
			window.setInterval(function () {
				if (window.location.hash != lastHash) {
					lastHash = window.location.hash;
					parseParams(window.location.hash, params);
					pano.openNext('{' + params.startNode + '}', params.startView);
				}
			}, 100);
		}
			// create the panorama player with the container
			pano=new pano2vrPlayer("container");
			pano.startNode = startNode;
			pano.startView = startView;
			pano.setQueryParameter("ts=8016798")
			// add the skin object
			skin=new pano2vrSkin(pano);
			// add the vrskin object
			vrskin=new pano2vrVrSkin(pano);
			// load the configuration
			window.addEventListener("load", function() {
				pano.readConfigUrlAsync("pano.xml?ts=8016798");
			});
			if (window.navigator.userAgent.match(/Safari/i)) {
				// fix for white borders, rotation on iPhone
				function iosHfix(e) {
					window.scrollTo(0, 1);
					var container=document.getElementById("container");
					var oh=container.offsetHeight;
					document.documentElement.style.setProperty('height', '100vh');
					if (oh!=container.offsetHeight) {
						container.style.setProperty('height',"100%");
					} else {
						container.style.setProperty('height',window.innerHeight+"px");
					}
					window.scrollTo(0, 0);
					pano.setViewerSize(container.offsetWidth, container.offsetHeight);
				};
				setTimeout(iosHfix,0);
				setTimeout(iosHfix,100);
				window.addEventListener("resize", function() {
					setTimeout(iosHfix,0);
					// hide toolbar on iPad happens with a delay
					setTimeout(iosHfix,500);
					setTimeout(iosHfix,1000);
					setTimeout(iosHfix,2000);
				});
			}
			// -----------------------------------------
// TỰ ĐỘNG QUẢN LÝ ÂM THANH PANO2VR (BẢN "CHÂN ÁI +1")
// - Core: visibilitychange (chuyển tab/minimize) – giữ nguyên logic gốc
// - Bổ sung: focus/blur (chuyển app/Alt+Tab) mà không xung đột
// - Debounce nhẹ để tránh gọi duplicate khi events chồng (e.g., chuyển tab trigger cả 2)
// - Chờ pano ready để tránh lỗi API
// -----------------------------------------
let wasPlaying = false;
let lastActionTime = 0; // Timestamp để debounce (tránh gọi liên tục trong 100ms)
const DEBOUNCE_MS = 100; // Ngăn duplicate calls
// Hàm helper: Kiểm tra có nên hành động không (debounce)
function shouldAct() {
    const now = Date.now();
    if (now - lastActionTime < DEBOUNCE_MS) return false;
    lastActionTime = now;
    return true;
}
// Hàm tắt âm thanh (chung cho tất cả events)
function pauseIfReady() {
    if (!shouldAct() || typeof pano === 'undefined' || !pano.getVariableValue) return;
    try {
        wasPlaying = pano.getVariableValue('sound') || false;
        pano.setVariableValue('sound', false);
        console.log('[PANO SOUND] Tắt (debounced)'); // Optional: Bật/tắt log dễ dàng
    } catch (e) {
        console.warn('[PANO SOUND] Lỗi tắt:', e);
    }
}
// Hàm bật lại âm thanh (chung cho tất cả events)
function resumeIfReady() {
    if (!shouldAct() || typeof pano === 'undefined' || !pano.setVariableValue) return;
    try {
        if (wasPlaying) {
            pano.setVariableValue('sound', true);
            console.log('[PANO SOUND] Bật lại (debounced)'); // Optional: Log
        }
    } catch (e) {
        console.warn('[PANO SOUND] Lỗi bật:', e);
    }
}
// Chờ Pano2VR ready rồi mới gắn events (an toàn hơn window.load)
function initSoundControl() {
    // Core gốc: visibilitychange cho chuyển tab/minimize
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            pauseIfReady();
        } else {
            resumeIfReady();
        }
    });
    // Bổ sung: focus/blur cho chuyển app (Alt+Tab, Cmd+Tab, mở Start Menu)
    window.addEventListener('blur', pauseIfReady);
    window.addEventListener('focus', resumeIfReady);
}
// Trigger init khi Pano2VR ready (ưu tiên ggOnInit nếu dùng skin; fallback load)
if (window.ggOnInit) {
    window.ggOnInit = (function(original) {
        return function() {
            original && original();
            initSoundControl();
        };
    })(window.ggOnInit);
} else {
    window.addEventListener('load', initSoundControl);
}
