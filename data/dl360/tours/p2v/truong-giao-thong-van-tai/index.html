<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0">
  <title>Trường Đại Học Giao Thông Vận Tải</title>

  <meta name="description" content="Trường Đại học Giao thông vận tải TP. Hồ Chí Minh trực thuộc Bộ Xây dựng là trường đại học đa ngành thuộc lĩnh vực giao thông vận tải lớn nhất phía Nam Việt Nam. Trường có nhiệm vụ đào tạo nguồn nhân lực cho lĩnh vực giao thông vận tải như hàng hải, hàng không, đường bộ, đường thuỷ nội địa, đường sắt.">
  <meta property="og:title" content="Trường Đại Học Giao Thông Vận Tải">
  <meta property="og:description" content="Trường Đại học Giao thông vận tải TP. Hồ Chí Minh trực thuộc Bộ Xây dựng là trường đại học đa ngành thuộc lĩnh vực giao thông vận tải lớn nhất phía Nam Việt Nam. Trường có nhiệm vụ đào tạo nguồn nhân lực cho lĩnh vực giao thông vận tải như hàng hải, hàng không, đường bộ, đường thuỷ nội địa, đường sắt.">
  <meta property="og:image" content="../assets/og_image/og_image.jpg?v=260617_090705">

  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="skin.css">
</head>
<body>

<div id="container" style="width:100%;height:100%;overflow:hidden;"></div>

<!-- Pano2VR engine -->
<script src="./pano2vr_player.js"></script>
<!-- Skin config (generated per-project) -->
<script src="config.js"></script>
<!-- Lottie (optional — chỉ có khi Pano2VR project dùng Lottie animation) -->
<script src="3rdparty/lottie/lottie.min.js"></script>
<!-- Pano2VR skin (KTV gen từ Skin Editor — chứa map, Lottie hotspot) -->
<script src="skin.js"></script>
<script src="polygon-runtime.js"></script>
<!-- Skin UI: shared overlay (dùng chung mọi project) -->
<script src="skin-ui.js"></script>

<script>
  var pano   = new pano2vrPlayer('container');
  var skin   = new pano2vrSkin(pano);
  var skinui = new pano2vrSkinUI(pano);

  // Apply brand colors từ config
  var colors = window.SKIN_CONFIG && window.SKIN_CONFIG.brand && window.SKIN_CONFIG.brand.colors;
  if (colors) {
    var r = document.documentElement;
    if (colors.primary)   r.style.setProperty('--color-primary',   colors.primary);
    if (colors.secondary) r.style.setProperty('--color-secondary',  colors.secondary);
    if (colors.accent)    r.style.setProperty('--color-accent',     colors.accent);
    if (colors.colorText) r.style.setProperty('--color-text',      colors.colorText);
    if (colors.glassBg)   r.style.setProperty('--glass-bg',        colors.glassBg);
  }

  window.addEventListener('load', function() {
    pano.readConfigUrlAsync('./pano.xml');
  });

  // Hash navigation
  if ('onhashchange' in window) {
    window.onhashchange = function() {
      var hash = window.location.hash.substring(1);
      if (hash) pano.openNext('{' + hash + '}', '');
    };
  }
</script>

</body>
</html>
