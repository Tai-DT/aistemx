    <style>
        html, body {
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .fill-viewport {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
        }

        #viewer {
            z-index: 1;
        }

        #preloadContainer {
            z-index: 2;
            opacity: 1;
            background-color: rgba(153, 153, 153, 0.32);
            transition: opacity 0.5s;
        }

        /* Ảnh giữa màn hình */
        .center-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-image: url('loading/HTMLImage_7E9B98F3_5F8E_5CAD_41C7_517E2C60D4FC.png');
            background-repeat: no-repeat;
            background-size: contain;
            background-position: center;
            width: 10vw;
            height: 10vw;
        }

        /* Kích thước ảnh to hơn trên mobile */
        @media (max-width: 768px) {
            .center-image {
                width: 30vw;
                height: 30vw;
            }
        }

        /* Chữ nằm phía trên ảnh */
        .overlay-text {
            position: absolute;
            top: 15%;
            width: 100%;
            text-align: center;
            z-index: 5;
            font-size: 3.5vmax;
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
            color: #00ff00;
