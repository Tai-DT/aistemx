		<meta property="og:description" content="R&#7915;ng d&#7915;a 7 m&#7851;u l&#224; khu du l&#7883;ch sinh th&#225;i kh&#225; h&#7845;p d&#7851;n, v&#7899;i kh&#244;ng gian xanh m&#225;t b&#7841;t ng&#224;n d&#7915;a n&#432;&#7899;c,tr&#7843;i r&#7897;ng t&#7899;i t&#7853;n c&#7917;a &#273;&#7841;i. V&#224; c&#225;ch ph&#7889; c&#7893; H&#7897;i An 3km v&#7873; h&#432;&#7899;ng &#272;&#244;ng Nam, l&#224; 1 v&#249;ng h&#7841; l&#432;u c&#7911;a 3 con s&#244;ng l&#7899;n:Thu B&#7891;n, C&#7893; C&#242; v&#224; Tr&#432;&#7901;ng Giang.  

   V&#7899;i C&#225;i t&#234;n r&#7915;ng d&#7915;a 7 m&#7851;u n&#224;y b&#7855;t ngu&#7891;n t&#7915; ch&#237;nh ng&#432;&#7901;i d&#226;n &#7903; l&#224;ng Thanh Ch&#226;u khi x&#432;a c&#243; ngh&#7873; bu&#244;n ghe b&#7847;u n&#7893;i ti&#7871;ng,m&#7895;i chuy&#7871;n bu&#244;n &#273;i h&#224;ng th&#225;ng tr&#7901;i. M&#7897;t s&#7889; th&#432;&#417;ng l&#225;i v&#224;o Nam B&#7897; v&#224; &#273;em c&#226;y d&#7915;a n&#432;&#7899;c v&#7873; tr&#7891;ng &#7903; C&#7849;m Thanh. Th&#7845;y c&#226;y d&#7915;a n&#432;&#7899;c sinh tr&#432;&#7903;ng t&#7889;t n&#234;n ch&#237;nh th&#7913;c xin ch&#237;nh quy&#7873;n tr&#7891;ng 7 m&#7851;u d&#7915;a n&#432;&#7899;c,t&#7915; &#273;&#243; c&#243; t&#234;n r&#7915;ng d&#7915;a 7 m&#7851;u, nh&#432;ng th&#7921;c t&#7871; r&#7915;ng d&#7915;a C&#7849;m Thanh &#273;&#227; ph&#225;t tri&#7875;n th&#224;nh h&#224;ng tr&#259;m m&#7851;u( theo s&#7889; l&#432;&#7907;ng th&#7889;ng k&#234; n&#259;m 2017 th&#236; c&#243; 118 hecta r&#7915;ng d&#7915;a, trong &#273;&#243; c&#243; 26 hecta r&#7915;ng tr&#7891;ng 1 n&#259;m tu&#7893;i theo d&#7885;c c&#7847;u C&#7917;a &#272;&#7841;i) 

    C&#7849;m Thanh l&#224; bi&#7875;u hi&#7879;n &#273;i&#7875;n h&#236;nh c&#7911;a h&#7879; sinh th&#225;i r&#7915;ng ng&#7853;p m&#7863;n c&#7917;a s&#244;ng ven bi&#7875;n mi&#7873;n trung... v&#7899;i c&#225;c h&#7879; sinh th&#225;i &#273;i&#7875;n h&#236;nh c&#7911;a v&#249;ng nhi&#7879;t &#273;&#7899;i l&#224; r&#7915;ng ng&#7853;p m&#7863;n v&#224; c&#7887; bi&#7875;n. L&#224; v&#249;ng &#273;&#7865;m c&#7911;a khu d&#7921; tr&#7919; sinh quy&#7875;n th&#7871; gi&#7899;i C&#249; Lao Ch&#224;m- H&#7897;i An. R&#7915;ng d&#7915;a 7 m&#7851;u c&#243; h&#7879; sinh th&#225;i ng&#7853;p m&#7863;n g&#7847;n bi&#7875;n tr&#249; ph&#250; l&#224; n&#7899; c&#432; tr&#250;,sinh s&#7889;ng c&#7911;a nhi&#7873;u lo&#7841;i &#273;&#7897;ng v&#7853;t c&#243; gi&#225; tr&#7883;,nh&#7845;t l&#224;:t&#244;m,cua ,c&#225;,...v&#224; c&#225;c lo&#7841;i th&#7921;c v&#7853;t th&#226;n m&#7873;m c&#249;ng 1 s&#7889; lo&#224;i chim. N&#417;i &#273;&#226;y c&#242;n &#273;&#243;ng 1 vai tr&#242; nh&#432; 1 m&#225;y l&#7885;c sinh h&#7885;c,gi&#250;p l&#224;m &#273;i&#7873;u h&#242;a kh&#237; h&#7853;u,ch&#7889;ng x&#243;i l&#7903;,gia t&#259;ng tr&#7847;m t&#237;ch, n&#226;ng cao ch&#7845;t l&#432;&#7907;ng m&#244;i tr&#432;&#7901;ng, duy tr&#236; c&#226;n b&#7857;ng sinh th&#225;i. 

 

   V&#7899;i &#273;&#7883;a h&#236;nh l&#224; r&#7915;ng d&#7915;a ng&#7853;p m&#7863;n k&#237;n &#273;&#225;o,s&#244;ng n&#432;&#7899;c bao b&#7885;c n&#234;n r&#7845;t thu&#7853;n l&#7907;i cho vi&#7879;c chi&#7871;n tranh du k&#237;ch. Trong nh&#7919;ng n&#259;m th&#225;ng chi&#7871;n tranh ch&#7889;ng th&#7921;c d&#226;n Ph&#225;p v&#224; &#273;&#7871; qu&#7889;c M&#7929;,qu&#226;n v&#224; d&#226;n H&#7897;i An &#273;&#227; ch&#7885;n n&#417;i &#273;&#226;y l&#224;m c&#259;n c&#7913; &#273;&#7883;a c&#225;ch m&#7841;ng &#273;&#7875; chi&#7871;n &#273;&#7845;u ch&#7889;ng k&#7867; th&#249; v&#7899;i nhi&#7873;u chi&#7871;n c&#244;ng vang d&#7897;i. Tuy nhi&#234;n tr&#7843;i qua th&#7901;i gian t&#7891;n t&#7841;i kh&#225; l&#226;u n&#234;n h&#7847;u h&#7871;t c&#225;c c&#244;ng tr&#236;nh n&#224;y &#273;&#227; kh&#244;ng c&#242;n. &#272;&#7863;c bi&#7879;t trong kh&#225;ng chi&#7871;n ch&#7889;ng M&#7929; r&#7915;ng d&#7915;a 7 m&#7851;u c&#361;ng tr&#7903; th&#224;nh c&#259;n c&#7913; v&#7919;ng ch&#7855;c, n&#417;i che ch&#7903;, b&#7843;o t&#7891;n l&#7921;c l&#432;&#7907;ng v&#361; trang c&#7911;a ta &#273;&#7875; chi&#7871;n &#273;&#7845;u,chi&#7871;n th&#7855;ng k&#7867; th&#249;. &#272;&#234;m 27/9/1964,nh&#226;n d&#226;n C&#7849;m Thanh &#273;&#227; &#273;&#7913;ng l&#234;n nh&#7845;t t&#7873; &#273;&#7891;ng kh&#7903;i. V&#7899;i k&#7871; nghi binh d&#249;ng s&#250;ng b&#7865; d&#7915;a,&#273;&#224;n &#225;p qu&#226;n th&#249;. Cu&#7897;c &#273;&#7891;ng kh&#7903;i b&#7857;ng s&#250;ng b&#7865; d&#7915;a&#8221; mang h&#417;i th&#7903; r&#7915;ng d&#7915;a 7 m&#7851;u&#8221;&#273;&#227; &#273;i v&#224;o l&#7883;ch s&#7917; c&#225;ch m&#7841;ng qu&#234; h&#432;&#417;ng H&#7897;i An nh&#432; 1 huy&#7873;n tho&#7841;i. 

      &#8220; &#272;&#7913;ng l&#234;n b&#7857;ng s&#250;ng b&#7865; d&#7915;a. 

Qu&#234; ta &#273;&#7891;ng kh&#7903;i M&#7929; thua, ng&#7909;y nh&#224;o&#8221;   

   V&#226;ng, Chi&#7871;n tranh &#273;&#227; &#273;i qua v&#224; r&#7915;ng d&#7915;a 

7 m&#7851;u l&#224; 1 trong nh&#7919;ng minh ch&#7913;ng g&#7855;n 

li&#7873;n v&#7899;i nh&#7919;ng chi&#7871;n c&#244;ng vang d&#7897;i c&#7911;a qu&#226;n v&#224; d&#226;n H&#7897;i An n&#243;i ri&#234;ng v&#224; d&#226;n Qu&#7843;ng Nam n&#243;i chung. 

    B&#234;n c&#7841;nh &#273;&#243; C&#7849;m Thanh c&#242;n l&#224; n&#417;i h&#7897;i t&#7909; c&#7911;a 1 s&#7889; l&#224;ng ngh&#7873; truy&#7873;n th&#7889;ng n&#7893;i ti&#7871;ng nh&#432;: ngh&#7873; l&#224;m m&#7855;m, ngh&#7873; l&#224;m tranh tre d&#7915;a n&#7913;a, ngh&#234; nu&#244;i y&#7871;n,... 

- H&#225;t h&#242; khoan: t&#7915; xa xa ch&#250;ng ta &#273;&#227; nghe thoang tho&#7843;ng nh&#7919;ng &#273;i&#7879;u h&#242;,nh&#7919;ng c&#226;u h&#225;t c&#7911;a ng&#432;&#7901;i d&#226;n n&#417;i &#273;&#226;y v&#224; &#273;&#226;y c&#361;ng l&#224; lo&#7841;i h&#236;nh v&#259;n h&#243;a phi v&#7853;t th&#7875; &#273;&#432;&#7907;c ng&#432;&#7901;i d&#226;n bao &#273;&#7901;i g&#236;n gi&#7919; v&#224; ph&#225;t huy. Trong &#273;&#243; ngh&#7879; thu&#7853;t h&#225;t b&#7843; tr&#7841;o l&#224; lo&#7841;i h&#236;nh di&#7877;n x&#432;&#7899;ng d&#226;n gian ven bi&#7875;n, l&#224; 1 n&#233;t v&#259;n h&#243;a &#273;&#7897;c &#273;&#225;o c&#7911;a ng&#432;&#7901;i d&#226;n v&#7899;i bi&#7875;n kh&#417;i s&#243;ng gi&#243;. Nh&#7919;ng kh&#250;c ca, &#273;i&#7879;u m&#250;a di&#7877;n t&#7843; th&#225;i &#273;&#7897; cung k&#237;nh, t&#225;i hi&#7879;n c&#244;ng vi&#7879;c &#273;i bi&#7875;n &#273;&#7847;y gian kh&#7893;,kh&#243; nh&#7885;c. Ph&#7843;n chi&#7871;u 1 &#273;&#7901;i s&#7889;ng lao &#273;&#7897;ng, t&#226;m linh ch&#226;n th&#7921;c, tinh t&#7871; c&#7911;a ng&#432;&#7901;i d&#226;n. V&#224; tr&#432;&#7899;c &#273;&#226;y C&#7849;m Thanh l&#224; 1 &#273;&#7883;a ph&#432;&#417;ng ph&#225;t tri&#7875;n v&#7873; ngh&#7873; &#273;&#225;nh b&#7855;t h&#7843;i s&#7843;n b&#7857;ng ghe thuy&#7873;n n&#234;n h&#236;nh th&#7913;c di&#7877;n x&#432;&#7899;ng n&#224;y s&#7899;m &#273;&#432;&#7907;c &#273;&#7883;nh h&#236;nh v&#224; l&#432;u truy&#7873;n. Ngo&#224;i ra n&#417;i &#273;&#226;y c&#242;n l&#432;u tr&#7919; nh&#7919;ng &#273;i&#7879;u h&#242; khoan, &#273;i&#7879;u d&#226;n ca gi&#7843;n d&#7883;,m&#7897;c m&#7841;c v&#224; s&#226;u l&#7855;ng t&#7841;o n&#234;n 1 ng&#244;n ng&#7919; ri&#234;ng ph&#7843;n &#225;nh &#273;&#7901;i s&#7889;ng n&#7897;i t&#226;m phong ph&#250; v&#224; &#273;a d&#7841;ng c&#7911;a ng&#432;&#7901;i d&#226;n n&#417;i &#273;&#226;y v&#224; c&#361;ng l&#224; n&#417;i giao duy&#234;n c&#7911;a nh&#7919;ng nam thanh, n&#7919; t&#250;.  

   H&#236;nh &#7843;nh ng&#432;&#7901;i d&#226;n &#273;ang v&#227;i ch&#224;i hay c&#242;n g&#7885;i l&#224; ch&#224;i l&#432;&#7899;i, ngo&#224;i ngh&#7873; tr&#7891;ng l&#250;a n&#432;&#7899;c, tr&#7891;ng r&#7915;ng ra th&#236; ngh&#7873; ch&#224;i l&#432;&#7899;i c&#361;ng l&#224; 1 ngh&#7873; c&#243; t&#237;nh ch&#7845;t &#273;&#7863;c th&#249; c&#7911;a ng&#432;&#7901;i d&#226;n Vi&#7879;t Nam. N&#243; &#273;&#227; xu&#7845;t hi&#7879;n v&#224; t&#7891;n t&#7841;i theo chi&#7873;u d&#224;i c&#7911;a l&#7883;ch s&#7917; d&#226;n t&#7897;c.Nh&#7919;ng ho&#7841;t &#273;&#7897;ng nh&#432; g&#245; thuy&#7873;n, qu&#259;ng ch&#224;i, k&#233;o ch&#224;i, ph&#226;n lo&#7841;i c&#225; l&#224; nh&#7919;ng vi&#7879;c c&#417; b&#7843;n m&#224; ng&#432;&#7901;i ch&#224;i l&#432;&#7899;i ph&#7843;i l&#224;m. C&#7913; m&#7895;i l&#7847;n m&#7863;t tr&#7901;i l&#7863;n th&#236; ng&#432;&#7901;i d&#226;n ph&#7843;i l&#234;n thuy&#7873;n v&#224; ra kh&#417;i, m&#7863;t tr&#7901;i l&#234;n th&#236; ng&#432;&#7901;i d&#226;n l&#7841;i v&#224;o b&#7901;. Ph&#7847;n th&#432;&#7903;ng m&#224; ng&#432;&#7901;i d&#226;n nh&#7853;n &#273;&#432;&#7907;c t&#7915; bi&#7875;n c&#7843; l&#224; &#273;&#7911; th&#7913; lo&#7841;i th&#7911;y v&#224; h&#7843;i s&#7843;n kh&#225;c nhau nh&#432;: t&#244;m,cua,c&#225;, m&#7921;c...Ch&#224;i l&#432;&#7899;i l&#224; m&#7897;t ngh&#7873; ph&#7843;i l&#234;nh &#273;&#234;nh tr&#234;n s&#244;ng n&#432;&#7899;c v&#236; th&#7871; &#273;a ph&#7847;n l&#224; thanh ni&#234;n trai tr&#225;ng, tr&#7909; c&#7897;t trong gia &#273;&#236;nh tham gia. H&#236;nh &#7843;nh c&#7911;a ng&#432;&#7901;i d&#226;n v&#224; chi&#7871;c thuy&#7873;n &#273;&#227; &#273;i v&#224;o th&#417; ca, c&#226;u h&#225;t h&#242; khoan &#273;&#7853;m ch&#7845;t qu&#234; h&#432;&#417;ng. V&#224; &#273;&#432;&#7907;c g&#236;n gi&#7919; v&#224; l&#432;u truy&#7873;n cho &#273;&#7871;n ng&#224;y nay. 

     Ti&#7871;p theo ch&#250;ng ta th&#432;&#7903;ng th&#7913;c th&#234;m 1 lo&#7841;i h&#236;nh ngh&#7879; thu&#7853;t m&#250;a thuy&#7873;n th&#250;ng &#273;&#7863;c tr&#432;ng ch&#7881; v&#249;ng s&#244;ng n&#432;&#7899;c C&#7849;m Thanh m&#7899;i c&#243;. 

&quot;Thuy&#7873;n th&#250;ng l&#250;ng luy&#7871;n &#273;&#432;a e qua ao. Thuy&#7873;n th&#250;ng nghi&#234;ng nghi&#234;ng.  

Thuy&#7873;n th&#250;ng chao chao. 

C&#7863;p ch&#232;o &#273;&#361;a c&#7843;, 1 kh&#250;c l&#432;&#7899;i l&#417;. 

Gi&#7885;t n&#432;&#7899;c b&#7855;n l&#234;n &#432;&#7899;c c&#7843; m&#225; &#273;&#224;o.&quot; 

     Chi&#7871;c thuy&#7873;n th&#250;ng kh&#244;ng ch&#7881; l&#224; v&#7853;t m&#432;u sinh c&#7911;a ng&#432;&#7901;i d&#226;n, l&#224; v&#7853;t d&#7909;ng &#7849;n ch&#7913;a bao th&#432;&#417;ng nh&#7899;, ch&#7913;ng ki&#7871;n bao th&#259;ng tr&#7847;m, l&#224; h&#236;nh t&#432;&#7907;ng kh&#244;ng th&#7875; thi&#7871;u trong c&#225;c l&#7877; h&#7897;i. M&#250;a thuy&#7873;n th&#250;ng l&#224; m&#7897;t trong nh&#7919;ng tr&#7843;i nghi&#7879;m th&#250; v&#7883; m&#224; n&#7871;u qu&#253; ac b&#7887; qua coi nh&#432; l&#224; m&#7845;t 1 ph&#7847;n tham quan trong chuy&#7871;n &#273;i n&#224;y. ">
